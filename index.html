<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120d0a">
<title>敲矿</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#080605;overflow:hidden;
    -webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif}
  #stage{display:flex;align-items:center;justify-content:center;height:100%}
  #game{display:block;touch-action:none}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="400" height="720"></canvas></div>
<script>
/* ==== src/sim.js ==== */
/* ==========================================================================
   敲矿 · Ore Tap（最直白版）
   核心：点矿壁 → 掉矿 → 用矿买自动产出 → 点得更快/自动更多
   可拓展性：所有可购买项都注册在 NODES 里（每个节点带 cost/req/apply），
   以后加"熔炉/佣兵/附魔"只是往 NODES 里加条目 + 新一屏，不改主循环。
   ========================================================================== */
(function (root) {
  "use strict";

  var CFG = {
    tapBase: 1,
    offlineEff: 0.5,
    offlineCapHours: 8,
    veinEveryMin: 22,      // 矿脉出现的秒数区间
    veinEveryMax: 34,
    veinLife: 4.5,
    veinMul: 12
  };

  /* 可购买项：数据驱动，新增机制只加条目 */
  function makeNodes() {
    return [
      {
        id: "pick", nm: "更好的镐", tip: "每次敲击 +1",
        baseCost: 10, growth: 1.18, tier: 0,
        effect: function (s) { s.tapPower += 1; }
      },
      {
        id: "cart", nm: "矿车", tip: "自动采 +0.5/秒",
        baseCost: 25, growth: 1.16, tier: 0,
        effect: function (s) { s.autoRate += 0.5; }
      },
      {
        id: "drill", nm: "自动镐", tip: "自动采 +2.5/秒",
        baseCost: 180, growth: 1.19, tier: 1,
        req: function (s) { return (s.bought.cart || 0) >= 3; },
        reqText: "需 3 辆矿车",
        effect: function (s) { s.autoRate += 2.5; }
      },
      {
        id: "gloves", nm: "厚手套", tip: "敲击 +3（但自动 -10%）",
        baseCost: 420, growth: 1.22, tier: 1,
        req: function (s) { return (s.bought.pick || 0) >= 5; },
        reqText: "需 5 把镐",
        effect: function (s) { s.tapPower += 3; s.autoRate *= 0.9; }
      }
    ];
  }

  /* 熔炉升级：货币是锭，不是矿 —— 第二条经济腿 */
  function ingotNodes(st) {
    return [
      {
        id: "blower", nm: "鼓风机", tip: "冶炼 -18% 时间", currency: "ingot",
        baseCost: 3, growth: 1.85,
        effect: function (s) { s.furnace.time = Math.max(1.2, s.furnace.time * 0.82); }
      },
      {
        id: "chamber", nm: "大炉膛", tip: "每次投料 20 矿 → 2 锭", currency: "ingot",
        baseCost: 6, growth: 2.0,
        effect: function (s) { s.furnace.batch += 10; s.furnace.ratio = s.furnace.batch; }
      }
    ];
  }

  function newState(seed) {
    var st = {
      t: 0, ore: 0, total: 0,
      tapPower: CFG.tapBase, autoRate: 0,
      bought: {}, taps: 0,
      ingot: 0, ingotTotal: 0,
      furnace: { queue: 0, prog: 0, time: 4.0, batch: 10, ratio: 10, smelted: 0, heat: 0 },
      vein: null, veinT: 8, veinLife: 0,
      lastVein: 0, veins: 0,
      chips: [], pops: [],
      rand: (function (s0) {
        var x = (seed || 12345) >>> 0;
        return function () { x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
      })(seed)
    };
    st.nodes = makeNodes();
    return st;
  }

  function costOf(st, node) {
    var n = st.bought[node.id] || 0;
    return Math.floor(node.baseCost * Math.pow(node.growth, n));
  }

  function allNodes(st) {
    return st.nodes.concat(ingotNodes(st));
  }

  function balanceOf(st, node) {
    return node.currency === "ingot" ? st.ingot : st.ore;
  }

  function canBuy(st, node) {
    if (node.req && !node.req(st)) return false;
    return balanceOf(st, node) >= costOf(st, node);
  }

  function buy(st, id) {
    var node = null, i;
    for (i = 0; i < st.nodes.length; i++) if (st.nodes[i].id === id) node = st.nodes[i];
    if (!node && st) {
      var all = allNodes(st);
      for (i = 0; i < all.length; i++) if (all[i].id === id) node = all[i];
    }
    if (!node || !canBuy(st, node)) return false;
    if (node.currency === "ingot") st.ingot -= costOf(st, node);
    else st.ore -= costOf(st, node);
    st.bought[id] = (st.bought[id] || 0) + 1;
    node.effect(st);
    return true;
  }

  /* 点一下矿壁 */
  function tap(st) {
    st.taps++;
    var v = st.tapPower;
    st.ore += v; st.total += v;
    st.pops.push({ v: v, t: 1, x: 0.2 + st.rand() * 0.6, y: 0.15 + st.rand() * 0.5 });
    for (var i = 0; i < 3; i++) {
      st.chips.push({
        x: 0.2 + st.rand() * 0.6, y: 0.2 + st.rand() * 0.5,
        vx: (st.rand() - 0.5) * 0.9, vy: -0.4 - st.rand() * 0.7,
        life: 0.5 + st.rand() * 0.4, spin: (st.rand() - 0.5) * 8
      });
    }
    // 点到矿脉：大额
    if (st.vein && st.veinLife > 0) {
      var bonus = st.tapPower * CFG.veinMul;
      st.ore += bonus; st.total += bonus;
      st.pops.push({ v: bonus, t: 1.4, x: st.vein.x, y: st.vein.y, big: true });
      st.vein = null; st.veinLife = 0;
      st.veins++;
      return { tap: v, bonus: bonus };
    }
    return { tap: v, bonus: 0 };
  }

  /* 把一批矿投进炉子（拖拽的目标动作） */
  function feed(st) {
    var f = st.furnace;
    if (st.ore < f.batch) return false;
    if (f.queue >= 3) return false;          // 炉子最多排 3 批
    st.ore -= f.batch;
    f.queue++;
    return true;
  }

  function stepFurnace(st, dt) {
    var f = st.furnace;
    f.heat = Math.max(0, f.heat - dt * 0.6);
    if (f.queue <= 0) return;
    f.prog += dt / f.time;
    if (f.prog >= 1) {
      f.prog = 0;
      f.queue--;
      st.ingot += 1;
      st.ingotTotal += 1;
      f.smelted++;
      f.heat = 1;
    }
  }

  function step(st, dt) {
    st.t += dt;

    // 自动产出
    var auto = st.autoRate * dt;
    if (auto > 0) { st.ore += auto; st.total += auto; }

    stepFurnace(st, dt);

    // 矿脉计时
    st.veinT -= dt;
    if (!st.vein && st.veinT <= 0) {
      st.vein = { x: 0.18 + st.rand() * 0.64, y: 0.16 + st.rand() * 0.5, r: 0.055 + st.rand() * 0.02 };
      st.veinLife = CFG.veinLife;
      st.veinT = CFG.veinEveryMin + st.rand() * (CFG.veinEveryMax - CFG.veinEveryMin);
      st.lastVein = st.t;
    }
    if (st.vein) {
      st.veinLife -= dt;
      if (st.veinLife <= 0) { st.vein = null; st.veinT = CFG.veinEveryMin + st.rand() * (CFG.veinEveryMax - CFG.veinEveryMin); }
    }

    // 粒子 / 飘字
    var i;
    for (i = st.chips.length - 1; i >= 0; i--) {
      var c = st.chips[i];
      c.life -= dt;
      c.x += c.vx * dt * 0.35;
      c.y += c.vy * dt * 0.35;
      c.vy += 2.2 * dt * 0.35;
      if (c.life <= 0) st.chips.splice(i, 1);
    }
    for (i = st.pops.length - 1; i >= 0; i--) {
      st.pops[i].t -= dt * (st.pops[i].big ? 0.7 : 1.1);
      st.pops[i].y -= dt * 0.12;
      if (st.pops[i].t <= 0) st.pops.splice(i, 1);
    }
  }

  /* 离线：矿车/自动镐继续干活，按 50% 结算，封顶 8 小时 */
  function settleOffline(st, hours) {
    var used = Math.min(hours, CFG.offlineCapHours);
    if (used <= 0 || st.autoRate <= 0) return 0;
    var gain = st.autoRate * used * 3600 * CFG.offlineEff;
    st.ore += gain; st.total += gain;
    return gain;
  }

  root.OreTap = {
    CFG: CFG, newState: newState, step: step, tap: tap,
    costOf: costOf, canBuy: canBuy, buy: buy, settleOffline: settleOffline,
    feed: feed, allNodes: allNodes, balanceOf: balanceOf, ingotNodes: ingotNodes
  };
})(typeof window !== "undefined" ? window : globalThis);

/* ==== src/game.js ==== */
/* 敲矿 v2 —— 渲染（矿壁 + 熔炉 + 6 项升级） */
(function (root) {
  "use strict";
  var M = root.OreTap, W = 400, H = 720;

  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function fmt(n) {
    if (n < 1000) return Math.round(n).toString();
    var u = ["K", "M", "B", "T"], i = -1;
    while (n >= 1000 && i < 3) { n /= 1000; i++; }
    return (Math.round(n * 10) / 10) + u[i];
  }
  function hash(n) { var x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }

  function Game(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.st = M.newState((Date.now() % 99991) + 7);
    this.offlineMsg = null;
    this.shake = 0;
    this.drag = null;
    this.hintFurnace = 0;
  }

  Game.ROCK = { x: 24, y: 108, w: W - 48, h: 282 };
  Game.FURNACE = { x: 24, y: 398, w: W - 48, h: 46 };

  Game.prototype.save = function () {
    var s = this.st;
    try {
      root.localStorage.setItem("oretap_save", JSON.stringify({
        ore: s.ore, total: s.total, ingot: s.ingot, ingotTotal: s.ingotTotal,
        tapPower: s.tapPower, autoRate: s.autoRate, bought: s.bought,
        taps: s.taps, veins: s.veins, at: Date.now()
      }));
    } catch (e) {}
  };

  Game.prototype.load = function () {
    var raw = null;
    try { raw = root.localStorage.getItem("oretap_save"); } catch (e) {}
    if (!raw) return;
    try {
      var d = JSON.parse(raw), s = this.st;
      s.ore = d.ore || 0; s.total = d.total || 0;
      s.ingot = d.ingot || 0; s.ingotTotal = d.ingotTotal || 0;
      s.tapPower = d.tapPower || 1; s.autoRate = d.autoRate || 0;
      s.bought = d.bought || {}; s.taps = d.taps || 0; s.veins = d.veins || 0;
      var all = M.allNodes(s), i, k, id;
      for (id in s.bought) {
        var n = s.bought[id];
        for (i = 0; i < all.length; i++) {
          if (all[i].id === id) for (k = 0; k < n; k++) all[i].effect(s);
        }
      }
      var hours = Math.max(0, (Date.now() - (d.at || Date.now())) / 3600000);
      if (hours > 0.01 && s.autoRate > 0) {
        var gain = M.settleOffline(s, hours);
        if (gain > 0) this.offlineMsg = { hours: hours, gain: gain };
      }
    } catch (e) {}
  };

  Game.prototype.tapAt = function (x, y) {
    var r = Game.ROCK;
    if (x < r.x || x > r.x + r.w || y < r.y || y > r.y + r.h) return null;
    var res = M.tap(this.st);
    this.shake = res.bonus > 0 ? 1 : 0.45;
    return res;
  };

  Game.prototype.dropAt = function (x, y) {
    var f = Game.FURNACE;
    if (x < f.x - 20 || x > f.x + f.w + 20 || y < f.y - 30 || y > f.y + f.h + 30) return false;
    var ok = M.feed(this.st);
    if (ok) this.hintFurnace = 1;
    return ok;
  };

  Game.prototype.update = function (dt) {
    M.step(this.st, dt);
    if (this.shake > 0) this.shake -= dt * 3;
    if (this.hintFurnace > 0) this.hintFurnace -= dt;
  };

  Game.prototype.draw = function () {
    var g = this.ctx, s = this.st;
    g.clearRect(0, 0, W, H);

    var bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#1a1410");
    bg.addColorStop(0.45, "#120d0a");
    bg.addColorStop(1, "#080605");
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);

    /* HUD */
    g.textAlign = "left"; g.textBaseline = "middle";
    g.fillStyle = "rgba(230,180,110,0.75)";
    g.font = "700 11px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("矿石 ORE", 20, 24);
    g.fillStyle = "#fff2dc";
    g.font = "800 38px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText(fmt(s.ore), 18, 56);
    if (s.autoRate > 0) {
      g.fillStyle = "rgba(140,220,160,0.9)";
      g.font = "700 12px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("+" + s.autoRate.toFixed(1) + "/s", 20, 82);
    }
    g.textAlign = "right";
    g.fillStyle = "rgba(200,220,255,0.7)";
    g.font = "700 11px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("铁锭 INGOT", W - 18, 24);
    g.fillStyle = "#dce9ff";
    g.font = "800 26px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText(fmt(s.ingot), W - 18, 52);
    g.fillStyle = "rgba(190,210,235,0.5)";
    g.font = "600 11px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("每击 +" + s.tapPower + " · 已敲 " + s.taps, W - 18, 76);

    /* 矿壁 */
    var r = Game.ROCK;
    var sh = this.shake > 0 ? (Math.random() - 0.5) * 6 * this.shake : 0;
    g.save();
    g.translate(sh, sh * 0.4);

    var grd = g.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
    grd.addColorStop(0, "#7a6a58");
    grd.addColorStop(0.4, "#5c4e40");
    grd.addColorStop(1, "#3a2f26");
    g.fillStyle = grd;
    g.beginPath();
    var pts = 14;
    for (var i = 0; i < pts; i++) {
      var a = (i / pts) * Math.PI * 2;
      var rad = 0.5 + (hash(i * 3.7 + 1) - 0.5) * 0.09;
      var px = r.x + r.w / 2 + Math.cos(a) * r.w * rad * 0.52;
      var py = r.y + r.h / 2 + Math.sin(a) * r.h * rad * 0.52;
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
    g.fill();
    g.strokeStyle = "rgba(255,196,120,0.45)";
    g.lineWidth = 2.5;
    g.stroke();
    var rim = g.createLinearGradient(0, r.y, 0, r.y + 60);
    rim.addColorStop(0, "rgba(255,220,170,0.16)");
    rim.addColorStop(1, "rgba(255,220,170,0)");
    g.fillStyle = rim;
    g.fill();

    g.strokeStyle = "rgba(255,200,110,0.18)";
    g.lineWidth = 1.2;
    for (var v = 0; v < 7; v++) {
      var sy = r.y + 34 + hash(v * 9.1) * (r.h - 68);
      g.beginPath();
      g.moveTo(r.x + 30, sy);
      g.bezierCurveTo(r.x + r.w * 0.35, sy - 16, r.x + r.w * 0.6, sy + 20, r.x + r.w - 30, sy - 6);
      g.stroke();
    }

    var cracks = Math.min(24, Math.floor(s.taps / 6));
    g.strokeStyle = "rgba(22,15,10,0.6)";
    g.lineWidth = 1.6;
    for (var c = 0; c < cracks; c++) {
      var cx = r.x + r.w * (0.15 + hash(c * 5.3) * 0.7);
      var cy = r.y + r.h * (0.15 + hash(c * 7.7) * 0.7);
      var len = 10 + hash(c * 2.3) * 24;
      g.beginPath();
      g.moveTo(cx, cy);
      g.lineTo(cx + Math.cos(c) * len, cy + Math.sin(c * 1.7) * len);
      g.lineTo(cx + Math.cos(c + 1) * len * 0.7, cy + Math.sin(c + 1) * len * 0.7);
      g.stroke();
    }

    var hcx = r.x + r.w / 2, hcy = r.y + r.h / 2;
    g.strokeStyle = "rgba(255,214,140," + (0.32 + Math.sin(s.t * 2.2) * 0.16) + ")";
    g.lineWidth = 2.5;
    g.beginPath(); g.arc(hcx, hcy, 52 + Math.sin(s.t * 2.2) * 7, 0, 6.283); g.stroke();
    if (s.taps < 6) {
      g.fillStyle = "rgba(255,236,200,0.92)";
      g.font = "800 15px -apple-system,Segoe UI,Roboto,sans-serif";
      g.textAlign = "center";
      g.fillText("点这里挖矿", hcx, hcy);
    }

    if (s.vein) {
      var vx = r.x + r.w * s.vein.x, vy = r.y + r.h * s.vein.y;
      var pulse = 0.6 + Math.sin(s.t * 8) * 0.4;
      var vg = g.createRadialGradient(vx, vy, 2, vx, vy, 34);
      vg.addColorStop(0, "rgba(255,214,110," + (0.85 * pulse) + ")");
      vg.addColorStop(1, "rgba(255,180,60,0)");
      g.fillStyle = vg;
      g.beginPath(); g.arc(vx, vy, 34, 0, 6.283); g.fill();
      g.fillStyle = "#ffe9a8";
      g.beginPath();
      for (var k = 0; k < 6; k++) {
        var ang = k / 6 * 6.283 + s.t;
        var rr2 = 8 + Math.sin(s.t * 4 + k) * 2;
        var qx = vx + Math.cos(ang) * rr2, qy = vy + Math.sin(ang) * rr2;
        if (k === 0) g.moveTo(qx, qy); else g.lineTo(qx, qy);
      }
      g.closePath(); g.fill();
    }

    for (var ch = 0; ch < s.chips.length; ch++) {
      var chip = s.chips[ch];
      g.globalAlpha = Math.min(1, chip.life * 2);
      g.fillStyle = "#c79a5e";
      g.save();
      g.translate(r.x + r.w * chip.x, r.y + r.h * chip.y);
      g.rotate(chip.spin * (1 - chip.life));
      g.fillRect(-2.5, -2.5, 5, 5);
      g.restore();
      g.globalAlpha = 1;
    }

    for (var p = 0; p < s.pops.length; p++) {
      var pop = s.pops[p];
      g.globalAlpha = Math.min(1, pop.t);
      g.fillStyle = pop.big ? "#ffd24a" : "#fff0d0";
      g.font = (pop.big ? "800 26px " : "800 17px ") + "-apple-system,Segoe UI,Roboto,sans-serif";
      g.textAlign = "center";
      g.fillText("+" + fmt(pop.v), r.x + r.w * pop.x, r.y + r.h * pop.y);
      g.globalAlpha = 1;
    }
    g.restore();

    /* ===== 熔炉 ===== */
    var f = Game.FURNACE, fz = s.furnace;
    var near = !!this.drag && this.drag.x > f.x - 24 && this.drag.x < f.x + f.w + 24 &&
               this.drag.y > f.y - 34 && this.drag.y < f.y + f.h + 34;
    rr(g, f.x, f.y, f.w, f.h, 12);
    var fg = g.createLinearGradient(f.x, f.y, f.x, f.y + f.h);
    fg.addColorStop(0, near ? "rgba(255,140,60,0.5)" : "rgba(70,50,40,0.55)");
    fg.addColorStop(1, "rgba(30,20,16,0.88)");
    g.fillStyle = fg;
    g.fill();
    g.strokeStyle = near ? "rgba(255,200,120,0.95)" : "rgba(255,170,90,0.35)";
    g.lineWidth = near ? 2.4 : 1.4;
    rr(g, f.x, f.y, f.w, f.h, 12);
    g.stroke();

    var heat = 0.3 + fz.heat * 0.7 + (fz.queue > 0 ? 0.2 : 0);
    var fireGlow = g.createRadialGradient(f.x + 42, f.y + f.h / 2, 4, f.x + 42, f.y + f.h / 2, 44);
    fireGlow.addColorStop(0, "rgba(255,160,60," + (0.55 * heat) + ")");
    fireGlow.addColorStop(1, "rgba(255,120,40,0)");
    g.fillStyle = fireGlow;
    g.beginPath(); g.arc(f.x + 42, f.y + f.h / 2, 44, 0, 6.283); g.fill();

    g.fillStyle = "rgba(18,10,6,0.92)";
    rr(g, f.x + 22, f.y + 10, 40, f.h - 20, 8); g.fill();
    var fillH = (f.h - 22) * Math.min(1, fz.prog);
    g.fillStyle = "rgba(255," + Math.round(120 + heat * 110) + ",60,0.9)";
    rr(g, f.x + 25, f.y + f.h - 12 - fillH, 34, Math.max(2, fillH), 5);
    g.fill();

    // 炉口进度环
    var mcx = f.x + 42, mcy = f.y + f.h / 2;
    g.strokeStyle = "rgba(255,180,90,0.18)";
    g.lineWidth = 3;
    g.beginPath(); g.arc(mcx, mcy, 26, 0, 6.283); g.stroke();
    if (fz.queue > 0) {
      g.strokeStyle = "rgba(255,205,110,0.95)";
      g.lineWidth = 3;
      g.beginPath();
      g.arc(mcx, mcy, 26, -1.5708, -1.5708 + 6.283 * Math.min(1, fz.prog));
      g.stroke();
    }
    // 排队槽位（3 格）
    for (var q = 0; q < 3; q++) {
      var qx = f.x + 84 + q * 14;
      rr(g, qx, f.y + 31, 12, 10, 2);
      g.fillStyle = q < fz.queue ? "rgba(255,190,100,0.95)" : "rgba(255,255,255,0.12)";
      g.fill();
    }

    g.textAlign = "left";
    g.fillStyle = "rgba(255,228,195,0.95)";
    g.font = "800 13px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("熔炉", f.x + 76, f.y + 14);
    g.fillStyle = near ? "rgba(255,210,150,0.95)" : "rgba(230,200,170,0.6)";
    g.font = "600 10.5px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText(near ? "松手投料！" : "把矿石拖进来（" + fz.batch + " 矿 → 1 锭）", f.x + 76, f.y + 31);

    g.textAlign = "right";
    if (fz.queue > 0) {
      g.fillStyle = "rgba(255,180,100,0.95)";
      g.font = "800 12px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("冶炼 " + Math.round(fz.prog * 100) + "%", f.x + f.w - 14, f.y + 18);
      g.fillStyle = "rgba(220,190,160,0.55)";
      g.font = "600 10px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("排队 " + (fz.queue - 1), f.x + f.w - 14, f.y + 32);
    } else {
      g.fillStyle = "rgba(200,170,140,0.5)";
      g.font = "600 10.5px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("空闲", f.x + f.w - 14, f.y + 24);
    }

    /* 首次提示：告诉玩家"拖"这个动作 */
    if (s.ingotTotal === 0 && s.furnace.smelted === 0 && !this.drag) {
      g.textAlign = "center";
      g.fillStyle = "rgba(255,220,170,0.55 + Math.sin(s.t * 2.6) * 0.2)";
      g.font = "700 11px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("↑ 按住矿石，往下拖进炉子 ↑", W / 2, Game.ROCK.y + Game.ROCK.h + 10);
    }

    /* 拖拽矿块 */
    if (this.drag) {
      g.save();
      g.translate(this.drag.x, this.drag.y);
      g.rotate(Math.sin(s.t * 6) * 0.12);
      g.fillStyle = "#a8834f";
      rr(g, -14, -12, 28, 24, 5); g.fill();
      g.strokeStyle = "rgba(255,225,170,0.8)"; g.lineWidth = 1.2;
      rr(g, -14, -12, 28, 24, 5); g.stroke();
      g.fillStyle = "#2a1d10";
      g.font = "800 11px -apple-system,Segoe UI,Roboto,sans-serif";
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(s.furnace.batch, 0, 0);
      g.restore();
    }

    /* 购买区 */
    g.textBaseline = "middle";
    var all = M.allNodes(s);
    var cards = Game.cardRects(all.length);

    g.textAlign = "left";
    g.fillStyle = "rgba(255,200,130,0.85)";
    g.font = "800 11px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("矿石升级", 22, 458);
    for (var ci = 0; ci < cards.length; ci++) {
      var card = cards[ci], node = all[ci];
      if (!node) continue;
      if (ci === 4) {   // 锭组的分隔与标题
        g.strokeStyle = "rgba(150,190,255,0.14)";
        g.lineWidth = 1;
        g.beginPath(); g.moveTo(22, card.y - 16); g.lineTo(W - 22, card.y - 16); g.stroke();
        g.textAlign = "left";
        g.fillStyle = "rgba(180,210,250,0.85)";
        g.font = "800 11px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText("铁锭升级（熔炉烧出来的）", 22, card.y - 6);
      }
      var owned = s.bought[node.id] || 0;
      var cost = M.costOf(s, node);
      var locked = node.req && !node.req(s);
      var can = !locked && M.balanceOf(s, node) >= cost;
      var isIngot = node.currency === "ingot";

      rr(g, card.x, card.y, card.w, card.h, 10);
      g.fillStyle = can ? (isIngot ? "rgba(110,150,220,0.24)" : "rgba(210,150,60,0.22)") : "rgba(255,255,255,0.035)";
      g.fill();
      g.strokeStyle = can ? (isIngot ? "rgba(150,190,255,0.6)" : "rgba(255,200,110,0.65)") : "rgba(200,160,110,0.14)";
      g.lineWidth = 1.2;
      rr(g, card.x, card.y, card.w, card.h, 10);
      g.stroke();

      g.textAlign = "left";
      g.fillStyle = locked ? "rgba(200,180,160,0.45)" : (can ? "#fff4e2" : "rgba(230,210,190,0.72)");
      g.font = "800 13px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText(node.nm, card.x + 11, card.y + 16);
      if (owned > 0) {
        g.fillStyle = "rgba(255,200,120,0.7)";
        g.font = "800 10px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText("×" + owned, card.x + 11 + g.measureText(node.nm).width + 30, card.y + 16);
      }
      g.fillStyle = "rgba(210,185,160,0.55)";
      g.font = "600 9.5px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText(node.tip, card.x + 11, card.y + 32);

      g.textAlign = "right";
      g.font = "800 12px -apple-system,Segoe UI,Roboto,sans-serif";
      if (locked) {
        g.fillStyle = "rgba(200,180,160,0.4)";
        g.font = "700 9.5px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText(node.reqText || "锁定", card.x + card.w - 11, card.y + 22);
      }
      else if (can) {
        g.fillStyle = isIngot ? "#a8c8ff" : "#ffd24a";
        g.fillText(cost + (isIngot ? " 锭" : " 矿"), card.x + card.w - 11, card.y + 15);
        g.fillStyle = "rgba(255,255,255,0.5)";
        g.font = "700 9px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText("可购买", card.x + card.w - 11, card.y + 28);
      } else {
        g.fillStyle = "rgba(220,200,180,0.4)";
        g.fillText(cost + (isIngot ? " 锭" : " 矿"), card.x + card.w - 11, card.y + 15);
        g.fillStyle = "rgba(255,140,120,0.6)";
        g.font = "700 9px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText("还差 " + Math.ceil(cost - M.balanceOf(s, node)), card.x + card.w - 11, card.y + 28);
      }
    }

    if (this.offlineMsg) {
      var m = this.offlineMsg;
      g.fillStyle = "rgba(6,4,3,0.9)";
      g.fillRect(0, 0, W, H);
      g.textAlign = "center";
      g.fillStyle = "#ffd24a";
      g.font = "800 21px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("矿车替你干了 " + m.hours.toFixed(1) + " 小时", W / 2, H / 2 - 52);
      g.fillStyle = "#fff2dc";
      g.font = "800 30px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("+" + fmt(m.gain) + " 矿石", W / 2, H / 2 - 6);
      g.fillStyle = "rgba(255,255,255,0.45)";
      g.font = "600 11px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("点一下继续", W / 2, H / 2 + 40);
    }
  };

  /* 卡片布局：矿升级 2×2，锭升级 1 行 2 个 */
  Game.cardRects = function (n) {
    var out = [], w = (W - 44 - 8) / 2, x0 = 22, y0 = 470, h = 46;
    for (var i = 0; i < 4; i++) {
      out.push({ i: i, x: x0 + (i % 2) * (w + 8), y: y0 + Math.floor(i / 2) * (h + 6), w: w, h: h });
    }
    for (var j = 4; j < (n || 6); j++) {
      out.push({ i: j, x: x0 + ((j - 4) % 2) * (w + 8), y: y0 + 2 * (h + 6) + 10, w: w, h: h });
    }
    return out;
  };

  root.OreGame = { Game: Game, W: W, H: H, fmt: fmt };

/* ==== src/main.js ==== */
/* 敲矿 v2 —— 启动 / 输入（点矿 + 拖矿进炉） */
(function (root) {
  "use strict";
  var G = root.OreGame, M = root.OreTap, W = G.W, H = G.H;

  var game = null, last = 0, saveAcc = 0;
  var down = null, dragging = false;

  function boot() {
    var canvas = root.document.getElementById("game");
    game = new G.Game(canvas);
    game.load();
    fit(canvas);
    root.addEventListener("resize", function () { fit(canvas); });
    canvas.addEventListener("pointerdown", onDown);
    root.addEventListener("pointermove", onMove);
    root.addEventListener("pointerup", onUp);
    root.addEventListener("pointercancel", onUp);
    root.addEventListener("visibilitychange", function () { if (game) game.save(); });
    last = Date.now();
    loop();
  }

  function fit(canvas) {
    var vw = root.innerWidth || W, vh = root.innerHeight || H;
    var s = Math.min(vw / W, vh / H);
    canvas.style.width = Math.round(W * s) + "px";
    canvas.style.height = Math.round(H * s) + "px";
    canvas._rect = null;
  }

  function toLocal(e) {
    var cv = root.document.getElementById("game");
    if (!cv._rect) cv._rect = cv.getBoundingClientRect();
    var r = cv._rect;
    return { x: (e.clientX - r.left) / (r.width / W), y: (e.clientY - r.top) / (r.height / H) };
  }

  function onDown(e) {
    e.preventDefault();
    var p = toLocal(e);
    if (game.offlineMsg) { game.offlineMsg = null; return; }

    // 升级卡：点一下就买
    var all = M.allNodes(game.st);
    var cards = G.Game.cardRects(all.length);
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) {
        if (all[i]) M.buy(game.st, all[i].id);
        return;
      }
    }

    down = p;
    dragging = false;
  }

  function onMove(e) {
    if (!down) return;
    var p = toLocal(e);
    if (!dragging) {
      var dx = p.x - down.x, dy = p.y - down.y;
      if (dx * dx + dy * dy > 196) {        // 移动超过 14px 算拖拽
        dragging = true;
        game.drag = { x: p.x, y: p.y };
      }
    } else {
      game.drag = { x: p.x, y: p.y };
    }
  }

  function onUp(e) {
    if (!down) return;
    var p = toLocal(e);
    if (dragging) {
      game.dropAt(p.x, p.y);
      game.drag = null;
    } else {
      game.tapAt(p.x, p.y);
    }
    down = null;
    dragging = false;
  }

  function loop() {
    var now = Date.now();
    var dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    game.update(dt);
    game.draw();
    saveAcc += dt;
    if (saveAcc > 4) { saveAcc = 0; game.save(); }
    root.requestAnimationFrame(loop);
  }

  root.API = {
    g: function () { return game; },
    step: function (n, dt) {
      dt = dt || 1 / 60;
      for (var i = 0; i < (n || 1); i++) game.update(dt);
      game.draw();
      return this.info();
    },
    tap: function () { return game.tapAt(W / 2, 240); },
    feed: function () { return M.feed(game.st); },
    buy: function (id) { return M.buy(game.st, id); },
    info: function () {
      var s = game.st, all = M.allNodes(s);
      return {
        ore: Math.round(s.ore * 10) / 10, ingot: s.ingot, total: Math.round(s.total),
        tapPower: s.tapPower, autoRate: Math.round(s.autoRate * 10) / 10,
        taps: s.taps, veins: s.veins, bought: s.bought,
        furnace: { queue: s.furnace.queue, prog: Math.round(s.furnace.prog * 100), time: s.furnace.time, batch: s.furnace.batch, smelted: s.furnace.smelted },
        nodes: all.map(function (n) { return { id: n.id, cost: M.costOf(s, n), can: M.canBuy(s, n), cur: n.currency || "ore" }; }),
        vein: !!s.vein
      };
    }
  };

  if (root.document.readyState === "loading") {
    root.document.addEventListener("DOMContentLoaded", boot);
  } else boot();
})(typeof window !== "undefined" ? window : globalThis);

</script>
