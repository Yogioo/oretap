<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120d0a">
<title>敲矿</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#080605;overflow:hidden;
    -webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif}
  #stage{display:flex;align-items:center;justify-content:center;height:100%}
  #game{display:block;touch-action:none}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="400" height="720"></canvas></div>
<script>
/* ==== src/sim.js ==== */
/* ==========================================================================
   敲矿 · Ore Tap（最直白版）
   核心：点矿壁 → 掉矿 → 用矿买自动产出 → 点得更快/自动更多
   可拓展性：所有可购买项都注册在 NODES 里（每个节点带 cost/req/apply），
   以后加"熔炉/佣兵/附魔"只是往 NODES 里加条目 + 新一屏，不改主循环。
   ========================================================================== */
(function (root) {
  "use strict";

  var CFG = {
    tapBase: 1,
    offlineEff: 0.5,
    offlineCapHours: 8,
    veinEveryMin: 22,      // 矿脉出现的秒数区间
    veinEveryMax: 34,
    veinLife: 4.5,
    veinMul: 12
  };

  /* 可购买项：数据驱动，新增机制只加条目 */
  function makeNodes() {
    return [
      {
        id: "pick", nm: "更好的镐", tip: "每块矿 +1 矿",
        baseCost: 10, growth: 1.18, tier: 0,
        effect: function (s) { s.tapPower += 1; }
      },
      {
        id: "cart", nm: "矿车", tip: "自己挖矿 +0.5 块/秒",
        baseCost: 25, growth: 1.16, tier: 0,
        effect: function (s) { s.autoRate += 0.5; }
      },
      {
        id: "drill", nm: "自动镐", tip: "自己挖矿 +2.5 块/秒",
        baseCost: 180, growth: 1.19, tier: 1,
        req: function (s) { return (s.bought.cart || 0) >= 3; },
        reqText: "需 3 辆矿车",
        effect: function (s) { s.autoRate += 2.5; }
      },
      {
        id: "regen", nm: "矿脉再生", tip: "矿长得更快：-15% 等待",
        baseCost: 120, growth: 1.9, tier: 1,
        req: function (s) { return (s.bought.pick || 0) >= 3; },
        reqText: "需 3 把镐",
        effect: function (s) { s.regenEvery = Math.max(0.18, s.regenEvery * 0.85); }
      }
    ];
  }

  /* 熔炉升级：货币是锭，不是矿 —— 第二条经济腿 */
  function ingotNodes(st) {
    return [
      {
        id: "blower", nm: "鼓风机", tip: "冶炼 -18% 时间", currency: "ingot",
        baseCost: 3, growth: 1.85,
        effect: function (s) { s.furnace.time = Math.max(1.2, s.furnace.time * 0.82); }
      },
      {
        id: "autoforge", nm: "自动锻造", tip: "锭够就自动打武器", currency: "ingot",
        baseCost: 12, growth: 2.2,
        effect: function (s) { s.autoForge += 1; }
      },
      {
        id: "autofeed", nm: "自动投料", tip: "炉子自己吃矿（不用再拖）", currency: "ingot",
        baseCost: 8, growth: 2.6,
        effect: function (s) { s.autoFeed += 1; }
      },
      {
        id: "chamber", nm: "大炉膛", tip: "每次投料 20 矿 → 2 锭", currency: "ingot",
        baseCost: 6, growth: 2.0,
        effect: function (s) { s.furnace.batch += 10; s.furnace.ratio = s.furnace.batch; }
      }
    ];
  }

  var MERC = {
    walk: 2.0,
    back: 1.6,
    swingEvery: 1.3,
    fightLimit: 18,
    dmgPerWeapon: 4,
    lootBase: 6, lootPerWeapon: 3
  };

  /* ============ 装备：每件都是一条"规则" ============ */
  var ITEMS = {
    chain: {
      nm: "连锁剑", slot: "sword", tag: "连锁",
      desc: "击杀后不回城，直接扑下一只",
      rule: "推进最快，但没有回城喘息，容易一头撞穿自己的极限"
    },
    knock: {
      nm: "击退剑", slot: "sword", tag: "击退",
      desc: "不再往深处走，原地反复刷同一层",
      rule: "层数不升，但战利品 ×2.5 —— 用深度换钱"
    },
    sacrifice: {
      nm: "献祭剑", slot: "sword", tag: "献祭",
      desc: "每刀烧 8 矿，伤害 ×3",
      rule: "矿就是弹药，矿断了就砍不动"
    },
    split: {
      nm: "分裂符", slot: "amulet", tag: "分裂",
      desc: "怪物死后裂成 2 只小怪，各掉一份",
      rule: "掉落翻倍，但同一层要多打两轮"
    },
    echo: {
      nm: "回响符", slot: "amulet", tag: "回响",
      desc: "击杀后 40% 概率影子佣兵立刻再打一只",
      rule: "节奏爆发：不用走路就连着杀"
    },
    hoard: {
      nm: "守财符", slot: "amulet", tag: "守财",
      desc: "打不动时不退层，原地挂着刷",
      rule: "挂机专用：不会被弹回去，战利品 +50%"
    },
    cart: {
      nm: "矿车靴", slot: "boots", tag: "运矿",
      desc: "走路的时候也在挖矿",
      rule: "把空转的路上时间变成矿（按层数结算）"
    },
    combo: {
      nm: "连击靴", slot: "boots", tag: "连击",
      desc: "连杀不断档，每 3 连杀下一刀翻倍",
      rule: "越顺越强，被打断就归零"
    }
  };
  var SLOT_NM = { sword: "剑", amulet: "护符", boots: "靴" };
  var DROP_POOL = ["chain", "knock", "sacrifice", "split", "echo", "hoard", "cart", "combo"];

  function monsterHp(st, scale) { return Math.round((18 + 11 * st.depth) * (scale || 1)); }

  /* 把三个槽位的规则汇总成一组开关 */
  function gear(st) {
    var g = {
      instant: false,      // 不回城
      noAdvance: false,    // 不推层
      sacrifice: false,    // 用矿当弹药
      split: false,        // 死后分裂
      echo: false,         // 影子佣兵
      hoard: false,        // 不退层
      cartMine: false,     // 走路产矿
      combo: false         // 连杀加成
    };
    for (var k in st.slots) {
      var id = st.slots[k];
      if (!id) continue;
      if (id === "chain") g.instant = true;
      if (id === "knock") g.noAdvance = true;
      if (id === "sacrifice") g.sacrifice = true;
      if (id === "split") g.split = true;
      if (id === "echo") g.echo = true;
      if (id === "hoard") g.hoard = true;
      if (id === "cart") g.cartMine = true;
      if (id === "combo") g.combo = true;
    }
    return g;
  }

  function makeItem(st, id) {
    var t = ITEMS[id];
    return { id: id, nm: t.nm, slot: t.slot, tag: t.tag, desc: t.desc, rule: t.rule, depth: st.depth };
  }

  /* 掉落：深度越深越容易出，出的是"机制"不是"数值" */
  function rollDrop(st, force) {
    var chance = Math.min(0.8, 0.24 + st.depth * 0.05);
    if (!force && st.rand() > chance) return null;
    var id = DROP_POOL[Math.floor(st.rand() * DROP_POOL.length)];
    var it = makeItem(st, id);
    var slotKey = it.slot;
    // 击退剑会降低推进速度，属于"要玩家自己决定"的装备，不自动穿
    if (!st.slots[slotKey] && id !== "knock") {
      st.slots[slotKey] = id;
      it.equipped = true;
    } else if (st.bag.length < 24) {
      st.bag.push(it);
    } else {
      var refund = 40 + 12 * st.depth;
      st.ore += refund; st.total += refund;
      it.recycled = refund;
      st.dropFx = { t: 1.6, nm: it.nm + "（重复，熔成 " + refund + " 矿）", tag: "" };
    }
    return it;
  }

  /* 穿上背包第 i 件；旧的换回背包（永不丢失） */
  function equip(st, i) {
    var it = st.bag[i];
    if (!it) return false;
    var old = st.slots[it.slot];
    st.slots[it.slot] = it.id;
    st.bag.splice(i, 1);
    if (old) st.bag.push(makeItem(st, old));
    return true;
  }

  /* 兼容旧调用 */
  function withdraw(st) {
    if (st.depth > st.runBest) st.runBest = st.depth;
    return 0;
  }

  function forgeCost(st) { return Math.max(1, Math.floor(1 * Math.pow(1.28, st.weapons))); }
  function canForge(st) { return st.ingot >= forgeCost(st); }
  function forge(st) {
    if (!canForge(st)) return false;
    st.ingot -= forgeCost(st);
    st.weapons++;
    return true;
  }

  function lootOf(st, g, scale) {
    var base = (MERC.lootBase + MERC.lootPerWeapon * st.weapons) * (1 + st.depth * 0.08);
    var mul = 1;
    if (g.noAdvance) mul *= 2.5;          // 击退剑：不推层，钱多
    if (g.hoard && st.stuck) mul *= 1.5;  // 守财符：卡住了也照赚
    if (scale) mul *= scale;              // 分裂出来的小怪
    return Math.max(1, Math.round(base * mul));
  }

  function startFight(st, m, scale) {
    m.phase = "fight";
    m.t = 0;
    m.maxHp = monsterHp(st, scale);
    m.hp = m.maxHp;
    m.dmgT = 0;
    m.scale = scale || 1;
  }

  /* 手动开宝箱：给矿 + 一件装备（这是"点一下有惊喜"的手感） */
  function openChest(st) {
    if (st.chests <= 0) return false;
    st.chests--;
    var gain = 60 + st.depth * 12;
    st.ore += gain; st.total += gain;
    var it = rollDrop(st, true);
    st.chestFx = { t: 2, nm: it ? it.nm : "只有矿 +" + gain, gain: gain };
    return true;
  }

  function killMonster(st, m, g) {
    var loot = lootOf(st, g, m.scale < 1 ? 0.6 : 1);
    if (m === st.merc2) loot = Math.round(loot * 1.6);   // 第二佣兵战利品 +60%
    st.ore += loot; st.total += loot;
    st.kills++;
    m.lastLoot = loot;
    if (g.combo) st.combo++; else st.combo = 0;
    st.stuck = 0;

    // 分裂符：先处理小怪，再考虑推层
    if (g.split && !(m.scale < 1)) {
      st.minisLeft += 2;
    }

    if (hasTalent(st, "t_chest")) {
      st.chestKills++;
      var need = hasTalent(st, "t_lucky") ? 3 : 5;
      if (st.chestKills >= need) { st.chestKills = 0; st.chests++; }
    }
    var got = rollDrop(st);
    if (got) st.dropFx = { t: 1.6, nm: got.nm, tag: got.tag + (got.equipped ? " · 已装备" : "") };

    if (st.minisLeft > 0) {                    // 打分裂出来的小怪，不推层
      st.minisLeft--;
      startFight(st, m, 0.5);
      return;
    }

    if (!g.noAdvance) st.depth++;
    else {
      // 击退剑：慢推——每 3 杀仍进 1 层，避免"卡在 4 层到结束"
      st.knockKills = (st.knockKills || 0) + 1;
      if (st.knockKills >= 3) { st.knockKills = 0; st.depth++; }
    }
    if (st.depth > st.runBest) st.runBest = st.depth;

    // 连锁剑 / 回响符：不回城，直接下一只
    if (g.instant || (g.echo && st.rand() < 0.4)) {
      m.phase = "out"; m.t = 999;              // 下一帧直接接战
    } else {
      m.phase = "back"; m.t = 0; m.hp = 0;
    }
  }

  /* 佣兵状态机：out → fight → back → out（支持多个佣兵） */
  function stepMerc(st, dt) {
    stepMercObj(st, st.merc, dt);
  }

  function stepMercObj(st, m, dt) {
    if (m.t < 0) { m.t += dt; return; }        // 错峰出发
    var g = gear(st);
    m.anim += dt;

    if (m.phase === "out") {
      // 矿车靴：路上时间也在产矿
      if (g.cartMine) {
        // 按"每块价值"给，不按层数（层数无上限，按层数会指数泄漏）
        var gained = Math.max(2, st.tapPower * 0.8) * dt;
        st.ore += gained; st.total += gained;
      }
      m.t += dt;
      if (m.t >= MERC.walk) startFight(st, m, 1);
    } else if (m.phase === "fight") {
      m.t += dt;
      m.dmgT += dt;
      m.swing = Math.max(0, m.swing - dt * 3);

      if (m.dmgT >= MERC.swingEvery) {
        m.dmgT = 0;
        m.swing = 1;
        var base = st.weapons * MERC.dmgPerWeapon;
        if (g.combo && st.combo >= 3) base *= 2;
        var dealt = base;

        if (g.sacrifice) {
          if (st.ore >= 8) { st.ore -= 8; dealt *= 3; st.sacFx = 1; }
          else { st.sacFx = -1; }                // 矿不够：退回普通伤害，不卡死
        }
        dealt = Math.round(dealt);
        if (dealt > 0) {
          m.hp -= dealt;
          st.hitFx.push({ t: 1, d: dealt });
        }
        if (m.hp <= 0) killMonster(st, m, g);
      }

      if (m.phase === "fight" && m.t > MERC.fightLimit) {
        st.retreats++;
        if (g.hoard) {
          st.stuck = 1;                          // 守财符：就地挂着刷
          m.t = 0;
          m.hp = m.maxHp;
        } else {
          st.blockedAt = Math.max(st.blockedAt, st.depth);
          st.depth = Math.max(1, st.depth - 1);
          m.phase = "back"; m.t = 0;
        }
      }
    } else if (m.phase === "back") {
      if (g.cartMine) {
        var g2 = Math.max(2, st.tapPower * 0.8) * dt;
        st.ore += g2; st.total += g2;
      }
      m.t += dt;
      if (m.t >= MERC.back) { m.phase = "out"; m.t = 0; }
    }
  }

  /* ============ 天赋树：节点 = 新系统/新行为 ============ */
  var TALENTS = [
    {
      id: "t_vein", nm: "矿脉常驻", tier: 0, cost: { ore: 120 },
      desc: "矿脉不再消失，点爆后 15 秒重新凝聚",
      req: []
    },
    {
      id: "t_burst", nm: "连点爆破", tier: 0, cost: { ore: 200 },
      desc: "每连点 5 下，第 5 下多爆一次（3 倍）",
      req: []
    },
    {
      id: "t_cart", nm: "矿车自动入站", tier: 1, cost: { ore: 500 },
      desc: "每 30 秒免费来一辆矿车，永远不停工",
      req: ["t_vein"]
    },
    {
      id: "t_merc2", nm: "第二佣兵", tier: 1, cost: { ore: 800, ingot: 5 },
      desc: "再招一个佣兵，两人各下一口井，战利品 +60%",
      req: ["t_cart"]
    },
    {
      id: "t_chest", nm: "宝箱", tier: 2, cost: { ore: 1500, ingot: 10 },
      desc: "每 5 次击杀掉一个宝箱，手点打开：装备 + 一笔矿",
      req: ["t_merc2"]
    },
    {
      id: "t_furnace2", nm: "双炉并列", tier: 2, cost: { ore: 2200, ingot: 12 },
      desc: "第二座熔炉：两批同时烧，排队上限翻倍",
      req: ["t_cart"]
    },
    {
      id: "t_lucky", nm: "宝箱保底", tier: 3, cost: { ore: 3000, ingot: 18 },
      desc: "宝箱改成每 3 杀一个，而且必定开出装备",
      req: ["t_chest"]
    },
    {
      id: "t_offline", nm: "离线专家", tier: 3, cost: { ore: 4000, ingot: 20 },
      desc: "离线上限 8→16 小时，效率 50%→85%",
      req: ["t_furnace2"]
    }
  ];

  function hasTalent(st, id) { return !!st.talents[id]; }
  function talentById(id) { for (var i = 0; i < TALENTS.length; i++) if (TALENTS[i].id === id) return TALENTS[i]; return null; }
  function talentState(st, t) {
    if (st.talents[t.id]) return "owned";
    for (var i = 0; i < t.req.length; i++) if (!st.talents[t.req[i]]) return "locked";
    if (st.ore < (t.cost.ore || 0)) return "poor";
    if (st.ingot < (t.cost.ingot || 0)) return "poor";
    return "ready";
  }
  function buyTalent(st, id) {
    var t = talentById(id);
    if (!t || talentState(st, t) !== "ready") return false;
    st.ore -= (t.cost.ore || 0);
    st.ingot -= (t.cost.ingot || 0);
    st.talents[id] = 1;
    st.talentFx = { t: 2, nm: t.nm };
    return true;
  }

  /* 第二个佣兵对象 */
  function newMerc(offset) {
    return { phase: "out", t: -(offset || 0), hp: 0, maxHp: 0, swing: 0, dmgT: 0, lastLoot: 0, anim: 0, scale: 1 };
  }

  function newState(seed) {
    var st = {
      t: 0, ore: 0, total: 0,
      tapPower: CFG.tapBase, autoRate: 0,
      bought: {}, taps: 0,
      ingot: 0, ingotTotal: 0,
      weapons: 0, kills: 0, retreats: 0,
      merc: { phase: "out", t: 0, hp: 0, maxHp: 0, swing: 0, dmgT: 0, lastLoot: 0, anim: 0 },
      hitFx: [],
      depth: 1, runBest: 1, runs: 0, blockedAt: 1,
      slots: { sword: null, amulet: null, boots: null, ring: null },
      combo: 0, minisLeft: 0, stuck: 0, sacFx: 0,
      talents: {}, chests: 0, chestKills: 0, cartTimer: 0, burstC: 0, talentFx: null,
      merc2: newMerc(1.1),
      bag: [],                 // 本局未装备的掉落
      dropFx: null,
      furnace: { queue: 0, prog: 0, time: 4.0, batch: 10, ratio: 10, smelted: 0, heat: 0 },
      autoForge: 0, weaponDmg: 0, autoFeed: 0,
      vein: null, veinT: 8, veinLife: 0,
      lastVein: 0, veins: 0,
      field: [], regenT: 0, regenEvery: 0.62, forceT: 0, autoAcc: 0, mined: 0, goldMined: 0,
      chips: [], pops: [],
      rand: (function (s0) {
        var x = (seed || 12345) >>> 0;
        return function () { x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
      })(seed)
    };
    st.nodes = makeNodes();
    initField(st, 40);
    return st;
  }

  function costOf(st, node) {
    var n = st.bought[node.id] || 0;
    return Math.floor(node.baseCost * Math.pow(node.growth, n));
  }

  function allNodes(st) {
    return st.nodes.concat(ingotNodes(st));
  }

  function balanceOf(st, node) {
    return node.currency === "ingot" ? st.ingot : st.ore;
  }

  function canBuy(st, node) {
    if (node.req && !node.req(st)) return false;
    return balanceOf(st, node) >= costOf(st, node);
  }

  function buy(st, id) {
    var node = null, i;
    for (i = 0; i < st.nodes.length; i++) if (st.nodes[i].id === id) node = st.nodes[i];
    if (!node && st) {
      var all = allNodes(st);
      for (i = 0; i < all.length; i++) if (all[i].id === id) node = all[i];
    }
    if (!node || !canBuy(st, node)) return false;
    if (node.currency === "ingot") st.ingot -= costOf(st, node);
    else st.ore -= costOf(st, node);
    st.bought[id] = (st.bought[id] || 0) + 1;
    node.effect(st);
    return true;
  }

  /* ============ 矿块区 ============ */
  var FIELD_COLS = 8, FIELD_ROWS = 5;

  function initField(st, n) {
    st.field = [];
    for (var i = 0; i < FIELD_COLS * FIELD_ROWS; i++) st.field.push({ k: 0 });
    for (var j = 0; j < (n || 40); j++) st.field[j].k = st.rand() < 0.08 ? 2 : 1;
    st.regenT = 0;
  }

  function blocksLeft(st) {
    var n = 0;
    for (var i = 0; i < st.field.length; i++) if (st.field[i].k > 0) n++;
    return n;
  }

  function goldLeft(st) {
    var n = 0;
    for (var i = 0; i < st.field.length; i++) if (st.field[i].k === 2) n++;
    return n;
  }

  function blockValue(st, cell) {
    var mul = cell.k === 2 ? 5 : 1;
    return Math.round(st.tapPower * mul);
  }

  /* 挖掉第 i 块（手动和自动都走这里） */
  function mineCell(st, i, byAuto) {
    var cell = st.field[i];
    if (!cell || cell.k <= 0) return 0;
    var v = blockValue(st, cell);
    st.ore += v; st.total += v;
    st.mined++;
    if (cell.k === 2) st.goldMined++;
    st.pops.push({

    var caveBg = g.createRadialGradient(r.x + r.w / 2, r.y + r.h / 2, 20, r.x + r.w / 2, r.y + r.h / 2, r.w * 0.7);
    caveBg.addColorStop(0, "rgba(44,34,26,0.95)");
    caveBg.addColorStop(1, "rgba(16,12,9,0.98)");
    g.fillStyle = caveBg;
    g.fill();
    g.strokeStyle = "rgba(255,190,110,0.18)";
    g.lineWidth = 1.2;
    rr(g, r.x - 4, r.y - 4, r.w + 8, r.h + 8, 14);
    g.stroke();

    for (var bi = 0; bi < s.field.length; bi++) {
      var cell = s.field[bi];
      var bx = r.x + (bi % cols) * cw, by = r.y + Math.floor(bi / cols) * chh;
      var pad = 2.5;
      if (cell.k > 0) {
        var gold = cell.k === 2;
        var bg2 = g.createLinearGradient(bx, by, bx, by + chh);
        if (gold) { bg2.addColorStop(0, "#f0c060"); bg2.addColorStop(0.5, "#d99a35"); bg2.addColorStop(1, "#a86a1e"); }
        else { bg2.addColorStop(0, "#8a7663"); bg2.addColorStop(0.5, "#6b5a49"); bg2.addColorStop(1, "#4a3d31"); }
        g.fillStyle = bg2;
        rr(g, bx + pad, by + pad, cw - pad * 2, chh - pad * 2, 5);
        g.fill();
        // 高光棱面
        g.fillStyle = gold ? "rgba(255,240,190,0.5)" : "rgba(255,230,190,0.22)";
        g.beginPath();
        g.moveTo(bx + pad + 3, by + pad + 3);
        g.lineTo(bx + cw - pad - 6, by + pad + 3);
        g.lineTo(bx + pad + 3, by + chh * 0.55);
        g.closePath();
        g.fill();
        // 金矿闪光
        if (gold) {
          var tw = 0.5 + Math.sin(s.t * 4 + bi) * 0.5;
          g.fillStyle = "rgba(255,255,220," + (0.5 * tw) + ")";
          g.beginPath();
          g.arc(bx + cw * 0.62, by + chh * 0.4, 2.6, 0, 6.283);
          g.fill();
          g.strokeStyle = "rgba(255,230,150,0.55)";
          g.lineWidth = 1;
          rr(g, bx + pad, by + pad, cw - pad * 2, chh - pad * 2, 5);
          g.stroke();
        }
      } else {
        // 挖空：内凹的坑（上暗下亮的反光，读起来是"凹进去"）
        var hx = bx + pad + 1, hy = by + pad + 1, hw = cw - pad * 2 - 2, hh = chh - pad * 2 - 2;
        var pit = g.createLinearGradient(hx, hy, hx, hy + hh);
        pit.addColorStop(0, "rgba(0,0,0,0.62)");
        pit.addColorStop(0.75, "rgba(0,0,0,0.34)");
        pit.addColorStop(1, "rgba(255,190,130,0.06)");
        g.fillStyle = pit;
        rr(g, hx, hy, hw, hh, 4);
        g.fill();
        g.strokeStyle = "rgba(0,0,0,0.5)";
        g.lineWidth = 1.4;
        rr(g, hx, hy, hw, hh, 4);
        g.stroke();
        g.strokeStyle = "rgba(255,200,150,0.07)";
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(hx + 3, hy + hh - 2);
        g.lineTo(hx + hw - 3, hy + hh - 2);
        g.stroke();
      }
    }

    // 碎屑
    for (var ch2 = 0; ch2 < s.chips.length; ch2++) {
      var chip = s.chips[ch2];
      g.globalAlpha = Math.min(1, chip.life * 2);
      g.fillStyle = "#c79a5e";
      g.save();
      g.translate(r.x + r.w * chip.x, r.y + r.h * chip.y);
      g.rotate(chip.spin * (1 - chip.life));
      g.fillRect(-2, -2, 4, 4);
      g.restore();
      g.globalAlpha = 1;
    }

    // 飘字
    for (var p = 0; p < s.pops.length; p++) {
      var pop = s.pops[p];
      g.globalAlpha = Math.min(1, pop.t);
      g.fillStyle = pop.big ? "#ffd24a" : (pop.dust ? "rgba(190,175,155,0.75)" : (pop.auto ? "rgba(150,220,170,0.95)" : "#fff0d0"));
      g.font = (pop.big ? "800 20px " : (pop.dust ? "700 10px " : "800 14px ")) + "-apple-system,Segoe UI,Roboto,sans-serif";
      g.textAlign = "center";
      g.fillText("+" + fmt(pop.v), r.x + r.w * pop.x, r.y + r.h * pop.y);
      g.globalAlpha = 1;
    }
    g.restore();

    if (s.taps < 5) {
      g.textAlign = "center";
      g.fillStyle = "rgba(255,240,210," + (0.6 + Math.sin(s.t * 3) * 0.25) + ")";
      g.font = "800 13px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("点矿块挖矿", r.x + r.w / 2, r.y + r.h / 2 - 8);
    }

    // 矿量 / 再生状态
    var leftN = M.blocksLeft(s);
    g.textAlign = "left";
    g.fillStyle = "rgba(255,214,150,0.75)";
    g.font = "700 10px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("矿块 " + leftN + "/" + s.field.length + (M.goldLeft(s) > 0 ? " · 金 " + M.goldLeft(s) : ""), r.x + 2, r.y - 10);
    if (leftN <= 8) {
      g.textAlign = "center";
      g.fillStyle = "rgba(255,200,130," + (0.55 + Math.sin(s.t * 3) * 0.2) + ")";
      g.font = "800 11.5px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("矿快挖空了 · 每 " + s.regenEvery.toFixed(2) + " 秒长回一块", r.x + r.w / 2, r.y + r.h - 12);
    }

    /* ---------- 熔炉 ---------- */
    var f = Game.FURNACE, fz = s.furnace;
    var near = !!this.drag && this.drag.x > f.x - 24 && this.drag.x < f.x + f.w + 24 &&
               this.drag.y > f.y - 30 && this.drag.y < f.y + f.h + 30;
    rr(g, f.x, f.y, f.w, f.h, 10);
    var fg = g.createLinearGradient(f.x, f.y, f.x, f.y + f.h);
    fg.addColorStop(0, near ? "rgba(255,140,60,0.5)" : "rgba(70,50,40,0.55)");
    fg.addColorStop(1, "rgba(30,20,16,0.88)");
    g.fillStyle = fg;
    g.fill();
    g.strokeStyle = near ? "rgba(255,200,120,0.95)" : "rgba(255,170,90,0.35)";
    g.lineWidth = near ? 2.4 : 1.3;
    rr(g, f.x, f.y, f.w, f.h, 10);
    g.stroke();

    var heat = 0.3 + fz.heat * 0.7 + (fz.queue > 0 ? 0.2 : 0);
    var fireGlow = g.createRadialGradient(f.x + 36, f.y + f.h / 2, 4, f.x + 36, f.y + f.h / 2, 38);
    fireGlow.addColorStop(0, "rgba(255,160,60," + (0.55 * heat) + ")");
    fireGlow.addColorStop(1, "rgba(255,120,40,0)");
    g.fillStyle = fireGlow;
    g.beginPath(); g.arc(f.x + 36, f.y + f.h / 2, 38, 0, 6.283); g.fill();

    g.fillStyle = "rgba(18,10,6,0.92)";
    rr(g, f.x + 18, f.y + 9, 36, f.h - 18, 7); g.fill();
    var fillH = (f.h - 20) * Math.min(1, fz.prog);
    g.fillStyle = "rgba(255," + Math.round(120 + heat * 110) + ",60,0.9)";
    rr(g, f.x + 21, f.y + f.h - 11 - fillH, 30, Math.max(2, fillH), 4); g.fill();

    var mcx = f.x + 36, mcy = f.y + f.h / 2;
    g.strokeStyle = "rgba(255,180,90,0.16)";
    g.lineWidth = 2.5;
    g.beginPath(); g.arc(mcx, mcy, 22, 0, 6.283); g.stroke();
    if (fz.queue > 0) {
      g.strokeStyle = "rgba(255,205,110,0.9)";
      g.beginPath(); g.arc(mcx, mcy, 22, -1.5708, -1.5708 + 6.283 * Math.min(1, fz.prog)); g.stroke();
    }
    for (var q = 0; q < 3; q++) {
      rr(g, f.x + 62 + q * 11, f.y + f.h - 18, 8, 7, 2);
      g.fillStyle = q < fz.queue ? "rgba(255,190,100,0.95)" : "rgba(255,255,255,0.1)";
      g.fill();
    }

    g.textAlign = "left";
    g.fillStyle = "rgba(255,228,195,0.95)";
    g.font = "800 12px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("熔炉", f.x + 96, f.y + 15);
    g.fillStyle = "rgba(230,200,170,0.6)";
    g.font = "600 10px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText(near ? "松手投料！" : (s.autoFeed > 0 ? "自动投料中" : "点一下投一批（" + fz.batch + " 矿 → 1 锭）"), f.x + 96, f.y + 31);
    g.textAlign = "right";
    g.fillStyle = fz.queue > 0 ? "rgba(255,180,100,0.95)" : "rgba(200,170,140,0.5)";
    g.font = "800 11px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText(fz.queue > 0 ? "冶炼 " + Math.round(fz.prog * 100) + "%" : "空闲", f.x + f.w - 12, f.y + 23);

    /* ---------- 佣兵道 ---------- */
    var L = Game.LANE, m = s.merc;
    rr(g, L.x, L.y, L.w, L.h, 12);
    var lg = g.createLinearGradient(L.x, L.y, L.x, L.y + L.h);
    lg.addColorStop(0, "rgba(26,32,30,0.9)");
    lg.addColorStop(1, "rgba(12,16,15,0.95)");
    g.fillStyle = lg;
    g.fill();
    g.strokeStyle = "rgba(140,190,170,0.22)";
    g.lineWidth = 1.2;
    rr(g, L.x, L.y, L.w, L.h, 12);
    g.stroke();

    var roadY = L.y + 56;
    g.strokeStyle = "rgba(255,255,255,0.08)";
    g.lineWidth = 2;
    g.setLineDash([8, 8]);
    g.beginPath(); g.moveTo(L.x + 12, roadY); g.lineTo(L.x + L.w - 12, roadY); g.stroke();
    if (M.hasTalent(s, "t_merc2")) {
      g.strokeStyle = "rgba(255,255,255,0.05)";
      g.beginPath(); g.moveTo(L.x + 12, roadY - 26); g.lineTo(L.x + L.w - 12, roadY - 26); g.stroke();
    }
    g.setLineDash([]);

    // 怪物位置
    var monX = L.x + L.w - 58, monY = roadY - 18;
    // 佣兵位置
    var mercX, mercY = roadY - 16, walking = false;
    if (m.phase === "out") {
      var t1 = Math.min(1, m.t / M.MERC.walk);
      mercX = L.x + 38 + (monX - 44 - (L.x + 38)) * t1; walking = true;
    } else if (m.phase === "fight") {
      mercX = monX - 44;
    } else {
      var t2 = Math.min(1, m.t / M.MERC.back);
      mercX = (monX - 44) - ((monX - 44) - (L.x + 38)) * t2; walking = t2 < 1;
    }
    var bob = walking ? Math.abs(Math.sin(m.anim * 9)) * 3 : 0;

    // 怪物
    if (m.phase === "fight" || m.phase === "out" || (m.phase === "back" && m.t < 0.6)) {
      var mhp = m.phase === "fight" ? Math.max(0, m.hp) : (m.phase === "out" ? 0 : 0);
      var seen = m.phase === "fight";
      if (seen) {
        drBlob(g, monX, monY, s.t, mhp / Math.max(1, m.maxHp));
        // 血条
        g.fillStyle = "rgba(0,0,0,0.5)";
        rr(g, monX - 26, monY - 24, 52, 5, 2); g.fill();
        g.fillStyle = "rgba(230,90,80,0.95)";
        rr(g, monX - 26, monY - 24, 52 * Math.max(0, mhp / Math.max(1, m.maxHp)), 5, 2); g.fill();
      }
    }

    // 佣兵
    drKnight(g, mercX, mercY - bob, m.phase === "fight" ? (m.swing > 0.5 ? 1 : m.swing > 0 ? 0.5 : 0) : -1, s.t);

    // 第二佣兵（天赋解锁后才有）
    if (M.hasTalent(s, "t_merc2")) {
      var m2 = s.merc2, m2x, m2y = roadY - 42;
      if (m2.t < 0) m2x = L.x + 38;
      else if (m2.phase === "out") {
        m2x = L.x + 38 + (monX - 44 - (L.x + 38)) * Math.min(1, m2.t / M.MERC.walk);
      } else if (m2.phase === "fight") m2x = monX - 44;
      else m2x = (monX - 44) - ((monX - 44) - (L.x + 38)) * Math.min(1, m2.t / M.MERC.back);
      var m2x2 = m2x - 34;
      g.fillStyle = "rgba(0,0,0,0.28)";
      g.beginPath(); g.ellipse(m2x2, roadY - 27, 11, 3.5, 0, 0, 6.283); g.fill();
      g.save();
      g.translate(m2x2, roadY - 40);
      g.scale(0.85, 0.85);
      drKnight(g, 0, 0, m2.phase === "fight" ? (m2.swing > 0.5 ? 1 : m2.swing > 0 ? 0.5 : 0) : -1, s.t + 1.3, "rgba(70,120,200,0.9)");
      g.restore();
      g.textAlign = "center";
      g.fillStyle = "rgba(180,215,255,0.9)";
      g.font = "800 9px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("②", m2x2, roadY - 46);
    }

    // 伤害飘字
    for (var hi = 0; hi < s.hitFx.length; hi++) {
      var hf2 = s.hitFx[hi];
      g.globalAlpha = Math.min(1, hf2.t);
      g.fillStyle = "#ffb08a";
      g.font = "800 13px -apple-system,Segoe UI,Roboto,sans-serif";
      g.textAlign = "center";
      g.fillText("-" + hf2.d, monX + 20 + (1 - hf2.t) * 8, monY - 14 - (1 - hf2.t) * 14);
      g.globalAlpha = 1;
    }

    // 掉落飘字
    for (var lf = 0; lf < this.lootFx.length; lf++) {
      var fx = this.lootFx[lf];
      g.globalAlpha = Math.min(1, fx.t);
      g.fillStyle = "#ffd24a";
      g.font = "800 15px -apple-system,Segoe UI,Roboto,sans-serif";
      g.textAlign = "center";
      g.fillText("+" + fx.v + " 矿", L.x + L.w - 12, L.y + 11);
      g.globalAlpha = 1;
    }

    // 开箱提示
    if (s.chestFx && s.chestFx.t > 0) {
      s.chestFx.t -= 0.016;
      g.globalAlpha = Math.min(1, s.chestFx.t);
      g.textAlign = "center";
      g.fillStyle = "#ffd98a";
      g.font = "800 12px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("开出：" + s.chestFx.nm, L.x + L.w - 12, L.y + 36);
      g.globalAlpha = 1;
    }

    // 掉落提示
    if (s.dropFx) {
      g.globalAlpha = Math.min(1, s.dropFx.t);
      g.textAlign = "center";
      g.fillStyle = "#b8e0ff";
      g.font = "800 12px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("掉落：" + s.dropFx.nm, L.x + L.w - 12, L.y + 23);
      g.fillStyle = "rgba(180,215,255,0.55)";
      g.font = "600 9px -apple-system,Segoe UI,Roboto,sans-serif";
      g.globalAlpha = 1;
    }

    // 状态文案
    g.textAlign = "left";
    g.fillStyle = "rgba(210,235,225,0.85)";
    g.font = "800 11.5px -apple-system,Segoe UI,Roboto,sans-serif";
    var stTxt = m.phase === "out" ? "下井中" : m.phase === "fight" ? "交战中" : "带矿石回来";
    g.fillStyle = "rgba(255,214,120,0.95)";
    g.font = "800 12px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("第 " + s.depth + " 层", L.x + 12, L.y + 11);
    g.fillStyle = "rgba(210,235,225,0.8)";
    g.font = "800 11px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("· " + stTxt, L.x + 12 + g.measureText("第 " + s.depth + " 层").width + 4, L.y + 11);
    g.fillStyle = "rgba(200,220,210,0.45)";
    g.font = "600 9.5px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("最高 " + s.runBest + " 层", L.x + 12, L.y + 23);

    // 撤离/结算按钮在打造按钮同一行（下面绘制）

    // 打造按钮
    var fgx = Game.FORGE;
    var canF = M.canForge(s);
    rr(g, fgx.x, fgx.y, fgx.w, fgx.h, 9);
    g.fillStyle = canF ? "rgba(120,170,255,0.28)" : "rgba(255,255,255,0.05)";
    g.fill();
    g.strokeStyle = canF ? "rgba(150,200,255,0.8)" : "rgba(180,200,230,0.2)";
    g.lineWidth = 1.4;
    rr(g, fgx.x, fgx.y, fgx.w, fgx.h, 9);
    g.stroke();
    g.textAlign = "left";
    g.fillStyle = canF ? "#dbeaff" : "rgba(200,215,235,0.45)";
    g.font = "800 12px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("打造武器", fgx.x + 12, fgx.y + 11);
    g.fillStyle = "rgba(200,220,245,0.62)";
    g.font = "600 9.5px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("现有 " + s.weapons + " 把 · 一刀 " + (s.weapons * 4), fgx.x + 12, fgx.y + 23);
    g.textAlign = "right";
    g.font = "800 12px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillStyle = canF ? "#ffd24a" : "rgba(220,200,180,0.4)";
    g.fillText(M.forgeCost(s) + " 锭", fgx.x + fgx.w - 12, fgx.y + 11);
    g.fillStyle = canF ? "rgba(255,214,120,0.8)" : "rgba(220,200,180,0.3)";
    g.font = "700 9px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText(canF ? "可打造" : "锭不够", fgx.x + fgx.w - 12, fgx.y + 24);

    // 宝箱按钮
    var cbx = Game.CHEST, hasChest = s.chests > 0;
    rr(g, cbx.x, cbx.y, cbx.w, cbx.h, 9);
    g.fillStyle = hasChest ? "rgba(255,190,90,0.28)" : "rgba(255,255,255,0.04)";
    g.fill();
    g.strokeStyle = hasChest ? "rgba(255,205,120,0.9)" : "rgba(200,180,150,0.18)";
    g.lineWidth = hasChest ? 1.6 : 1.1;
    rr(g, cbx.x, cbx.y, cbx.w, cbx.h, 9);
    g.stroke();
    g.textAlign = "center";
    g.fillStyle = hasChest ? "#ffe6b0" : "rgba(220,200,180,0.4)";
    g.font = "800 11.5px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText(hasChest ? "开宝箱 ×" + s.chests : "宝箱 ×0", cbx.x + cbx.w / 2, cbx.y + 12);
    g.fillStyle = "rgba(255,210,150,0.6)";
    g.font = "600 9px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText(M.hasTalent(s, "t_lucky") ? "每 3 杀 · 必出" : (M.hasTalent(s, "t_chest") ? "每 5 杀一个" : "需要天赋"), cbx.x + cbx.w / 2, cbx.y + 24);

    // 打不动的提示
    if (s.blockedAt >= s.depth && s.retreats > 0 && s.depth <= s.blockedAt) {
      g.textAlign = "right";
      g.fillStyle = "rgba(255,150,120,0.75)";
      g.font = "700 9.5px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("卡住了？多打武器 / 换装备再往上", fgx.x + fgx.w - 74, fgx.y + fgx.h / 2);
    }

    /* ---------- 页签 ---------- */
    var tabs = Game.TABS, labels = ["矿石", "铁锭", "装备", "天赋"];
    for (var ti = 0; ti < 4; ti++) {
      var tb = tabs[ti], on = this.tab === ti;
      rr(g, tb.x, tb.y, tb.w, tb.h, 8);
      g.fillStyle = on ? "rgba(210,150,60,0.25)" : "rgba(255,255,255,0.04)";
      g.fill();
      g.strokeStyle = on ? "rgba(255,200,110,0.7)" : "rgba(255,255,255,0.08)";
      g.lineWidth = 1.2;
      rr(g, tb.x, tb.y, tb.w, tb.h, 8);
      g.stroke();
      g.textAlign = "center";
      g.fillStyle = on ? "#ffe6c2" : "rgba(220,200,180,0.55)";
      g.font = "800 12px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText(labels[ti], tb.x + tb.w / 2, tb.y + tb.h / 2);
    }

    /* ---------- 天赋页签 ---------- */
    if (this.tab === 3) {
      var tcards = Game.TCARDS(), tlist = M.TALENTS;
      for (var ti2 = 0; ti2 < tcards.length; ti2++) {
        var tc = tcards[ti2], tl = tlist[ti2];
        if (!tl) continue;
        var stt = M.talentState(s, tl);
        var owned = stt === "owned";
        rr(g, tc.x, tc.y, tc.w, tc.h, 9);

/* ==== src/main.js ==== */
/* 敲矿 v3 —— 启动 / 输入（点、拖、页签、打造） */
(function (root) {
  "use strict";
  var G = root.OreGame, GS = root.OreGame.Game, M = root.OreTap, W = G.W, H = G.H;

  var game = null, last = 0, saveAcc = 0;

  function boot() {

    var s = Math.min(vw / W, vh / H);

    canvas.style.height = Math.round(H * s) + "px";

  function toLocal(e) {
