<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120d0a">
<title>敲矿</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#080605;overflow:hidden;
    -webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif}
  #stage{display:flex;align-items:center;justify-content:center;height:100%}
  #game{display:block;touch-action:none}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="400" height="720"></canvas></div>
<script>
/* ==== src/sim.js ==== */
/* ==========================================================================
   敲矿 · Ore Tap（最直白版）
   核心：点矿壁 → 掉矿 → 用矿买自动产出 → 点得更快/自动更多
   可拓展性：所有可购买项都注册在 NODES 里（每个节点带 cost/req/apply），
   以后加"熔炉/佣兵/附魔"只是往 NODES 里加条目 + 新一屏，不改主循环。
   ========================================================================== */
(function (root) {
  "use strict";

  var CFG = {
    tapBase: 1,
    offlineEff: 0.5,
    offlineCapHours: 8,
    veinEveryMin: 22,      // 矿脉出现的秒数区间
    veinEveryMax: 34,
    veinLife: 4.5,
    veinMul: 12
  };

  /* 可购买项：数据驱动，新增机制只加条目 */
  function makeNodes() {
    return [
      {
        id: "pick", nm: "更好的镐", tip: "每次敲击 +1",
        baseCost: 10, growth: 1.18, tier: 0,
        effect: function (s) { s.tapPower += 1; }
      },
      {
        id: "cart", nm: "矿车", tip: "自动采 +0.5/秒",
        baseCost: 25, growth: 1.16, tier: 0,
        effect: function (s) { s.autoRate += 0.5; }
      },
      {
        id: "drill", nm: "自动镐", tip: "自动采 +2.5/秒",
        baseCost: 180, growth: 1.19, tier: 1,
        req: function (s) { return (s.bought.cart || 0) >= 3; },
        reqText: "需 3 辆矿车",
        effect: function (s) { s.autoRate += 2.5; }
      },
      {
        id: "gloves", nm: "厚手套", tip: "敲击 +3（但自动 -10%）",
        baseCost: 420, growth: 1.22, tier: 1,
        req: function (s) { return (s.bought.pick || 0) >= 5; },
        reqText: "需 5 把镐",
        effect: function (s) { s.tapPower += 3; s.autoRate *= 0.9; }
      }
    ];
  }

  /* 熔炉升级：货币是锭，不是矿 —— 第二条经济腿 */
  function ingotNodes(st) {
    return [
      {
        id: "blower", nm: "鼓风机", tip: "冶炼 -18% 时间", currency: "ingot",
        baseCost: 3, growth: 1.85,
        effect: function (s) { s.furnace.time = Math.max(1.2, s.furnace.time * 0.82); }
      },
      {
        id: "autoforge", nm: "自动锻造", tip: "锭够就自动打武器", currency: "ingot",
        baseCost: 12, growth: 2.2,
        effect: function (s) { s.autoForge += 1; }
      },
      {
        id: "autofeed", nm: "自动投料", tip: "炉子自己吃矿（不用再拖）", currency: "ingot",
        baseCost: 8, growth: 2.6,
        effect: function (s) { s.autoFeed += 1; }
      },
      {
        id: "chamber", nm: "大炉膛", tip: "每次投料 20 矿 → 2 锭", currency: "ingot",
        baseCost: 6, growth: 2.0,
        effect: function (s) { s.furnace.batch += 10; s.furnace.ratio = s.furnace.batch; }
      }
    ];
  }

  var MERC = {
    walk: 2.0,          // 出门走到怪物前
    back: 1.6,          // 打赢回来
    swingEvery: 1.3,    // 每 1.3 秒砍一刀
    fightLimit: 18,     // 打超过 18 秒算撤退
    baseHp: 24, hpPerKill: 14,
    dmgPerWeapon: 4,
    lootBase: 6, lootPerWeapon: 3
  };

  function monsterHp(st) { return MERC.baseHp + MERC.hpPerKill * st.kills; }

  /* 打造一把武器：花锭，价格递增 */
  function forgeCost(st) { return Math.max(1, Math.floor(1 * Math.pow(1.28, st.weapons))); }
  function canForge(st) { return st.ingot >= forgeCost(st); }
  function forge(st) {
    if (!canForge(st)) return false;
    st.ingot -= forgeCost(st);
    st.weapons++;
    return true;
  }

  /* 佣兵状态机：out(出门) → fight(打) → back(回来) → out ... 全自动 */
  function stepMerc(st, dt) {
    var m = st.merc;
    m.anim += dt;
    if (m.phase === "out") {
      m.t += dt;
      if (m.t >= MERC.walk) { m.phase = "fight"; m.t = 0; m.maxHp = monsterHp(st); m.hp = m.maxHp; m.dmgT = 0; }
    } else if (m.phase === "fight") {
      m.t += dt;
      m.dmgT += dt;
      m.swing = Math.max(0, m.swing - dt * 3);
      if (m.dmgT >= MERC.swingEvery) {
        m.dmgT = 0;
        m.swing = 1;
        var dealt = st.weapons * (MERC.dmgPerWeapon + st.weaponDmg);
        m.hp -= dealt;
        st.hitFx.push({ t: 1, d: dealt });
        if (m.hp <= 0) {
          var loot = MERC.lootBase + MERC.lootPerWeapon * st.weapons;
          st.ore += loot; st.total += loot;
          st.kills++;
          m.lastLoot = loot;
          m.phase = "back"; m.t = 0; m.hp = 0;
        }
      }
      if (m.phase === "fight" && m.t > MERC.fightLimit) {   // 打不动，撤退
        st.retreats++;
        m.phase = "back"; m.t = 0;
      }
    } else if (m.phase === "back") {
      m.t += dt;
      if (m.t >= MERC.back) { m.phase = "out"; m.t = 0; }
    }
  }

  function newState(seed) {
    var st = {
      t: 0, ore: 0, total: 0,
      tapPower: CFG.tapBase, autoRate: 0,
      bought: {}, taps: 0,
      ingot: 0, ingotTotal: 0,
      weapons: 0, kills: 0, retreats: 0,
      merc: { phase: "out", t: 0, hp: 0, maxHp: 0, swing: 0, dmgT: 0, lastLoot: 0, anim: 0 },
      hitFx: [],
      furnace: { queue: 0, prog: 0, time: 4.0, batch: 10, ratio: 10, smelted: 0, heat: 0 },
      autoForge: 0, weaponDmg: 0, autoFeed: 0,
      vein: null, veinT: 8, veinLife: 0,
      lastVein: 0, veins: 0,
      chips: [], pops: [],
      rand: (function (s0) {
        var x = (seed || 12345) >>> 0;
        return function () { x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
      })(seed)
    };
    st.nodes = makeNodes();
    return st;
  }

  function costOf(st, node) {
    var n = st.bought[node.id] || 0;
    return Math.floor(node.baseCost * Math.pow(node.growth, n));
  }

  function allNodes(st) {
    return st.nodes.concat(ingotNodes(st));
  }

  function balanceOf(st, node) {
    return node.currency === "ingot" ? st.ingot : st.ore;
  }

  function canBuy(st, node) {
    if (node.req && !node.req(st)) return false;
    return balanceOf(st, node) >= costOf(st, node);
  }

  function buy(st, id) {
    var node = null, i;
    for (i = 0; i < st.nodes.length; i++) if (st.nodes[i].id === id) node = st.nodes[i];
    if (!node && st) {
      var all = allNodes(st);
      for (i = 0; i < all.length; i++) if (all[i].id === id) node = all[i];
    }
    if (!node || !canBuy(st, node)) return false;
    if (node.currency === "ingot") st.ingot -= costOf(st, node);
    else st.ore -= costOf(st, node);
    st.bought[id] = (st.bought[id] || 0) + 1;
    node.effect(st);
    return true;
  }

  /* 点一下矿壁 */
  function tap(st) {
    st.taps++;
    var v = st.tapPower;
    st.ore += v; st.total += v;
    st.pops.push({ v: v, t: 1, x: 0.2 + st.rand() * 0.6, y: 0.15 + st.rand() * 0.5 });
    for (var i = 0; i < 3; i++) {
      st.chips.push({
        x: 0.2 + st.rand() * 0.6, y: 0.2 + st.rand() * 0.5,
        vx: (st.rand() - 0.5) * 0.9, vy: -0.4 - st.rand() * 0.7,
        life: 0.5 + st.rand() * 0.4, spin: (st.rand() - 0.5) * 8
      });
    }
    // 点到矿脉：大额
    if (st.vein && st.veinLife > 0) {
      var bonus = st.tapPower * CFG.veinMul;
      st.ore += bonus; st.total += bonus;
      st.pops.push({ v: bonus, t: 1.4, x: st.vein.x, y: st.vein.y, big: true });
      st.vein = null; st.veinLife = 0;
      st.veins++;
      return { tap: v, bonus: bonus };
    }
    return { tap: v, bonus: 0 };
  }

  /* 把一批矿投进炉子（拖拽的目标动作） */
  function feed(st) {
    var f = st.furnace;
    if (st.ore < f.batch) return false;
    if (f.queue >= 3) return false;          // 炉子最多排 3 批
    st.ore -= f.batch;
    f.queue++;
    return true;
  }

  function stepFurnace(st, dt) {
    var f = st.furnace;
    f.heat = Math.max(0, f.heat - dt * 0.6);
    if (f.queue <= 0) return;
    f.prog += dt / f.time;
    if (f.prog >= 1) {
      f.prog = 0;
      f.queue--;
      st.ingot += 1;
      st.ingotTotal += 1;
      f.smelted++;
      f.heat = 1;
    }
  }

  function step(st, dt) {
    st.t += dt;

    // 自动产出
    var auto = st.autoRate * dt;
    if (auto > 0) { st.ore += auto; st.total += auto; }

    stepFurnace(st, dt);
    stepMerc(st, dt);
    if (st.autoFeed > 0) {
      for (var au = 0; au < st.autoFeed; au++) if (st.furnace.queue < 3 && st.ore >= st.furnace.batch) feed(st);
    }
    if (st.autoForge > 0) {
      // 自动锻造：每升一级，多自动打一把的"机会"，但仍是花锭
      for (var af = 0; af < st.autoForge; af++) if (canForge(st)) forge(st);
    }

    // 矿脉计时
    st.veinT -= dt;
    if (!st.vein && st.veinT <= 0) {
      st.vein = { x: 0.18 + st.rand() * 0.64, y: 0.16 + st.rand() * 0.5, r: 0.055 + st.rand() * 0.02 };
      st.veinLife = CFG.veinLife;
      st.veinT = CFG.veinEveryMin + st.rand() * (CFG.veinEveryMax - CFG.veinEveryMin);
      st.lastVein = st.t;
    }
    if (st.vein) {
      st.veinLife -= dt;
      if (st.veinLife <= 0) { st.vein = null; st.veinT = CFG.veinEveryMin + st.rand() * (CFG.veinEveryMax - CFG.veinEveryMin); }
    }

    for (var hf = st.hitFx.length - 1; hf >= 0; hf--) {
      st.hitFx[hf].t -= dt * 1.6;
      if (st.hitFx[hf].t <= 0) st.hitFx.splice(hf, 1);
    }

    // 粒子 / 飘字
    var i;
    for (i = st.chips.length - 1; i >= 0; i--) {
      var c = st.chips[i];
      c.life -= dt;
      c.x += c.vx * dt * 0.35;
      c.y += c.vy * dt * 0.35;
      c.vy += 2.2 * dt * 0.35;
      if (c.life <= 0) st.chips.splice(i, 1);
    }
    for (i = st.pops.length - 1; i >= 0; i--) {
      st.pops[i].t -= dt * (st.pops[i].big ? 0.7 : 1.1);
      st.pops[i].y -= dt * 0.12;
      if (st.pops[i].t <= 0) st.pops.splice(i, 1);
    }
  }

  /* 离线：矿车/自动镐继续干活，按 50% 结算，封顶 8 小时 */
  function settleOffline(st, hours) {
    var used = Math.min(hours, CFG.offlineCapHours);
    if (used <= 0 || st.autoRate <= 0) return 0;
    var gain = st.autoRate * used * 3600 * CFG.offlineEff;
    st.ore += gain; st.total += gain;
    return gain;
  }

  root.OreTap = {
    CFG: CFG, newState: newState, step: step, tap: tap,
    costOf: costOf, canBuy: canBuy, buy: buy, settleOffline: settleOffline,
    feed: feed, allNodes: allNodes, balanceOf: balanceOf, ingotNodes: ingotNodes,
    forge: forge, canForge: canForge, forgeCost: forgeCost, MERC: MERC
  };
})(typeof window !== "undefined" ? window : globalThis);

/* ==== src/game.js ==== */
/* 敲矿 v3 —— 矿壁 / 熔炉 / 佣兵出击道 / 两组升级 */
(function (root) {
  "use strict";
  var M = root.OreTap, W = 400, H = 720;

  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function fmt(n) {
    if (n < 1000) return Math.round(n).toString();
    var u = ["K", "M", "B", "T"], i = -1;
    while (n >= 1000 && i < 3) { n /= 1000; i++; }
    return (Math.round(n * 10) / 10) + u[i];
  }
  function hash(n) { var x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }

  function Game(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.st = M.newState((Date.now() % 99991) + 7);
    this.offlineMsg = null;
    this.shake = 0;
    this.drag = null;
    this.tab = 0;                    // 0 矿石 1 铁锭
    this.lootFx = [];
  }

  Game.ROCK = { x: 24, y: 100, w: W - 48, h: 172 };
  Game.FURNACE = { x: 24, y: 280, w: W - 48, h: 46 };
  Game.LANE = { x: 24, y: 334, w: W - 48, h: 80 };
  Game.FORGE = { x: 24, y: 420, w: W - 48, h: 30 };
  Game.TABS = [
    { x: 24, y: 458, w: 168, h: 30 },
    { x: 24 + 176, y: 458, w: 168, h: 30 }
  ];
  Game.CARDS = function () {
    var out = [];
    for (var i = 0; i < 4; i++) out.push({ i: i, x: 24, y: 492 + i * 52, w: W - 48, h: 46 });
    return out;
  };

  var ORE_NODES = ["pick", "cart", "drill", "gloves"];
  var INGOT_NODES = ["blower", "chamber", "autofeed", "autoforge"];
  Game.tabNodes = function (st, tab) {
    var ids = tab === 0 ? ORE_NODES : INGOT_NODES, all = M.allNodes(st), out = [];
    for (var i = 0; i < ids.length; i++) for (var j = 0; j < all.length; j++) if (all[j].id === ids[i]) out.push(all[j]);
    return out;
  };

  Game.prototype.save = function () {
    var s = this.st;
    try {
      root.localStorage.setItem("oretap_save", JSON.stringify({
        ore: s.ore, total: s.total, ingot: s.ingot, ingotTotal: s.ingotTotal,
        tapPower: s.tapPower, autoRate: s.autoRate, bought: s.bought,
        weapons: s.weapons, kills: s.kills, taps: s.taps, at: Date.now()
      }));
    } catch (e) {}
  };

  Game.prototype.load = function () {
    var raw = null;
    try { raw = root.localStorage.getItem("oretap_save"); } catch (e) {}
    if (!raw) return;
    try {
      var d = JSON.parse(raw), s = this.st;
      s.ore = d.ore || 0; s.total = d.total || 0;
      s.ingot = d.ingot || 0; s.ingotTotal = d.ingotTotal || 0;
      s.tapPower = d.tapPower || 1; s.autoRate = d.autoRate || 0;
      s.bought = d.bought || {}; s.taps = d.taps || 0;
      s.weapons = d.weapons || 0; s.kills = d.kills || 0;
      var all = M.allNodes(s), i, k, id;
      for (id in s.bought) {
        var n = s.bought[id];
        for (i = 0; i < all.length; i++) if (all[i].id === id) for (k = 0; k < n; k++) all[i].effect(s);
      }
      var hours = Math.max(0, (Date.now() - (d.at || Date.now())) / 3600000);
      if (hours > 0.01 && s.autoRate > 0) {
        var gain = M.settleOffline(s, hours);
        if (gain > 0) this.offlineMsg = { hours: hours, gain: gain };
      }
    } catch (e) {}
  };

  Game.prototype.hit = function (x, y) {
    // 返回 {type:'mine'|'feed'|'forge'|'buy'|'tab'}
    var i, t = Game.TABS;
    for (i = 0; i < t.length; i++) if (x >= t[i].x && x <= t[i].x + t[i].w && y >= t[i].y && y <= t[i].y + t[i].h) {
      this.tab = i; return { type: "tab", tab: i };
    }
    var fg = Game.FORGE;
    if (x >= fg.x && x <= fg.x + fg.w && y >= fg.y && y <= fg.y + fg.h) {
      var okF = M.forge(this.st);
      return { type: "forge", ok: okF };
    }
    var f = Game.FURNACE;
    if (x >= f.x && x <= f.x + f.w && y >= f.y && y <= f.y + f.h) {
      return { type: "feed", ok: M.feed(this.st) };
    }
    var cards = Game.CARDS(), nodes = Game.tabNodes(this.st, this.tab);
    for (i = 0; i < cards.length; i++) {
      var c = cards[i];
      if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
        if (nodes[i]) return { type: "buy", id: nodes[i].id, ok: M.buy(this.st, nodes[i].id) };
        return { type: "none" };
      }
    }
    var r = Game.ROCK;
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
      var res = M.tap(this.st);
      this.shake = res.bonus > 0 ? 1 : 0.45;
      return { type: "mine", bonus: res.bonus };
    }
    return { type: "none" };
  };

  Game.prototype.dropAt = function (x, y) {
    var f = Game.FURNACE;
    if (x < f.x - 24 || x > f.x + f.w + 24 || y < f.y - 30 || y > f.y + f.h + 30) return false;
    return M.feed(this.st);
  };

  Game.prototype.update = function (dt) {
    var before = this.st.kills;
    M.step(this.st, dt);
    if (this.st.kills > before) {
      this.lootFx.push({ t: 1.6, v: this.st.merc.lastLoot });
      this.shake = 0.5;
    }
    var i;
    for (i = this.lootFx.length - 1; i >= 0; i--) {
      this.lootFx[i].t -= dt;
      if (this.lootFx[i].t <= 0) this.lootFx.splice(i, 1);
    }
    if (this.shake > 0) this.shake -= dt * 3;
  };

  Game.prototype.draw = function () {
    var g = this.ctx, s = this.st;
    g.clearRect(0, 0, W, H);
    var bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#1a1410");
    bg.addColorStop(0.45, "#120d0a");
    bg.addColorStop(1, "#080605");
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);

    /* ---------- HUD ---------- */
    g.textAlign = "left"; g.textBaseline = "middle";
    g.fillStyle = "rgba(230,180,110,0.75)";
    g.font = "700 10.5px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("矿石", 20, 20);
    g.fillStyle = "#fff2dc";
    g.font = "800 32px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText(fmt(s.ore), 18, 46);
    if (s.autoRate > 0) {
      g.fillStyle = "rgba(140,220,160,0.9)";
      g.font = "700 11px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("矿车 +" + s.autoRate.toFixed(1) + "/s", 20, 70);
    }
    g.textAlign = "right";
    g.fillStyle = "rgba(200,220,255,0.7)";
    g.font = "700 10.5px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("铁锭", W - 18, 20);
    g.fillStyle = "#dce9ff";
    g.font = "800 24px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText(fmt(s.ingot), W - 18, 44);
    g.fillStyle = "rgba(210,220,235,0.6)";
    g.font = "700 10.5px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("武器 ×" + s.weapons + " · 击杀 " + s.kills, W - 18, 66);
    g.fillStyle = "rgba(190,210,235,0.45)";
    g.font = "600 10px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("每击 +" + s.tapPower, W - 18, 82);

    /* ---------- 矿壁 ---------- */
    var r = Game.ROCK;
    var sh = this.shake > 0 ? (Math.random() - 0.5) * 5 * this.shake : 0;
    g.save();
    g.translate(sh, sh * 0.4);
    var grd = g.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
    grd.addColorStop(0, "#7a6a58");
    grd.addColorStop(0.4, "#5c4e40");
    grd.addColorStop(1, "#3a2f26");
    g.fillStyle = grd;
    g.beginPath();
    for (var i = 0; i < 14; i++) {
      var a = (i / 14) * Math.PI * 2;
      var rad = 0.5 + (hash(i * 3.7 + 1) - 0.5) * 0.09;

    root.addEventListener("pointercancel", onUp);
    root.addEventListener("visibilitychange", function () { if (game) game.save(); });
    root.addEventListener("beforeunload", function () { if (game) game.save(); });
    last = Date.now();
    loop();
  }

  function fit(canvas) {
    var vw = root.innerWidth || W, vh = root.innerHeight || H;
    var s = Math.min(vw / W, vh / H);
    canvas.style.width = Math.round(W * s) + "px";
    canvas.style.height = Math.round(H * s) + "px";
    canvas._rect = null;
  }

  function toLocal(e) {
    var cv = root.document.getElementById("game");
    if (!cv._rect) cv._rect = cv.getBoundingClientRect();
    var r = cv._rect;
    return { x: (e.clientX - r.left) / (r.width / W), y: (e.clientY - r.top) / (r.height / H) };
  }

  function onDown(e) {
    e.preventDefault();
    var p = toLocal(e);
    if (game.offlineMsg) { game.offlineMsg = null; return; }
    down = p; dragging = false;
  }

  function onMove(e) {
    if (!down) return;
    var p = toLocal(e);
    if (!dragging) {
      var dx = p.x - down.x, dy = p.y - down.y;
      if (dx * dx + dy * dy > 196) { dragging = true; game.drag = { x: p.x, y: p.y }; }
    } else game.drag = { x: p.x, y: p.y };
  }

  function onUp(e) {
    if (!down) return;
    var p = toLocal(e);
    if (dragging) {
      game.dropAt(p.x, p.y);
      game.drag = null;
    } else {
      game.hit(p.x, p.y);
    }
    down = null; dragging = false;
  }

  function loop() {
    var now = Date.now();
    var dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    game.update(dt);
    game.draw();
    saveAcc += dt;
    if (saveAcc > 4) { saveAcc = 0; game.save(); }
    root.requestAnimationFrame(loop);
  }

  root.API = {
    g: function () { return game; },
    step: function (n, dt) {
      dt = dt || 1 / 60;
      for (var i = 0; i < (n || 1); i++) game.update(dt);
      game.draw();
      return this.info();
    },
    tap: function () { return game.hit(W / 2, 180); },
    feed: function () { return game.hit(W / 2, 300); },
    forge: function () { return game.hit(G.FORGE.x + 10, G.FORGE.y + 10); },
    tab: function (i) { return game.hit(G.TABS[i].x + 10, G.TABS[i].y + 10); },
    buy: function (id) { return M.buy(game.st, id); },
    info: function () {
      var s = game.st, all = M.allNodes(s);
      return {
        ore: Math.round(s.ore * 10) / 10, ingot: s.ingot, total: Math.round(s.total),
        tapPower: s.tapPower, autoRate: Math.round(s.autoRate * 10) / 10,
        weapons: s.weapons, kills: s.kills, retreats: s.retreats, tab: game.tab,
        forgeCost: M.forgeCost(s),
        merc: { phase: s.merc.phase, hp: Math.round(s.merc.hp), maxHp: s.merc.maxHp },
        furnace: { queue: s.furnace.queue, prog: Math.round(s.furnace.prog * 100), batch: s.furnace.batch },
        nodes: all.map(function (n) { return { id: n.id, cost: M.costOf(s, n), can: M.canBuy(s, n), cur: n.currency || "ore" }; })
      };
    }
  };

  if (root.document.readyState === "loading") root.document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(typeof window !== "undefined" ? window : globalThis);

</script>
</body>
</html>
