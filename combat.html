   支线：散射 / 疾风 / 陷阱 / 伙伴 / 生存，两条主干在 T1 互斥（散射 vs 疾风），
   其余节点按前置发散；魂的收入不足以点满全树，所以必须选路线。 */
(function (root) {
  "use strict";

  var CFG = {
    spawnEvery: 2.2,
    maxEnemiesBase: 4,
    archerX: 0.13,
    archerD: 0.15,
    bowH: 0.365,          // 立绘里弓的高度（箭必须从这里出）
    bowDX: 0.051,         // 弓在人物右侧的偏移
    range: 0.92,          // 射程：敌人进了射程才自动开火
    aimH: 0.24,
    autoEvery: 1.15,
    v0: 1.30,
    gravity: 4.0,
    atkBase: 1,
    hpBase: 12,
    hitR: 0.045,
    soulPerKill: 1,
    retreatInvuln: 1.6,
    manualMul: 1.6,
    slackPenalty: 0,          // 箭毯版本：打空不再是惩罚
    landLife: 9.0,            // 插地箭存活 9 秒
    remanCap: 24,             // 场上最多 24 支
    remanDmgMul: 0.6,         // 被踩到时弹起的箭 = 原伤害 60%
    remanHopsMax: 2,          // 每支最多触发两次
    remanX: 0.075,            // 触发横向范围
    remanD: 0.40              // 触发纵深范围
  };

  var TALENTS = [
    /* ---- 根 ---- */
    { id: "atk",      nm: "弓术",     tier: 0, cost: 4,   desc: "每支箭伤害 +1（可反复）", req: [], repeat: true, br: "root" },

    /* ---- T1 互斥主干 ---- */
    { id: "multi",    nm: "散射",     tier: 1, cost: 10,  desc: "额外一箭，打第二个敌人", req: ["atk"], fork: "T1", br: "spread" },
    { id: "rapid",    nm: "疾风",     tier: 1, cost: 10,  desc: "射击间隔 -35%", req: ["atk"], fork: "T1", br: "speed" },

    /* ---- T2 ---- */
    { id: "pierce",   nm: "穿透",     tier: 2, cost: 24,  desc: "箭穿人继续飞，最多 3 个", req: ["multi"], br: "spread" },
    { id: "armor",    nm: "皮甲",     tier: 2, cost: 18,  desc: "血量 +5，站着挨打也扛得住", req: ["atk"], br: "survive" },
    { id: "combo",    nm: "连击",     tier: 2, cost: 24,  desc: "连中 3 次伤害翻倍", req: ["rapid"], br: "speed" },
    { id: "slowfield",nm: "泥沼",     tier: 2, cost: 20,  desc: "敌人进前场速度 -40%", req: ["atk"], br: "trap" },

    /* ---- T3 ---- */
    { id: "explode",  nm: "爆炸箭",   tier: 3, cost: 55,  desc: "命中点炸开，周围吃 60%", req: ["pierce"], br: "spread" },
    { id: "thorns",   nm: "荆棘",     tier: 3, cost: 30,  desc: "被咬时反弹 3 点伤害", req: ["armor"], br: "survive" },
    { id: "hawk",     nm: "鹰眼",     tier: 3, cost: 55,  desc: "自动瞄准更准 + 手瞄 +25%", req: ["combo"], br: "speed" },
    { id: "snare",    nm: "绊索",     tier: 3, cost: 45,  desc: "每 12 秒定住一个敌人 1.6 秒", req: ["slowfield"], br: "trap" },

    /* ---- T4 ---- */
    { id: "oilfire",  nm: "火油",     tier: 4, cost: 90,  desc: "爆炸处留火 3 秒，踩到持续掉血", req: ["explode"], br: "spread" },
    { id: "dodge",    nm: "轻身",     tier: 4, cost: 70,  desc: "20% 概率闪掉一次撕咬", req: ["thorns"], br: "survive" },
    { id: "hound",    nm: "猎犬",     tier: 4, cost: 85,  desc: "放一条狗出去咬最近的敌人", req: ["slowfield"], br: "trap" },
    { id: "archer2",  nm: "第二弓手", tier: 4, cost: 120, desc: "再上一个弓手，独立开火", req: ["hawk"], br: "speed" },

    /* ---- T5 ---- */
    { id: "rain",     nm: "箭雨",     tier: 5, cost: 150, desc: "每 9 秒朝一片区域落 5 支箭", req: ["oilfire"], br: "spread" },
    { id: "totem",    nm: "战鼓",     tier: 5, cost: 130, desc: "插战鼓，全场伤害 +20%", req: ["hound"], br: "trap" },
    { id: "falcon",   nm: "猎鹰",     tier: 5, cost: 140, desc: "猎鹰每 5 秒俯冲 10 伤", req: ["archer2"], br: "speed" },
    { id: "bastion",  nm: "堡垒",     tier: 5, cost: 150, desc: "血量 +10，回血速度翻倍", req: ["dodge"], br: "survive" },

    /* ---- T6 终局 ---- */
    { id: "storm",    nm: "箭幕",     tier: 6, cost: 300, desc: "箭雨改成 4.5 秒一轮", req: ["rain"], br: "spread" },
    { id: "queen",    nm: "鹰群女王", tier: 6, cost: 320, desc: "再放两只猎鹰（共三只）", req: ["falcon"], br: "speed" },
    { id: "quake",    nm: "地动",     tier: 6, cost: 300, desc: "绊索改成范围定身（3 个）", req: ["totem"], br: "trap" },
    { id: "immortal", nm: "不灭",     tier: 6, cost: 320, desc: "被压退时不清场，只回满血", req: ["bastion"], br: "survive" }
  ];

  function newState(seed) {
    return {
      t: 0, souls: 0, wave: 1, kills: 0, retreats: 0, misses: 0, shots: 0, hits: 0,
      hp: CFG.hpBase, maxHp: CFG.hpBase, invuln: 0, slack: 0, missStreak: 0,
      arrows: [], enemies: [], fx: [], pops: [], groundArrows: [], fires: [], snares: [],
      spawnT: 1.0, fireCd: 0.8, rainT: 9, snareT: 12, falconT: 5, houndT: 0,
      comboHits: 0, comboLast: 0,
      remanArrows: 0, remanHits: 0, chainPeak: 0, chainNow: 0, groundPeak: 0,
      lastShot: -9, lastHurt: -9, hurtFlash: 0,
      talents: {}, bought: {}, atk: CFG.atkBase, forks: {},
      hound: { x: 0.30, d: 0.0, target: null, bite: 0 },
      markBonus: 0,
      rand: (function (s0) {
        var x = (s0 || 12345) >>> 0;
        return function () { x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
      })(seed)
    };
  }

  function has(st, id) { return !!st.talents[id]; }
  function byId(id) { for (var i = 0; i < TALENTS.length; i++) if (TALENTS[i].id === id) return TALENTS[i]; return null; }
  function talentCost(st, t) {
    return t.repeat ? Math.round(t.cost * Math.pow(1.4, st.bought[t.id] || 0)) : t.cost;
  }
  function isSealed(st, t, depth) {
    if (!t) return false;
    if ((depth || 0) > 8) return false;
    if (t.fork && st.forks[t.fork] && st.forks[t.fork] !== t.id) return true;
    for (var i = 0; i < t.req.length; i++) {
      var p = byId(t.req[i]);
      if (p && isSealed(st, p, (depth || 0) + 1)) return true;
    }
    return false;
  }
  function talentState(st, t) {
    if (!t.repeat && st.talents[t.id]) return "owned";
    if (isSealed(st, t)) return "sealed";
    for (var i = 0; i < t.req.length; i++) if (!st.talents[t.req[i]]) return "locked";
    return st.souls >= talentCost(st, t) ? "ready" : "poor";
  }
  function buyTalent(st, id) {
    var t = byId(id);
    if (!t || talentState(st, t) !== "ready") return false;
    st.souls -= talentCost(st, t);
    st.bought[id] = (st.bought[id] || 0) + 1;
    st.talents[id] = 1;
    if (t.fork) st.forks[t.fork] = id;
    if (id === "atk") st.atk += 1;
    if (id === "armor") { st.maxHp += 5; st.hp = st.maxHp; }
    if (id === "bastion") { st.maxHp += 10; st.hp = st.maxHp; }
    st.fx.push({ t: 1.2, kind: "talent", text: t.nm });
    return true;
  }
  function maxEnemies(st) { return Math.min(7, CFG.maxEnemiesBase + Math.floor(st.wave / 8)); }
  function dmgMul(st) {
    var m = 1;
    if (has(st, "totem")) m *= 1.35;
    if (has(st, "bastion")) m *= 1.20;
    if (has(st, "immortal") && st.hp >= st.maxHp - 0.5) m *= 1.25;
    return m;
  }

  function spawn(st) {
    var d = -0.7 + st.rand() * 1.4;
    var hp = 2 + Math.floor(st.wave * 1.4);
    st.enemies.push({
      x: 1.28 + st.rand() * 0.08, d: d, hp: hp, maxHp: hp,
      speed: 0.075 + Math.min(0.06, st.wave * 0.005),
      atkCd: 1.0, hit: 0, bob: st.rand() * 6.28, slow: 0, stun: 0,
      id: Math.floor(st.rand() * 1e6)
    });
  }

  function solveVy(sx, sy, tx, ty) {
    var vx = CFG.v0 * 0.92;
    var dx = Math.max(0.03, tx - sx);
    var t = dx / vx;
    var vy = ((ty - sy) + 0.5 * CFG.gravity * t * t) / t;
    return { vx: vx, vy: vy, t: t };
  }
  function aimError(st) {
    var base = Math.min(0.12, 0.025 + st.wave * 0.0016);
    if (has(st, "hawk")) base *= 0.45;
    return base;
  }

  function fireAtPoint(st, tx, td, fromX, fromD, mul, manual, area) {
    var sx = (fromX === undefined) ? CFG.archerX + CFG.bowDX : fromX;
    var sd = (fromD === undefined) ? CFG.archerD : fromD;
    var sy = CFG.bowH;
    var s = solveVy(sx, sy, tx, CFG.aimH);

    var dmg = st.atk * (mul || 1) * dmgMul(st);
    if (manual) dmg *= CFG.manualMul * (has(st, "hawk") ? 1.25 : 1);
    if (has(st, "combo") && st.comboHits >= 3) dmg *= 2;
    dmg = Math.max(1, Math.round(dmg));

    st.arrows.push({ x: sx, y: sy, d: sd, vx: s.vx, vy: s.vy, vd: (td - sd) / s.t, dmg: dmg, life: 3.5, trail: [], hits: 0, pierce: has(st, "pierce"), manual: !!manual, area: !!area });
    st.shots++;
    st.lastShot = st.t;

    if (has(st, "multi")) {
      var list = st.enemies.slice().sort(function (a, b) { return a.x - b.x; });
      var t2 = list[1] || list[0];
      if (t2) {
        var s2 = solveVy(sx, sy, t2.x, CFG.aimH);
        st.arrows.push({ x: sx, y: sy, d: sd, vx: s2.vx, vy: s2.vy, vd: (t2.d - sd) / s2.t, dmg: dmg, life: 3.5, trail: [], hits: 0, pierce: has(st, "pierce"), manual: !!manual, area: !!area });
        st.shots++;
      }
    }
  }

  function shootWorld(st, tx, td, manual) {
    if (manual) { st.slack = 0; st.missStreak = 0; }
    fireAtPoint(st, tx, td, undefined, undefined, 1, manual);
  }

  function predict(st, e) {
    var tx = e.x, td = e.d, err = aimError(st);
    for (var it = 0; it < 2; it++) {
      var s = solveVy(CFG.archerX + 0.022, CFG.bowH, tx, CFG.aimH);
      tx = Math.max(CFG.archerX + 0.08, e.x - e.speed * s.t);
    }
    tx += (st.rand() - 0.5) * err * 2;
    td += (st.rand() - 0.5) * err * 2.6;
    return { x: tx, d: td };
  }

  function killEnemy(st, e, dmg) {
    var i = st.enemies.indexOf(e);
    if (i >= 0) st.enemies.splice(i, 1);
    st.kills++;
    var gain = CFG.soulPerKill + Math.floor(st.wave / 4);
    st.souls += gain;
    if (st.kills % 6 === 0) st.wave++;
    st.pops.push({ t: 1.3, text: "+" + gain, x: e.x, d: e.d, h: 0.8, soul: true });
    // 尸体上的箭落回地面，变成"已填装"
    var dropN = 1 + (has(st, "multi") ? 1 : 0);
    for (var dn = 0; dn < dropN; dn++) {
      st.groundArrows.push({ x: Math.max(0.24, Math.min(1.0, e.x + (dn ? 0.03 : -0.03))), d: e.d + (dn ? 0.05 : -0.05), life: CFG.landLife, dmg: Math.max(1, st.atk), hops: 0, armed: 1 });
      st.remanArrows++;
    }
    while (st.groundArrows.length > CFG.remanCap) st.groundArrows.shift();
    st.groundPeak = Math.max(st.groundPeak, st.groundArrows.length);
    if (has(st, "explode") || has(st, "oilfire")) {
      var list = st.enemies.slice();
      for (var j = 0; j < list.length; j++) {
        var o = list[j];
        if (Math.abs(o.x - e.x) < 0.22 && Math.abs(o.d - e.d) < 0.5) hurt(st, o, Math.max(1, Math.round(dmg * 0.45)));
      }
      st.fx.push({ t: 0.5, kind: "boom", x: e.x, d: e.d, h: 0.4 });
      if (has(st, "oilfire")) st.fires.push({ x: e.x, d: e.d, life: 3, tick: 0 });
    }
  }

  function hurt(st, e, dmg) {
    if (e.stun > 0) dmg = Math.round(dmg * 1.5);   // 被定身 = 吃额外伤害
    e.hp -= dmg;
    e.hit = 1;
    st.hits++;
    st.pops.push({ t: 1, text: "-" + dmg, x: e.x, d: e.d, h: 0.55 });
    if (e.hp <= 0) killEnemy(st, e, dmg);
  }

  function step(st, dt) {
    st.t += dt;
    if (st.invuln > 0) st.invuln -= dt;
    if (st.slack > 0) st.slack -= dt;
    if (st.hurtFlash > 0) st.hurtFlash = Math.max(0, st.hurtFlash - dt * 2.2);
    var regen = has(st, "bastion") ? 0.42 : 0.18;
    if (st.hp < st.maxHp && st.invuln <= 0) st.hp = Math.min(st.maxHp, st.hp + regen * dt);

    st.spawnT -= dt;
    if (st.spawnT <= 0 && st.enemies.length < maxEnemies(st)) {
      st.spawnT = CFG.spawnEvery / (1 + st.wave * 0.035);
      spawn(st);
    }

    var swayAmp = 0.12 + Math.min(0.5, st.wave * 0.012);
    var swayFreq = 0.9 + Math.min(2.2, st.wave * 0.06);

    for (var i = st.enemies.length - 1; i >= 0; i--) {
      var e = st.enemies[i];
      if (!e) continue;
      e.hit = Math.max(0, e.hit - dt * 4);
      if (e.stun > 0) { e.stun -= dt; continue; }

      var spd = e.speed * (has(st, "slowfield") && e.x < 0.58 ? 0.6 : 1);
      if (e.x > CFG.archerX + 0.055) {
        e.x -= spd * dt;
        e.d += Math.sin(st.t * swayFreq + e.bob) * swayAmp * dt;
        if (e.d > 1) e.d = 1;
        if (e.d < -1) e.d = -1;
      } else {
        e.atkCd -= dt;
        if (e.atkCd <= 0) {
          e.atkCd = 1.7;
          if (st.invuln <= 0) {
            if (has(st, "dodge") && st.rand() < 0.20) {
              st.fx.push({ t: 0.3, kind: "dodge" });
            } else {
              st.hp -= 1;
              st.lastHurt = st.t;
              st.hurtFlash = 1;
              st.fx.push({ t: 0.35, kind: "hurt" });
              if (has(st, "thorns")) hurt(st, e, Math.max(3, st.atk));
              if (st.hp <= 0) {
                st.retreats++;
                st.wave = Math.max(1, st.wave - 1);
                st.hp = st.maxHp;
                st.invuln = CFG.retreatInvuln;
                st.arrows.length = 0;
                if (has(st, "immortal")) {
                  st.fx.push({ t: 1.2, kind: "immortal" });
                } else {
                  st.enemies.length = 0;
                  st.fx.push({ t: 1.5, kind: "retreat" });
                }
              }
            }
          }
        }
      }
    }

    /* 自动射击 */
    if (st.slack > 0) st.fireCd = Math.max(st.fireCd, 0.05);
    else {
      st.fireCd -= dt;
      if (st.fireCd <= 0) {
        var near = nearest(st);
        if (near && (near.x - CFG.archerX) > CFG.range) near = null;   // 还没进射程：等着
        if (near) {
          var p = predict(st, near);
          fireAtPoint(st, p.x, p.d);
          var fast = has(st, "rapid") ? 0.65 : 1;
          if (has(st, "combo") && st.comboHits >= 6) fast *= 0.85;
          st.fireCd = CFG.autoEvery * fast;
        } else st.fireCd = 0.25;
      }
    }

    /* 陷阱：绊索 */
    if (has(st, "snare")) {
      st.snareT -= dt;
      if (st.snareT <= 0) {
        st.snareT = 12;
        var list2 = st.enemies.slice().sort(function (a, b) { return a.x - b.x; });
        var n = has(st, "quake") ? 3 : 1;
        for (var si = 0; si < Math.min(n, list2.length); si++) { list2[si].stun = has(st, "quake") ? 2.0 : 1.6; }
        st.fx.push({ t: 0.5, kind: "snare" });
      }
    }

    /* 伙伴：猎犬 */
    if (has(st, "hound")) {
      var hdog = st.hound;
      var prey = nearest(st);
      if (prey) {
        hdog.x += (prey.x - 0.06 - hdog.x) * Math.min(1, dt * 3.2);
        hdog.d += (prey.d - hdog.d) * Math.min(1, dt * 3.2);
        hdog.bite += dt;
        if (hdog.bite >= 1.5 && Math.abs(prey.x - hdog.x) < 0.12) {
          hdog.bite = 0;
          hurt(st, prey, Math.round(Math.max(4, st.atk * 2) * dmgMul(st)));
          st.fx.push({ t: 0.3, kind: "bite", x: prey.x, d: prey.d });
        }
      }
    }

    /* 伙伴：猎鹰 */
    if (has(st, "falcon")) {
      st.falconT -= dt;
      if (st.falconT <= 0) {
        st.falconT = has(st, "queen") ? 3.6 : 5;
        var count = has(st, "queen") ? 3 : 1;
        for (var f2 = 0; f2 < count; f2++) {
          var tg = st.enemies[Math.floor(st.rand() * Math.max(1, st.enemies.length))];
          if (tg) { hurt(st, tg, Math.round(Math.max(10, st.atk * 2.2) * dmgMul(st))); st.fx.push({ t: 0.5, kind: "falcon", x: tg.x, d: tg.d }); }
        }
      }
    }

    /* 箭雨 */
    if (has(st, "rain")) {
      st.rainT -= dt;
      if (st.rainT <= 0) {
        st.rainT = has(st, "storm") ? 4.5 : 9;
        for (var r = 0; r < 5; r++) fireAtPoint(st, 0.5 + st.rand() * 0.42, -0.7 + st.rand() * 1.4, 0.52, -0.8 + st.rand() * 1.6, 1, false, true);
        st.fx.push({ t: 1, kind: "rain" });
      }
    }

    /* 火油地面 */
    for (var fr = st.fires.length - 1; fr >= 0; fr--) {
      var fire = st.fires[fr];
      fire.life -= dt;
      fire.tick += dt;
      if (fire.tick >= 0.4) {
        fire.tick = 0;
        for (var ei = 0; ei < st.enemies.length; ei++) {
          var en2 = st.enemies[ei];
          if (Math.abs(en2.x - fire.x) < 0.12 && Math.abs(en2.d - fire.d) < 0.4) hurt(st, en2, 2);
        }
      }
      if (fire.life <= 0) st.fires.splice(fr, 1);
    }

    /* 箭飞行 */
    for (var a = st.arrows.length - 1; a >= 0; a--) {
      var ar = st.arrows[a];
      if (!ar) continue;
      ar.vy -= CFG.gravity * dt;
      ar.x += ar.vx * dt;
      ar.y += ar.vy * dt;
      ar.d += ar.vd * dt;
      ar.life -= dt;
      ar.trail.push({ x: ar.x, y: ar.y, d: ar.d });
      if (ar.trail.length > 10) ar.trail.shift();

      var hit = null;
      for (var q = 0; q < st.enemies.length; q++) {
        var en = st.enemies[q];
        if (Math.abs(en.x - ar.x) < CFG.hitR && ar.y < 0.66 && ar.y > -0.03 && Math.abs(en.d - ar.d) < 0.4) { hit = en; break; }
      }
      if (hit) {
        hurt(st, hit, ar.dmg);
        st.comboHits++; st.comboLast = st.t;
        st.missStreak = 0;
        if (ar.pierce && ar.hits < 2) { ar.hits++; ar.dmg = Math.max(1, Math.round(ar.dmg * 0.7)); continue; }
        st.arrows.splice(a, 1);
        continue;
      }
      if (ar.y <= 0 || ar.x > 1.06 || ar.life <= 0) {
        if (ar.y <= 0 && ar.x < 1.02) {
          st.groundArrows.push({ x: ar.x, d: ar.d, life: CFG.landLife, dmg: ar.dmg, hops: 0, armed: 1 });
          if (st.groundArrows.length > CFG.remanCap) st.groundArrows.shift();
          st.remanArrows++;
          st.groundPeak = Math.max(st.groundPeak, st.groundArrows.length);
        }
        st.arrows.splice(a, 1);
        if (!ar.area) {
          st.comboHits = 0;
          st.misses++;
          st.missStreak++;
          if (st.missStreak >= 5) { st.missStreak = 0; st.slack = CFG.slackPenalty; st.fx.push({ t: 0.6, kind: "slack" }); }
        }

      g.imageSmoothingEnabled = false;
      var img = e.hit > 0.05 && skelRed ? skelRed : skelImg;
      g.drawImage(img, p.x - dw / 2, p.y - dh + dh * 0.03, dw, dh);
      g.imageSmoothingEnabled = true;
    } else {
      g.fillStyle = "rgba(180,190,200,0.9)";
      rr(g, p.x - dw * 0.18, p.y - dh * 0.7, dw * 0.36, dh * 0.7, 3);
      g.fill();
    }

    // 像素血条（硬边，不圆角）
    var bw = Math.round(dw * 0.44), bh = 4;
    var bx = Math.round(p.x - bw / 2), by = Math.round(p.y - dh - 6);
    g.fillStyle = "#0a0c0e";
    g.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    g.fillStyle = "#3a1414";
    g.fillRect(bx, by, bw, bh);
    g.fillStyle = "#e05a4a";
    g.fillRect(bx, by, Math.round(bw * Math.max(0, e.hp / e.maxHp)), bh);
    g.globalAlpha = 1;
  };

  Game.prototype.drawArcher = function (g, x, d, cloak, k) {
    var p = proj(x, d, 0), s = this.st;
    var sc = p.s * (k || 1);
    var sinceShot = s.t - (s.lastShot || -9);
    var sinceHurt = s.t - (s.lastHurt || -9);
    var pose = "idle";
    if (sinceHurt < 0.35) pose = "hit";
    else if (sinceShot < 0.1) pose = "release";
    else if (sinceShot < 0.5) pose = "draw";
    var bob = Math.sin(s.t * 2.2) * 1.6 * sc;
    var pxScale = 2 * (sc / 1.55);        // 整数倍放大，避免像素糊
    var drawH = 64 * pxScale, drawW = 64 * pxScale;

    g.save();
    g.translate(p.x, p.y);
    // 影子
    g.fillStyle = "rgba(0,0,0,0.42)";
    g.beginPath(); g.ellipse(0, 2, drawW * 0.22, drawH * 0.055, 0, 0, 6.283); g.fill();

    // 猎犬（脚边）
    if (B.has(s, "hound")) {
      var hx = -drawW * 0.34, hy = 0;
      g.fillStyle = "#6b5440";
      g.beginPath(); g.ellipse(hx, hy - 5 * sc, 9 * sc, 4.4 * sc, 0, 0, 6.283); g.fill();
      g.beginPath(); g.ellipse(hx + 8 * sc, hy - 9 * sc, 5 * sc, 3.8 * sc, -0.3, 0, 6.283); g.fill();
      g.beginPath(); g.moveTo(hx + 11 * sc, hy - 10 * sc); g.lineTo(hx + 14 * sc, hy - 14 * sc); g.lineTo(hx + 10 * sc, hy - 12 * sc); g.closePath(); g.fill();
    }

    // 立绘
    if (heroImg) {
      var img = (pose === "hit" && heroRed) ? heroRed : heroImg;
      g.imageSmoothingEnabled = false;
      g.save();
      var rot = pose === "draw" ? -0.05 : (pose === "release" ? 0.03 : (pose === "hit" ? -0.16 : 0));
      var dx = pose === "release" ? 3 * sc : (pose === "hit" ? -4 * sc : 0);
      g.translate(dx, bob);
      g.rotate(rot);
      g.drawImage(img, -drawW * 0.42, -drawH, drawW, drawH);
      g.restore();
      g.imageSmoothingEnabled = true;
    }

    // 猎鹰（肩上）
    if (B.has(s, "falcon")) {
      var fy = -drawH * 0.86 + bob;
      g.fillStyle = "#d9c9a8";
      g.beginPath(); g.ellipse(-drawW * 0.06, fy, 5 * sc, 3.4 * sc, -0.2, 0, 6.283); g.fill();
      g.fillStyle = "#b8a88a";
      g.beginPath();
      g.moveTo(-drawW * 0.08, fy - 1 * sc);
      g.quadraticCurveTo(2 * sc, fy - 11 * sc, 9 * sc, fy - 6 * sc);
      g.quadraticCurveTo(2 * sc, fy - 3 * sc, -drawW * 0.08, fy + 1 * sc);
      g.closePath(); g.fill();
      g.fillStyle = "#7a6a52";
      g.beginPath(); g.arc(drawW * 0.04, fy - 2 * sc, 1.4 * sc, 0, 6.283); g.fill();
    }

    // 满弓时给一条"弓弦拉紧"的光带（强化发力感）
    if (pose === "draw") {
      var bowPix = proj(x + 0.022, d, B.CFG.bowH);
      g.strokeStyle = "rgba(255,240,200,0.55)";
      g.lineWidth = 1.6 * sc;
      g.beginPath();
      g.moveTo(bowPix.x - p.x - 12 * sc, bowPix.y - p.y);
      g.lineTo(bowPix.x - p.x + 10 * sc, bowPix.y - p.y);
      g.stroke();
    }

    // 受击红圈
    if (pose === "hit") {
      g.strokeStyle = "rgba(255,90,70,0.8)";
      g.lineWidth = 2.4 * sc;
      g.beginPath(); g.arc(0, -drawH * 0.5, drawW * 0.42, 0, 6.283); g.stroke();
    }
    g.restore();
  };

  /* 箭：按真实速度方向旋转 + 3 点拖影，看得出是抛物线 */
  Game.prototype.drawArrow = function (g, ar) {
    var i, B2 = root.Battle.CFG;
    // 走过的拖尾（更粗）
    if (ar.trail && ar.trail.length > 1) {
      for (i = 0; i < ar.trail.length - 1; i++) {
        var t1 = ar.trail[i], t2 = ar.trail[i + 1];
        var p1 = proj(t1.x, t1.d, t1.y), p2 = proj(t2.x, t2.d, t2.y);
        g.strokeStyle = "rgba(255,240,200," + (0.06 + 0.5 * (i / ar.trail.length)) + ")";
        g.lineWidth = 0.8 + 2.2 * (i / ar.trail.length);
        g.beginPath(); g.moveTo(p1.x, p1.y); g.lineTo(p2.x, p2.y); g.stroke();
      }
    }
    var p = proj(ar.x, ar.d, ar.y);
    var pv = proj(ar.x + 0.012, ar.d + (ar.vd || 0) * 0.012, ar.y + ar.vy * 0.012);
    var ang = Math.atan2(pv.y - p.y, pv.x - p.x);
    // 地面影子，帮助看出高度
    var gs = proj(ar.x, ar.d, 0);
    g.fillStyle = "rgba(0,0,0,0.22)";
    g.beginPath(); g.ellipse(gs.x, gs.y, 3.2 * gs.s, 1.4 * gs.s, 0, 0, 6.283); g.fill();

    g.save();
    g.translate(p.x, p.y);
    g.rotate(ang);
    var L = 15 * p.s;
    g.shadowColor = "rgba(255,230,170,0.85)";
    g.shadowBlur = 6 * p.s;
    g.strokeStyle = "#f3e8cf";
    g.lineWidth = Math.max(2, 2.6 * p.s);
    g.beginPath(); g.moveTo(-L, 0); g.lineTo(L * 0.35, 0); g.stroke();
    g.fillStyle = "#fffaf0";
    g.beginPath(); g.moveTo(L * 0.55, 0); g.lineTo(L * 0.1, -3 * p.s); g.lineTo(L * 0.1, 3 * p.s); g.closePath(); g.fill();
    g.fillStyle = "#ff7a5a";
    g.beginPath(); g.moveTo(-L, 0); g.lineTo(-L - 5 * p.s, -3.4 * p.s); g.lineTo(-L + 1, 0); g.closePath(); g.fill();
    g.shadowBlur = 0;
    g.restore();
  };

  Game.prototype.drawLatticeArrow = function (g, ga, s) {
    var gp = proj(ga.x, ga.d, 0);
    var spent = (ga.hops || 0) >= 2;
    var a = Math.min(1, ga.life / 1.5) * (spent ? 0.4 : 1);
    g.globalAlpha = a;
    if (!spent) {
      var pulse = 0.5 + 0.35 * Math.sin(s.t * 3.6 + ga.x * 14);
      var glow = g.createRadialGradient(gp.x, gp.y - 2, 1, gp.x, gp.y - 2, 20 * gp.s);
      glow.addColorStop(0, "rgba(255,220,150," + (0.5 * pulse) + ")");
      glow.addColorStop(1, "rgba(255,170,80,0)");
      g.fillStyle = glow;
      g.beginPath(); g.ellipse(gp.x, gp.y - 2, 20 * gp.s, 9 * gp.s, 0, 0, 6.283); g.fill();
      g.strokeStyle = "rgba(255,235,180," + (0.75 * pulse) + ")";
      g.lineWidth = 1.8;
      g.beginPath(); g.ellipse(gp.x, gp.y - 1, 13 * gp.s, 5.2 * gp.s, 0, 0, 6.283); g.stroke();
      g.strokeStyle = "rgba(255,220,150," + (0.3 * pulse) + ")";
      g.beginPath(); g.ellipse(gp.x, gp.y - 1, 7 * gp.s, 2.8 * gp.s, 0, 0, 6.283); g.stroke();
    }
    g.shadowColor = spent ? "transparent" : "rgba(255,230,160,0.85)";
    g.shadowBlur = spent ? 0 : 8;
    g.strokeStyle = spent ? "#6f5f4a" : "#fffaf0";
    g.lineWidth = Math.max(3, 3.6 * gp.s);
    g.beginPath();
    g.moveTo(gp.x + 1, gp.y + 1);
    g.lineTo(gp.x - 10 * gp.s, gp.y - 26 * gp.s);
    g.stroke();
    // 箭头（插在地里，露出的尾羽端）
    g.fillStyle = spent ? "rgba(150,130,100,0.65)" : "#ff6a4a";
    g.beginPath();
    g.moveTo(gp.x - 10 * gp.s, gp.y - 26 * gp.s);
    g.lineTo(gp.x - 17 * gp.s, gp.y - 31 * gp.s);
    g.lineTo(gp.x - 7 * gp.s, gp.y - 30 * gp.s);
    g.closePath(); g.fill();
    g.fillStyle = spent ? "rgba(150,130,100,0.5)" : "#fff2d8";
    g.beginPath();
    g.moveTo(gp.x - 10 * gp.s, gp.y - 26 * gp.s);
    g.lineTo(gp.x - 13 * gp.s, gp.y - 33 * gp.s);
    g.lineTo(gp.x - 6 * gp.s, gp.y - 31 * gp.s);
    g.closePath(); g.fill();
    g.shadowBlur = 0;
    g.globalAlpha = 1;
  };

  Game.prototype.drawFx = function (g, fx) {
    if (fx.kind === "boom") {
      var p = proj(fx.x, fx.d, fx.h || 0.3);
      var r = (1 - fx.t / 0.5) * 40 * p.s;
      g.strokeStyle = "rgba(255,170,80," + Math.max(0, fx.t * 1.6) + ")";
      g.lineWidth = 3;
      g.beginPath(); g.arc(p.x, p.y, r, 0, 6.283); g.stroke();
    } else if (fx.kind === "retreat") {
      g.fillStyle = "rgba(6,8,10," + Math.min(0.7, fx.t) + ")";
      g.fillRect(0, 0, W, H);
      g.textAlign = "center";
      g.fillStyle = "rgba(255,190,140," + Math.min(1, fx.t) + ")";
      g.font = "800 17px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("被压退了 · 退回营地", W / 2, 290);
    } else if (fx.kind === "spring") {
      var sp = proj(fx.x, fx.d, 0.05);
      var rr2 = (1 - fx.t / 0.35) * 22 * sp.s;
      g.strokeStyle = "rgba(255,240,200," + Math.max(0, fx.t * 2.4) + ")";
      g.lineWidth = 2;
      g.beginPath(); g.arc(sp.x, sp.y - 4, rr2, 0, 6.283); g.stroke();
    } else if (fx.kind === "talent") {
      g.textAlign = "center";
      g.fillStyle = "rgba(160,230,190," + Math.min(1, fx.t) + ")";
      g.font = "800 14px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("解锁：" + fx.text, W / 2, 120 + (1.2 - fx.t) * 10);
    }
  };

  Game.PANEL_BTN = { x: W - 122, y: 96, w: 106, h: 28 };

  /* 树的位置（横屏 760×420）：按 tier 分层，layer 内左右分列 */
  var TREE_POS = {
    atk:      [380, 56],
    multi:    [200, 104], rapid:   [560, 104],
    pierce:   [140, 152], armor:   [300, 152], combo: [460, 152], slowfield: [660, 152],
    explode:  [90, 200],  thorns:  [250, 200], hawk:  [510, 200], snare:     [690, 200],
    oilfire:  [90, 248],  hound:   [250, 248], archer2:[510, 248], totem:    [690, 248],
    rain:     [140, 296], bastion: [300, 296], falcon:[470, 296],
    storm:    [90, 344],  immortal:[300, 344], queen: [470, 344], quake:     [690, 344]
  };
  var BR_COLOR = {
    spread:  "255,180,90",
    speed:   "120,180,255",
    trap:    "130,220,160",
    survive: "200,150,235",
    root:    "255,215,140"
  };
  Game.NODE_W = 104;
  Game.NODE_H = 38;

  Game.talentRects = function () {
    var out = [];
    for (var i = 0; i < B.TALENTS.length; i++) {
      var t = B.TALENTS[i], pos = TREE_POS[t.id] || [380, 100 + i * 50];
      out.push({ i: i, cx: pos[0], cy: pos[1], x: pos[0] - Game.NODE_W / 2, y: pos[1] - Game.NODE_H / 2, w: Game.NODE_W, h: Game.NODE_H, id: t.id });
    }
    return out;
  };

  Game.prototype.drawTalents = function (g, s) {
    var rects = Game.talentRects(), list = B.TALENTS;
    g.fillStyle = "rgba(5,8,11,0.93)";
    g.fillRect(0, 0, W, H);

    g.textAlign = "center";
    g.fillStyle = "rgba(255,214,150,0.9)";
    g.font = "800 15px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("战 斗 天 赋", W / 2, 30);
    g.fillStyle = "rgba(200,220,245,0.55)";
    g.font = "700 10.5px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("只能按连线顺序解锁 · 当前 " + s.souls + " 魂 · 点右上收起", W / 2, 46);
    var legend = [["spread","散射/爆破"],["speed","疾风/伙伴"],["trap","陷阱/控场"],["survive","生存"]];
    for (var lg = 0; lg < legend.length; lg++) {
      g.fillStyle = "rgba(" + BR_COLOR[legend[lg][0]] + ",0.9)";
      g.beginPath(); g.arc(60 + lg * 116, 62, 4, 0, 6.283); g.fill();
      g.fillStyle = "rgba(220,225,235,0.65)";
      g.font = "700 9px -apple-system,Segoe UI,Roboto,sans-serif";
      g.textAlign = "left";
      g.fillText(legend[lg][1], 68 + lg * 116, 62);
      g.textAlign = "center";
    }

    // 连线
    for (var li = 0; li < list.length; li++) {
      var t2 = list[li];
      for (var r2 = 0; r2 < t2.req.length; r2++) {
        var from = null, to = null;
        for (var mi = 0; mi < rects.length; mi++) {
          if (rects[mi].id === t2.req[r2]) from = rects[mi];
          if (rects[mi].id === t2.id) to = rects[mi];
        }
        if (!from || !to) continue;
        var on = !!s.talents[t2.id], parentOn = !!s.talents[from.id];
        g.strokeStyle = on ? "rgba(150,235,180,0.92)" : (parentOn ? "rgba(255,210,130,0.8)" : "rgba(255,255,255,0.22)");
        g.lineWidth = on ? 3 : 2.2;
        g.beginPath();
        g.moveTo(from.cx, from.y + from.h);
        var midY = (from.y + from.h + to.y) / 2;
        g.bezierCurveTo(from.cx, midY, to.cx, midY, to.cx, to.y - 7);
        g.stroke();
        // 箭头
        g.fillStyle = on ? "rgba(150,235,180,0.95)" : (parentOn ? "rgba(255,210,130,0.9)" : "rgba(255,255,255,0.25)");
        g.beginPath();
        g.moveTo(to.cx, to.y - 1);
        g.lineTo(to.cx - 5, to.y - 9);
        g.lineTo(to.cx + 5, to.y - 9);
        g.closePath();
        g.fill();
      }
    }
    for (var i = 0; i < rects.length; i++) {
      var r = rects[i], t = list[i];
      if (!t) continue;
      var stt = B.talentState(s, t);
      var owned = stt === "owned";
      var bc = BR_COLOR[t.br] || "255,215,140";
      g.fillRect(r.x, r.y, r.w, r.h);
      g.fillStyle = owned ? "rgba(" + bc + ",0.26)" : (stt === "ready" ? "rgba(" + bc + ",0.14)" : "rgba(255,255,255,0.03)");
      g.fill();
      g.strokeStyle = owned ? "rgba(" + bc + ",0.85)" : (stt === "ready" ? "rgba(" + bc + ",0.55)" : "rgba(255,255,255,0.1)");
      g.lineWidth = 1.2;
      rr(g, r.x, r.y, r.w, r.h, 9);
      g.stroke();
      if (stt === "sealed") {
        g.strokeStyle = "rgba(200,110,110,0.35)";
        g.lineWidth = 1.4;
        g.beginPath(); g.moveTo(r.x + 6, r.y + r.h - 6); g.lineTo(r.x + r.w - 6, r.y + 6); g.stroke();
      }

      g.textAlign = "left";
      g.fillStyle = owned ? "#f2fff5" : (stt === "locked" ? "rgba(232,220,205,0.72)" : "#fff2dc");
      g.font = "800 11.5px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText(t.nm, r.x + 8, r.y + 14);
      g.fillStyle = stt === "locked" ? "rgba(215,200,182,0.5)" : "rgba(230,218,202,0.8)";
      g.font = "600 8px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText(t.desc.slice(0, 12), r.x + 8, r.y + 27);
      if (t.desc.length > 12) g.fillText(t.desc.slice(12, 24), r.x + 8, r.y + 36);

      g.textAlign = "right";
      if (stt === "sealed") {
        g.fillStyle = "rgba(200,120,120,0.85)";
        g.font = "800 9.5px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText("已封闭", r.x + r.w - 8, r.y + 14);
      } else if (owned) {
        g.fillStyle = "rgba(140,220,170,0.9)";
        g.font = "800 9.5px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText(t.repeat ? "Lv" + (s.bought[t.id] || 1) : "已解锁", r.x + r.w - 8, r.y + 14);
      } else if (stt === "locked") {
        g.fillStyle = "rgba(220,205,185,0.35)";
        g.font = "700 9px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText("需前置", r.x + r.w - 8, r.y + 14);
      } else {
        g.fillStyle = stt === "ready" ? "#ffd24a" : "rgba(220,200,180,0.42)";
        g.font = "800 10px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText(B.talentCost(s, t) + " 魂", r.x + r.w - 8, r.y + 14);
      }
    }
  };

  /* ---------------- 启动 ---------------- */
  var game = null, last = 0, saveAcc = 0;

  function toLocal(e) {
    var cv = root.document.getElementById("game");
    if (!cv._rect) cv._rect = cv.getBoundingClientRect();
    var r = cv._rect;
    return { x: (e.clientX - r.left) / (r.width / W), y: (e.clientY - r.top) / (r.height / H) };
  }

  function onDown(e) {
    e.preventDefault();
    var p = toLocal(e);
    var b = Game.PANEL_BTN;
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      game.panelOpen = !game.panelOpen;
      return;
    }
    if (game.panelOpen) {
      var rects = Game.talentRects(), list = B.TALENTS;
      for (var i = 0; i < rects.length; i++) {
        var r = rects[i];
        if (list[i] && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
          B.buyTalent(game.st, list[i].id);
          return;
        }
      }
      game.panelOpen = false;
      return;
    }
    if (p.y >= FIELD.y && p.y <= FIELD.y + FIELD.h) game.tapField(p.x, p.y);
  }

  function boot() {
    var canvas = root.document.getElementById("game");
    game = new Game(canvas);
    game.load();
    fit(canvas);
    root.addEventListener("resize", function () { fit(canvas); });
    canvas.addEventListener("pointerdown", onDown);
    root.addEventListener("visibilitychange", function () { if (game) game.save(); });
    root.addEventListener("beforeunload", function () { if (game) game.save(); });
    last = Date.now();
    loop();
  }

  function fit(canvas) {
    var vw = root.innerWidth || W, vh = root.innerHeight || H;
    var s = Math.min(vw / W, vh / H);
    canvas.style.width = Math.round(W * s) + "px";
    canvas.style.height = Math.round(H * s) + "px";
    canvas._rect = null;
  }

  function loop() {
    var now = Date.now();
    var dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    game.update(dt);
    game.draw();
    saveAcc += dt;
    if (saveAcc > 4) { saveAcc = 0; game.save(); }
    root.requestAnimationFrame(loop);
  }

  root.API = {
    g: function () { return game; },
    info: function () {
      var s = game.st;
      return {
        souls: s.souls, wave: s.wave, kills: s.kills, atk: s.atk, hp: s.hp,
        enemies: s.enemies.length, arrows: s.arrows.length,
        shots: s.shots, misses: s.misses,
        talents: Object.keys(s.talents), retreats: s.retreats
      };
    },
    step: function (n, dt) {
      dt = dt || 1 / 60;
      for (var i = 0; i < (n || 1); i++) game.update(dt);
      game.draw();
      return this.info();
    },
    shootNearest: function () {
      var e = B.nearest(game.st);
      if (e) { B.shootWorld(game.st, e.x, e.d); return true; }
      return false;
    },
    buy: function (id) { return B.buyTalent(game.st, id); },
    tapAt: function (x, y) { return game.tapField(x, y); }
  };

  if (root.document.readyState === "loading") root.document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(typeof window !== "undefined" ? window : globalThis);

</script>
</body>
</html>
