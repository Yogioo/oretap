<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>敲矿·弓</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#06080a;overflow:hidden;
    -webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif}
  #stage{display:flex;align-items:center;justify-content:center;height:100%}
  #game{display:block;touch-action:none}
  #rotate{position:fixed;left:0;right:0;top:0;bottom:0;display:none;align-items:center;justify-content:center;
    color:#ffd27a;font-size:18px;font-weight:800;background:#05070a;letter-spacing:1px}
  @media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="760" height="420"></canvas></div>
<div id="rotate">请横过手机 ⟳</div>
<script>
/* ==== src/battle.js ==== */
/* 《敲矿·弓》v13
   ① 箭从弓的位置射出（起点修正）
   ② 自动瞄准（带提前量）+ 自动射击 = 默认行为，玩家只需指挥/点杀优先目标
   ③ 天赋改成树：分先后解锁，有连线 */
(function (root) {
  "use strict";

  var CFG = {
    spawnEvery: 2.2,
    maxEnemies: 4,
    archerX: 0.19,
    archerD: 0.15,
    bowH: 0.17,          // 弓的高度（世界单位）—— 箭必须从这里出
    aimH: 0.24,          // 瞄准高度（敌人胸口）
    autoEvery: 1.15,     // 自动射击间隔
    v0: 0.78,
    gravity: 6.0,
    atkBase: 1,
    hpBase: 12,
    hitR: 0.045,
    soulPerKill: 1,
    retreatInvuln: 1.6
  };

  /* 树：tier 决定上下层，parent 决定连线与解锁顺序 */
  var TALENTS = [
    { id: "atk",    nm: "臂力",     tier: 0, cost: 4,   desc: "每支箭伤害 +1（可叠加）", req: [], repeat: true },
    { id: "multi",  nm: "多重箭",   tier: 1, cost: 10,  desc: "一次射 2 支，上下分开", req: ["atk"] },
    { id: "rapid",  nm: "快射",     tier: 1, cost: 12,  desc: "自动射击间隔 -35%", req: ["atk"] },
    { id: "pierce", nm: "穿透箭",   tier: 2, cost: 22,  desc: "箭穿过敌人继续飞，最多穿 3 个", req: ["multi"] },
    { id: "combo",  nm: "连击",     tier: 2, cost: 26,  desc: "连中 3 次后伤害翻倍，打空归零", req: ["rapid"] },
    { id: "explode",nm: "爆炸箭",   tier: 3, cost: 50,  desc: "命中点炸开，周围吃 60% 伤害", req: ["pierce"] },
    { id: "rain",   nm: "箭雨",     tier: 4, cost: 110, desc: "每 9 秒朝一片区域落 5 支箭", req: ["explode"] },
    { id: "archer2",nm: "第二弓手", tier: 5, cost: 180, desc: "再上一个弓手，独立开火", req: ["rain"] }
  ];

  function newState(seed) {
    return {
      t: 0, souls: 0, wave: 1, kills: 0, retreats: 0, misses: 0, shots: 0,
      hp: CFG.hpBase, maxHp: CFG.hpBase, invuln: 0,
      arrows: [], enemies: [], fx: [], pops: [], groundArrows: [],
      spawnT: 1.0, fireCd: 0.8, rainT: 9,
      comboHits: 0, comboLast: 0,
      talents: {}, bought: {}, atk: CFG.atkBase,
      rand: (function (s0) {
        var x = (s0 || 12345) >>> 0;
        return function () { x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
      })(seed)
    };
  }

  function has(st, id) { return !!st.talents[id]; }
  function talentCost(st, t) {
    return t.repeat ? Math.round(t.cost * Math.pow(1.4, st.bought[t.id] || 0)) : t.cost;
  }
  function talentState(st, t) {
    if (!t.repeat && st.talents[t.id]) return "owned";
    for (var i = 0; i < t.req.length; i++) if (!st.talents[t.req[i]]) return "locked";
    return st.souls >= talentCost(st, t) ? "ready" : "poor";
  }
  function buyTalent(st, id) {
    var t = null;
    for (var i = 0; i < TALENTS.length; i++) if (TALENTS[i].id === id) t = TALENTS[i];
    if (!t || talentState(st, t) !== "ready") return false;
    st.souls -= talentCost(st, t);
    st.bought[id] = (st.bought[id] || 0) + 1;
    st.talents[id] = 1;
    if (id === "atk") st.atk += 1;
    st.fx.push({ t: 1.2, kind: "talent", text: t.nm });
    return true;
  }

  function spawn(st) {
    var d = -0.7 + st.rand() * 1.4;
    var hp = 2 + Math.floor(st.wave * 1.4);
    st.enemies.push({
      x: 1.03 + st.rand() * 0.05, d: d, hp: hp, maxHp: hp,
      speed: 0.075 + Math.min(0.06, st.wave * 0.005),
      atkCd: 1.0, hit: 0, bob: st.rand() * 6.28,
      id: Math.floor(st.rand() * 1e6)
    });
  }

  /* 给定 vx，解出能落在 (tx, ty) 的 vy（这就是"瞄准"，飞行中不再修正） */
  function solveVy(sx, sy, tx, ty, gravity) {
    var vx = CFG.v0 * 0.92;
    var dx = Math.max(0.03, tx - sx);
    var t = dx / vx;
    var vy = ((ty - sy) + 0.5 * gravity * t * t) / t;
    return { vx: vx, vy: vy, t: t };
  }

  function fireAtPoint(st, tx, td, fromX, fromD, dmgMul) {
    var sx = (fromX === undefined) ? CFG.archerX + 0.022 : fromX;
    var sd = (fromD === undefined) ? CFG.archerD : fromD;
    var sy = CFG.bowH;
    var s = solveVy(sx, sy, tx, CFG.aimH, CFG.gravity);

    var dmg = Math.round(st.atk * (dmgMul || 1));
    if (has(st, "combo") && st.comboHits >= 3) dmg *= 2;

    var shots = has(st, "multi") ? 2 : 1;
    for (var k = 0; k < shots; k++) {
      var off = shots > 1 ? (k === 0 ? -0.05 : 0.05) : 0;
      st.arrows.push({
        x: sx, y: sy, d: sd,
        vx: s.vx, vy: s.vy, vd: ((td + off) - sd) / s.t,
        dmg: dmg, life: 3.5, trail: [],
        hits: 0, pierce: has(st, "pierce"),
        origin: { x: sx, d: sd, y: sy }
      });
    }
    st.shots += shots;
  }

  function shootWorld(st, tx, td) { fireAtPoint(st, tx, td); }

  /* 自动瞄准：算敌人的提前量（迭代两次足够） */
  function predict(st, e) {
    var tx = e.x, td = e.d;
    for (var it = 0; it < 2; it++) {
      var s = solveVy(CFG.archerX + 0.022, CFG.bowH, tx, CFG.aimH, CFG.gravity);
      var t = s.t;
      var nx = e.x - e.speed * t;      // 敌人向左走
      if (nx < CFG.archerX + 0.08) nx = CFG.archerX + 0.08;
      tx = nx;
    }
    return { x: tx, d: td };
  }

  function hitEnemy(st, e, dmg) {
    e.hp -= dmg;
    e.hit = 1;
    st.pops.push({ t: 1, text: "-" + dmg, x: e.x, d: e.d, h: 0.55 });
    if (e.hp <= 0) {
      var i = st.enemies.indexOf(e);
      if (i >= 0) st.enemies.splice(i, 1);
      st.kills++;
      var gain = CFG.soulPerKill + Math.floor(st.wave / 4);
      st.souls += gain;
      if (st.kills % 6 === 0) st.wave++;
      st.pops.push({ t: 1.3, text: "+" + gain, x: e.x, d: e.d, h: 0.8, soul: true });
      if (has(st, "explode")) {
        var list = st.enemies.slice();
        for (var j = 0; j < list.length; j++) {
          var o = list[j];
          if (Math.abs(o.x - e.x) < 0.22 && Math.abs(o.d - e.d) < 0.5) hitEnemy(st, o, Math.max(1, Math.round(dmg * 0.6)));
        }
        st.fx.push({ t: 0.5, kind: "boom", x: e.x, d: e.d, h: 0.4 });
      }
    }
  }

  function step(st, dt) {
    st.t += dt;
    if (st.invuln > 0) st.invuln -= dt;
    if (st.hp < st.maxHp) st.hp = Math.min(st.maxHp, st.hp + 0.22 * dt);

    st.spawnT -= dt;
    if (st.spawnT <= 0 && st.enemies.length < CFG.maxEnemies) {
      st.spawnT = CFG.spawnEvery / (1 + st.wave * 0.03);
      spawn(st);
    }

    for (var i = st.enemies.length - 1; i >= 0; i--) {
      var e = st.enemies[i];
      if (!e) continue;
      e.hit = Math.max(0, e.hit - dt * 4);
      if (e.x > CFG.archerX + 0.10) {
        e.x -= e.speed * dt;
        e.d += Math.sin(st.t * 0.9 + e.bob) * 0.12 * dt;
      } else {
        e.atkCd -= dt;
        if (e.atkCd <= 0) {
          e.atkCd = 1.7;
          if (st.invuln <= 0) {
            st.hp -= 1;
            st.fx.push({ t: 0.35, kind: "hurt" });
            if (st.hp <= 0) {
              st.hp = st.maxHp; st.invuln = CFG.retreatInvuln;
              st.retreats++; st.wave = Math.max(1, st.wave - 1);
              st.enemies.length = 0; st.arrows.length = 0;
              st.fx.push({ t: 1.5, kind: "retreat" });
            }
          }
        }
      }
    }

    /* 默认自动瞄准 + 自动射击 */
    st.fireCd -= dt;
    if (st.fireCd <= 0) {
      var near = nearest(st);
      if (near) {
        var p = predict(st, near);
        fireAtPoint(st, p.x, p.d);
        st.fireCd = CFG.autoEvery * (has(st, "rapid") ? 0.65 : 1);
      } else st.fireCd = 0.25;
    }

    if (has(st, "rain")) {
      st.rainT -= dt;
      if (st.rainT <= 0) {
        st.rainT = 9;
        for (var r = 0; r < 5; r++) fireAtPoint(st, 0.5 + st.rand() * 0.42, -0.7 + st.rand() * 1.4, 0.52, -0.8 + st.rand() * 1.6);
        st.fx.push({ t: 1, kind: "rain" });
      }
    }

    for (var a = st.arrows.length - 1; a >= 0; a--) {
      var ar = st.arrows[a];
      if (!ar) continue;
      ar.vy -= CFG.gravity * dt;
      ar.x += ar.vx * dt;
      ar.y += ar.vy * dt;
      ar.d += ar.vd * dt;
      ar.life -= dt;
      ar.trail.push({ x: ar.x, y: ar.y, d: ar.d });
      if (ar.trail.length > 10) ar.trail.shift();

      var hit = null;
      for (var q = 0; q < st.enemies.length; q++) {
        var en = st.enemies[q];
        if (Math.abs(en.x - ar.x) < CFG.hitR && ar.y < 0.66 && ar.y > -0.03 && Math.abs(en.d - ar.d) < 0.4) { hit = en; break; }
      }
      if (hit) {
        hitEnemy(st, hit, ar.dmg);
        st.comboHits++; st.comboLast = st.t;
        if (ar.pierce && ar.hits < 2) { ar.hits++; ar.dmg = Math.max(1, Math.round(ar.dmg * 0.7)); continue; }
        st.arrows.splice(a, 1);
        continue;
      }
      if (ar.y <= 0 || ar.x > 1.06 || ar.life <= 0) {
        if (ar.y <= 0 && ar.x < 1.02) st.groundArrows.push({ x: ar.x, d: ar.d, life: 3 });
        st.arrows.splice(a, 1);
        st.comboHits = 0;
        st.misses++;
      }
    }

    if (has(st, "combo") && st.t - st.comboLast > 3) st.comboHits = 0;

    for (var f = st.fx.length - 1; f >= 0; f--) { st.fx[f].t -= dt; if (st.fx[f].t <= 0) st.fx.splice(f, 1); }
    for (var p2 = st.pops.length - 1; p2 >= 0; p2--) { st.pops[p2].t -= dt * 1.1; if (st.pops[p2].t <= 0) st.pops.splice(p2, 1); }
    for (var ga = st.groundArrows.length - 1; ga >= 0; ga--) { st.groundArrows[ga].life -= dt; if (st.groundArrows[ga].life <= 0) st.groundArrows.splice(ga, 1); }
  }

  function nearest(st) {
    var best = null, bx = 2;
    for (var i = 0; i < st.enemies.length; i++) if (st.enemies[i].x < bx) { bx = st.enemies[i].x; best = st.enemies[i]; }
    return best;
  }

  root.Battle = {
    CFG: CFG, TALENTS: TALENTS, newState: newState, step: step,
    fireAtPoint: fireAtPoint, shootWorld: shootWorld, nearest: nearest, has: has, predict: predict,
    talentCost: talentCost, talentState: talentState, buyTalent: buyTalent
  };
})(typeof window !== "undefined" ? window : globalThis);

/* ==== src/battleview.js ==== */
/* 《敲矿·弓》渲染：横版侧视（DNF 视角）+ 抛物弹道可视化 */
(function (root) {
  "use strict";
  var B = root.Battle, W = 760, H = 420;

  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  var FIELD = { x: 0, y: 52, w: W, h: 368 };
  var GROUND = FIELD.y + FIELD.h * 0.90;      // 角色脚底线
  var PAD = 40;

  /* 世界 → 屏幕：x 0..1 横向，d -1..1 走位纵深（屏幕上下），h 离地高度 */
  function proj(x, d, h) {
    var baseY = GROUND - (d || 0) * 46;
    var sc = 1.55 * (1 - (d || 0) * 0.13);
    var sx = FIELD.x + PAD + (x || 0) * (FIELD.w - PAD * 2);
    var sy = baseY - (h || 0) * 120 * sc;
    return { x: sx, y: sy, s: sc };
  }

  function unprojX(px) { return (px - FIELD.x - PAD) / (FIELD.w - PAD * 2); }
  function unprojD(py) { return Math.max(-0.95, Math.min(0.95, (GROUND - py) / 46)); }

  function Game(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.st = B.newState((Date.now() % 99991) + 5);
    this.aim = null;
  }

  Game.FIELD = FIELD;
  Game.proj = proj;

  Game.prototype.save = function () {
    var s = this.st;
    try {
      root.localStorage.setItem("oretap_bow_save", JSON.stringify({
        souls: s.souls, wave: s.wave, kills: s.kills, atk: s.atk,
        talents: s.talents, bought: s.bought, at: Date.now()
      }));
    } catch (e) {}
  };

  Game.prototype.load = function () {
    var raw = null;
    try { raw = root.localStorage.getItem("oretap_bow_save"); } catch (e) {}
    if (!raw) return;
    try {
      var d = JSON.parse(raw), s = this.st;
      s.souls = d.souls || 0; s.wave = d.wave || 1; s.kills = d.kills || 0;
      s.atk = d.atk || 1; s.talents = d.talents || {}; s.bought = d.bought || {};
      s.maxHp = B.CFG.hpBase; s.hp = s.maxHp;
    } catch (e) {}
  };

  /* 点战场：那个点就是落点（不锁敌）→ 敌人走开就会打空 */
  Game.prototype.tapField = function (px, py) {
    var x = unprojX(px), d = unprojD(py);
    if (x < 0.28) x = 0.28;
    B.shootWorld(this.st, Math.min(1.0, x), d);
    this.aim = { x: x, d: d, t: 0.35 };
    return true;
  };

  Game.prototype.update = function (dt) {
    B.step(this.st, dt);
    if (this.aim) { this.aim.t -= dt; if (this.aim.t <= 0) this.aim = null; }
  };

  Game.prototype.draw = function () {
    var g = this.ctx, s = this.st, i;
    g.clearRect(0, 0, W, H);
    var bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#0a0e12");
    bg.addColorStop(0.55, "#090c10");
    bg.addColorStop(1, "#05070a");
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);

    this.drawScene(g, s);
    this.drawHud(g, s);

    // 落点提示
    if (this.aim) {
      var ap = proj(this.aim.x, this.aim.d, 0);
      g.strokeStyle = "rgba(255,220,150," + (this.aim.t * 1.4) + ")";
      g.lineWidth = 1.6;
      g.beginPath(); g.ellipse(ap.x, ap.y, 9, 4, 0, 0, 6.283); g.stroke();
    }

    // 敌人（按纵深排序：远处先画）
    var list = s.enemies.slice().sort(function (a, b) { return b.d - a.d; });
    for (i = 0; i < list.length; i++) this.drawEnemy(g, list[i], s);

    // 弓手
    this.drawArcher(g, B.CFG.archerX, B.CFG.archerD, "rgba(200,90,70,0.92)", 1);
    if (B.has(s, "archer2")) this.drawArcher(g, B.CFG.archerX - 0.05, B.CFG.archerD + 0.42, "rgba(80,130,210,0.92)", 0.92);

    // 箭 + 拖影
    for (i = 0; i < s.arrows.length; i++) this.drawArrow(g, s.arrows[i]);

    // 地上插的箭
    for (i = 0; i < s.groundArrows.length; i++) {
      var ga = s.groundArrows[i];
      var gp = proj(ga.x, ga.d, 0);
      g.globalAlpha = Math.min(1, ga.life);
      g.strokeStyle = "#d8c8a4";
      g.lineWidth = 1.8;
      g.beginPath();
      g.moveTo(gp.x, gp.y);
      g.lineTo(gp.x - 9 * gp.s, gp.y - 12 * gp.s);
      g.stroke();
      g.globalAlpha = 1;
    }

    // 飘字
    for (i = 0; i < s.pops.length; i++) {
      var pop = s.pops[i];
      var pp = proj(pop.x, pop.d, pop.h || 0.5);
      g.globalAlpha = Math.min(1, pop.t);
      g.fillStyle = pop.soul ? "#ffd24a" : "#ffb08a";
      g.font = "800 " + Math.round(13 * pp.s) + "px -apple-system,Segoe UI,Roboto,sans-serif";
      g.textAlign = "center";
      g.fillText(pop.text, pp.x, pp.y);
      g.globalAlpha = 1;
    }
    for (i = 0; i < s.fx.length; i++) this.drawFx(g, s.fx[i]);

    if (s.invuln > 0) {
      g.fillStyle = "rgba(255,90,60," + (0.05 + 0.05 * Math.sin(s.t * 18)) + ")";
      g.fillRect(0, 0, W, H);
    }

    if (this.panelOpen) this.drawTalents(g, s);
    this.drawPanelButton(g, s);
  };

  Game.prototype.drawPanelButton = function (g, s) {
    var b = Game.PANEL_BTN;
    var avail = 0;
    for (var i = 0; i < B.TALENTS.length; i++) if (B.talentState(s, B.TALENTS[i]) === "ready") avail++;
    rr(g, b.x, b.y, b.w, b.h, 10);
    g.fillStyle = avail ? "rgba(255,190,90,0.9)" : "rgba(255,255,255,0.07)";
    g.fill();
    g.strokeStyle = avail ? "rgba(255,220,150,0.9)" : "rgba(255,255,255,0.14)";
    g.lineWidth = 1.2;
    rr(g, b.x, b.y, b.w, b.h, 10);
    g.stroke();
    g.textAlign = "center";
    g.fillStyle = avail ? "#241605" : "rgba(230,220,205,0.6)";
    g.font = "800 13px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText(this.panelOpen ? "收起" : ("天赋" + (avail ? " · " + avail + " 可点" : "")), b.x + b.w / 2, b.y + b.h / 2);
  };

  /* ---------- 场景：横版洞窟 ---------- */
  Game.prototype.drawScene = function (g, s) {
    var FLOOR_TOP = GROUND - 58;
    // 背墙
    var wall = g.createLinearGradient(0, FIELD.y, 0, FLOOR_TOP);
    wall.addColorStop(0, "#161d24");
    wall.addColorStop(0.6, "#1d252c");
    wall.addColorStop(1, "#232b31");
    g.fillStyle = wall;
    g.fillRect(0, FIELD.y, W, FLOOR_TOP - FIELD.y);

    // 背墙岩块（低对比）
    g.fillStyle = "rgba(255,255,255,0.025)";
    for (var bx = 0; bx < 20; bx++) {
      for (var by = 0; by < 4; by++) {
        var bx2 = bx * 40 + (by % 2) * 20, by2 = FIELD.y + 12 + by * 32;
        if (by2 > FLOOR_TOP - 20) continue;
        g.fillRect(bx2, by2, 30, 22);
      }
    }
    // 背墙上的火把
    for (var t2 = 0; t2 < 3; t2++) {
      var tx = 110 + t2 * 220, ty = FLOOR_TOP - 74;
      var fg = g.createRadialGradient(tx, ty, 2, tx, ty, 30);
      fg.addColorStop(0, "rgba(255,180,80,0.30)");
      fg.addColorStop(1, "rgba(255,140,50,0)");
      g.fillStyle = fg;
      g.beginPath(); g.arc(tx, ty, 30, 0, 6.283); g.fill();
      g.fillStyle = "#ffcb6a";
      g.beginPath(); g.ellipse(tx, ty, 3.2, 5.4, 0, 0, 6.283); g.fill();
      g.fillStyle = "#3a2a1c";
      g.fillRect(tx - 1.6, ty + 4, 3.2, 10);
    }

    // 地面（侧视：横条 + 砖缝，远端压缩）
    var floorG = g.createLinearGradient(0, FLOOR_TOP, 0, FIELD.y + FIELD.h);
    floorG.addColorStop(0, "#2a241d");
    floorG.addColorStop(0.28, "#4a4034");
    floorG.addColorStop(1, "#332b22");
    g.fillStyle = floorG;
    g.fillRect(0, FLOOR_TOP, W, FIELD.y + FIELD.h - FLOOR_TOP);

    // 砖缝：横向线按纵深压缩
    g.strokeStyle = "rgba(0,0,0,0.22)";
    g.lineWidth = 1;
    for (var r = 0; r < 7; r++) {
      var yy = FLOOR_TOP + Math.pow(r / 6, 1.45) * (FIELD.y + FIELD.h - FLOOR_TOP);
      g.beginPath(); g.moveTo(0, yy); g.lineTo(W, yy); g.stroke();
    }
    // 竖缝
    g.strokeStyle = "rgba(0,0,0,0.14)";
    for (var c = 0; c < 30; c++) {
      var xx = c * 26 + (c % 2) * 13;
      g.beginPath(); g.moveTo(xx, FLOOR_TOP); g.lineTo(xx + 16, FIELD.y + FIELD.h); g.stroke();
    }

    // 三条走位带（纵深参照）
    g.strokeStyle = "rgba(255,225,180,0.06)";
    g.lineWidth = 1;
    for (var lane = -1; lane <= 1; lane += 0.5) {
      var ly = GROUND - lane * 46;
      g.beginPath(); g.moveTo(PAD * 0.4, ly); g.lineTo(W - PAD * 0.4, ly); g.stroke();
    }

    // 地面线（角色站位基准）
    g.strokeStyle = "rgba(255,225,180,0.10)";
    g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(0, FLOOR_TOP); g.lineTo(W, FLOOR_TOP); g.stroke();
    // 墙脚阴影
    var sk = g.createLinearGradient(0, FLOOR_TOP, 0, FLOOR_TOP + 26);
    sk.addColorStop(0, "rgba(0,0,0,0.5)");
    sk.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = sk;
    g.fillRect(0, FLOOR_TOP, W, 26);

    // 前景（画面最下方的暗角，压住底部）
    var vg = g.createLinearGradient(0, FIELD.y + FIELD.h - 40, 0, FIELD.y + FIELD.h);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.55)");
    g.fillStyle = vg;
    g.fillRect(0, FIELD.y + FIELD.h - 40, W, 40);
  };

  Game.prototype.drawEnemy = function (g, e, s) {
    var p = proj(e.x, e.d, 0);
    var fade = 1 + Math.min(0, e.d) * 0.35;      // 越远越暗
    g.globalAlpha = Math.max(0.45, fade);
    var sc = p.s;
    var hgt = 21 * sc;
    var wob = 1 + Math.sin(s.t * 4 + e.bob) * 0.08;
    // 影子
    g.fillStyle = "rgba(0,0,0,0.4)";
    g.beginPath(); g.ellipse(p.x, p.y, 13 * sc, 4.2 * sc, 0, 0, 6.283); g.fill();
    // 身体
    g.fillStyle = e.hit > 0.05 ? "rgba(255,205,205,0.98)" : "rgba(150,85,190,0.98)";
    g.beginPath();
    g.ellipse(p.x, p.y - hgt * 0.45, 13.5 * sc * wob, hgt * 0.58 / wob, 0, 0, 6.283);
    g.fill();
    g.strokeStyle = "rgba(255,225,255,0.5)";
    g.lineWidth = 1.2;
    g.stroke();
    // 眼睛（朝左看弓手）
    g.fillStyle = "#140c18";
    g.beginPath(); g.arc(p.x - 4.4 * sc, p.y - hgt * 0.52, 1.6 * sc, 0, 6.283); g.fill();
    g.beginPath(); g.arc(p.x - 1.2 * sc, p.y - hgt * 0.52, 1.6 * sc, 0, 6.283); g.fill();
    // 血条
    var bw = 24 * sc;
    g.fillStyle = "rgba(0,0,0,0.5)";
    rr(g, p.x - bw / 2, p.y - hgt - 11 * sc, bw, 3.6 * sc, 2); g.fill();
    g.fillStyle = "rgba(235,95,85,0.95)";
    rr(g, p.x - bw / 2, p.y - hgt - 11 * sc, bw * Math.max(0, e.hp / e.maxHp), 3.6 * sc, 2); g.fill();
    g.globalAlpha = 1;
  };

  /* 弓手：侧视，面朝右 */
  Game.prototype.drawArcher = function (g, x, d, cloak, k) {
    var p = proj(x, d, 0), sc = p.s * (k || 1), s = this.st;
    var bodyH = 24 * sc;
    g.fillStyle = "rgba(0,0,0,0.35)";
    g.beginPath(); g.ellipse(p.x, p.y + 1, 11 * sc, 3.6 * sc, 0, 0, 6.283); g.fill();
    // 披风（在背后，即左侧）
    g.fillStyle = cloak;
    g.beginPath();
    g.moveTo(p.x - 3 * sc, p.y - bodyH * 0.85);
    g.quadraticCurveTo(p.x - 15 * sc, p.y - bodyH * 0.45, p.x - 11 * sc, p.y - 2);
    g.quadraticCurveTo(p.x - 5 * sc, p.y - 4 * sc, p.x - 3 * sc, p.y - bodyH * 0.45);
    g.closePath(); g.fill();
    // 腿
    g.strokeStyle = "#3b4a55";
    g.lineWidth = 3 * sc;
    g.beginPath(); g.moveTo(p.x - 2 * sc, p.y - bodyH * 0.3); g.lineTo(p.x - 5 * sc, p.y); g.stroke();
    g.beginPath(); g.moveTo(p.x + 2 * sc, p.y - bodyH * 0.3); g.lineTo(p.x + 5 * sc, p.y); g.stroke();
    // 身体
    g.fillStyle = "#8a97a3";
    rr(g, p.x - 6 * sc, p.y - bodyH * 0.88, 12 * sc, bodyH * 0.6, 4 * sc); g.fill();
    // 头（兜帽）+ 面朝右的脸
    g.fillStyle = "#c9d4de";
    g.beginPath(); g.arc(p.x + 1 * sc, p.y - bodyH * 1.0, 5.2 * sc, 0, 6.283); g.fill();
    g.fillStyle = "#6e7c88";
    g.beginPath(); g.arc(p.x + 1 * sc, p.y - bodyH * 1.0, 5.2 * sc, Math.PI * 0.75, Math.PI * 1.9); g.fill();
    g.fillStyle = "#20262c";
    g.beginPath(); g.arc(p.x + 4 * sc, p.y - bodyH * 1.0, 1.1 * sc, 0, 6.283); g.fill();
    // 弓：画在箭的真实起点（世界坐标 bowH），保证"箭从弓里射出来"
    var bowPix = proj(x + 0.022, d, B.CFG.bowH);
    var bx = bowPix.x, by = bowPix.y;
    var pull = 3.0 + Math.sin(s.t * 6) * 0.6;
    g.strokeStyle = "#c9a15f";
    g.lineWidth = 2.3 * sc;
    g.beginPath();
    g.moveTo(bx, by - 10 * sc);
    g.quadraticCurveTo(bx + 6 * sc, by, bx, by + 10 * sc);
    g.stroke();
    g.strokeStyle = "rgba(245,240,225,0.85)";
    g.lineWidth = 1 * sc;
    g.beginPath();
    g.moveTo(bx, by - 10 * sc);
    g.lineTo(bx - pull * sc, by);
    g.lineTo(bx, by + 10 * sc);
    g.stroke();
    // 前手
    g.fillStyle = "#c9d4de";
    g.beginPath(); g.arc(bx - pull * sc, by, 2 * sc, 0, 6.283); g.fill();
  };

  /* 箭：按真实速度方向旋转 + 3 点拖影，看得出是抛物线 */
  Game.prototype.drawArrow = function (g, ar) {
    var i, B2 = root.Battle.CFG;
    // 整条抛物线：从当前位置往后推算到落地，画成点线（一眼看出是物理弹道）
    g.strokeStyle = "rgba(255,235,190,0.30)";
    g.lineWidth = 1.2;
    g.beginPath();
    var first = true;
    for (i = 0; i <= 22; i++) {
      var dt = i * 0.028;
      var px2 = ar.x + ar.vx * dt;
      var py2 = ar.y + ar.vy * dt - 0.5 * B2.gravity * dt * dt;
      var pd2 = ar.d + (ar.vd || 0) * dt;
      if (py2 < 0) break;
      var sp2 = proj(px2, pd2, py2);
      if (first) { g.moveTo(sp2.x, sp2.y); first = false; }
      else g.lineTo(sp2.x, sp2.y);
    }
    g.stroke();
    // 走过的拖尾（更粗）
    if (ar.trail && ar.trail.length > 1) {
      g.strokeStyle = "rgba(255,246,214,0.55)";
      g.lineWidth = 2;
      g.beginPath();
      for (i = 0; i < ar.trail.length; i++) {
        var t1 = ar.trail[i];
        var pp = proj(t1.x, t1.d, t1.y);
        if (i === 0) g.moveTo(pp.x, pp.y); else g.lineTo(pp.x, pp.y);
      }
      g.stroke();
    }
    var p = proj(ar.x, ar.d, ar.y);
    var pv = proj(ar.x + 0.012, ar.d + (ar.vd || 0) * 0.012, ar.y + ar.vy * 0.012);
    var ang = Math.atan2(pv.y - p.y, pv.x - p.x);
    // 地面影子，帮助看出高度
    var gs = proj(ar.x, ar.d, 0);
    g.fillStyle = "rgba(0,0,0,0.22)";
    g.beginPath(); g.ellipse(gs.x, gs.y, 3.2 * gs.s, 1.4 * gs.s, 0, 0, 6.283); g.fill();

    g.save();
    g.translate(p.x, p.y);
    g.rotate(ang);
    var L = 12 * p.s;
    g.strokeStyle = "#3a2a18";
    g.lineWidth = Math.max(1.6, 2.1 * p.s);
    g.beginPath(); g.moveTo(-L, 0); g.lineTo(L * 0.35, 0); g.stroke();
    g.fillStyle = "#fffaf0";
    g.beginPath(); g.moveTo(L * 0.55, 0); g.lineTo(L * 0.1, -3 * p.s); g.lineTo(L * 0.1, 3 * p.s); g.closePath(); g.fill();
    g.fillStyle = "rgba(255,110,80,0.95)";
    g.beginPath(); g.moveTo(-L, 0); g.lineTo(-L - 4 * p.s, -3 * p.s); g.lineTo(-L + 1, 0); g.closePath(); g.fill();
    g.restore();
  };

  Game.prototype.drawFx = function (g, fx) {

  Game.PANEL_BTN = { x: W - 122, y: 96, w: 106, h: 28 };

  /* 树的位置（横屏 760×420）：按 tier 分层，layer 内左右分列 */
  var TREE_POS = {
    atk:     [380, 74],
    multi:   [250, 138],

  Game.talentRects = function () {
    var out = [];
    for (var i = 0; i < B.TALENTS.length; i++) {
      var t = B.TALENTS[i], pos = TREE_POS[t.id] || [380, 100 + i * 50];
      out.push({ i: i, cx: pos[0], cy: pos[1], x: pos[0] - Game.NODE_W / 2, y: pos[1] - Game.NODE_H / 2, w: Game.NODE_W, h: Game.NODE_H, id: t.id });

  Game.prototype.drawTalents = function (g, s) {
    var rects = Game.talentRects(), list = B.TALENTS;
    g.fillStyle = "rgba(5,8,11,0.93)";
    g.fillRect(0, 0, W, H);

    g.textAlign = "center";
    g.fillStyle = "rgba(255,214,150,0.9)";
    g.font = "800 15px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("战 斗 天 赋", W / 2, 30);
    g.fillStyle = "rgba(200,220,245,0.55)";
    g.font = "700 10.5px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("只能按连线顺序解锁 · 当前 " + s.souls + " 魂 · 点按钮收起", W / 2, 48);

    // 连线
    for (var li = 0; li < list.length; li++) {
      var t2 = list[li];
      for (var r2 = 0; r2 < t2.req.length; r2++) {
        var from = null, to = null;
        for (var mi = 0; mi < rects.length; mi++) {
          if (rects[mi].id === t2.req[r2]) from = rects[mi];
          if (rects[mi].id === t2.id) to = rects[mi];
        }
        if (!from || !to) continue;
        var on = !!s.talents[t2.id], parentOn = !!s.talents[from.id];
        g.strokeStyle = on ? "rgba(150,235,180,0.92)" : (parentOn ? "rgba(255,210,130,0.8)" : "rgba(255,255,255,0.22)");
        g.lineWidth = on ? 3 : 2.2;
        g.beginPath();
        g.moveTo(from.cx, from.y + from.h);
        var midY = (from.y + from.h + to.y) / 2;
        g.bezierCurveTo(from.cx, midY, to.cx, midY, to.cx, to.y - 7);
        g.stroke();
        // 箭头
        g.fillStyle = on ? "rgba(150,235,180,0.95)" : (parentOn ? "rgba(255,210,130,0.9)" : "rgba(255,255,255,0.25)");
        g.beginPath();
        g.moveTo(to.cx, to.y - 1);
        g.lineTo(to.cx - 5, to.y - 9);
        g.lineTo(to.cx + 5, to.y - 9);
        g.closePath();
        g.fill();
      }
    }
    for (var i = 0; i < rects.length; i++) {
      var r = rects[i], t = list[i];
      if (!t) continue;
      var stt = B.talentState(s, t);
      var owned = stt === "owned";
      rr(g, r.x, r.y, r.w, r.h, 9);
      g.fillStyle = owned ? "rgba(120,200,150,0.2)" : (stt === "ready" ? "rgba(255,190,90,0.22)" : "rgba(255,255,255,0.035)");
      g.fill();
      g.strokeStyle = owned ? "rgba(140,220,170,0.65)" : (stt === "ready" ? "rgba(255,205,120,0.8)" : "rgba(255,255,255,0.1)");
      g.lineWidth = 1.2;
      rr(g, r.x, r.y, r.w, r.h, 9);
      g.stroke();

      g.textAlign = "left";
      g.fillStyle = owned ? "#c9f2d9" : (stt === "locked" ? "rgba(232,220,205,0.72)" : "#fff2dc");
      g.font = "800 12px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText(t.nm, r.x + 10, r.y + 16);
      g.fillStyle = stt === "locked" ? "rgba(215,200,182,0.5)" : "rgba(226,212,194,0.78)";
      g.font = "600 9px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText(t.desc.slice(0, 11), r.x + 10, r.y + 30);
      if (t.desc.length > 11) g.fillText(t.desc.slice(11, 22), r.x + 10, r.y + 42);

      g.textAlign = "right";
      if (owned) {
        g.fillStyle = "rgba(140,220,170,0.9)";
        g.font = "800 9.5px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText(t.repeat ? "Lv" + (s.bought[t.id] || 1) : "已解锁", r.x + r.w - 9, r.y + 16);
      } else if (stt === "locked") {
        g.fillStyle = "rgba(220,205,185,0.35)";
        g.font = "700 9px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText("需前置", r.x + r.w - 9, r.y + 16);
      } else {
        g.fillStyle = stt === "ready" ? "#ffd24a" : "rgba(220,200,180,0.42)";
        g.font = "800 10px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText(B.talentCost(s, t) + " 魂", r.x + r.w - 9, r.y + 16);
      }
    }
  };

  /* ---------------- 启动 ---------------- */
  var game = null, last = 0, saveAcc = 0;

  function toLocal(e) {
    var cv = root.document.getElementById("game");
    if (!cv._rect) cv._rect = cv.getBoundingClientRect();
    var r = cv._rect;
    return { x: (e.clientX - r.left) / (r.width / W), y: (e.clientY - r.top) / (r.height / H) };
  }

  function onDown(e) {
    e.preventDefault();
    var p = toLocal(e);
    var b = Game.PANEL_BTN;
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      game.panelOpen = !game.panelOpen;
      return;
    }
    if (game.panelOpen) {
      var rects = Game.talentRects(), list = B.TALENTS;
      for (var i = 0; i < rects.length; i++) {
        var r = rects[i];
        if (list[i] && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
          B.buyTalent(game.st, list[i].id);
          return;
        }
      }
      game.panelOpen = false;
      return;
    }
    if (p.y >= FIELD.y && p.y <= FIELD.y + FIELD.h) game.tapField(p.x, p.y);
  }

  function boot() {
    var canvas = root.document.getElementById("game");
    game = new Game(canvas);
    game.load();
    fit(canvas);
    root.addEventListener("resize", function () { fit(canvas); });
    canvas.addEventListener("pointerdown", onDown);
    root.addEventListener("visibilitychange", function () { if (game) game.save(); });
    root.addEventListener("beforeunload", function () { if (game) game.save(); });
    last = Date.now();
    loop();
  }

  function fit(canvas) {
    var vw = root.innerWidth || W, vh = root.innerHeight || H;
    var s = Math.min(vw / W, vh / H);
    canvas.style.width = Math.round(W * s) + "px";
    canvas.style.height = Math.round(H * s) + "px";
    canvas._rect = null;
  }

  function loop() {
    var now = Date.now();
    var dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    game.update(dt);
    game.draw();
    saveAcc += dt;
    if (saveAcc > 4) { saveAcc = 0; game.save(); }
    root.requestAnimationFrame(loop);
  }

  root.API = {
    g: function () { return game; },
    info: function () {
      var s = game.st;
      return {
        souls: s.souls, wave: s.wave, kills: s.kills, atk: s.atk, hp: s.hp,
        enemies: s.enemies.length, arrows: s.arrows.length,
        shots: s.shots, misses: s.misses,
        talents: Object.keys(s.talents), retreats: s.retreats
      };
    },
    step: function (n, dt) {
      dt = dt || 1 / 60;
      for (var i = 0; i < (n || 1); i++) game.update(dt);
      game.draw();
      return this.info();
    },
    shootNearest: function () {

    },

    tapAt: function (x, y) { return game.tapField(x, y); }
  };
