        o.start(t0); o.stop(t0 + 0.25);

        o.type = "triangle"; o.frequency.setValueAtTime(880, t0);
        o.frequency.exponentialRampToValueAtTime(1320, t0 + 0.07);
        gn.gain.setValueAtTime(0.045, t0); gn.gain.exponentialRampToValueAtTime(0.001, t0 + 0.09);
        o.start(t0); o.stop(t0 + 0.1);
      }
    } catch (e) {}
  }

  var FR = { idle: [], shoot: [], skeleton: [], redSkel: [], ready: false };
  function loadFrames() {
    var PX = root.__PX;
    if (!PX) return;
    var total = (PX.idle || []).length + (PX.shoot || []).length + (PX.skeleton || []).length;
    if (!total) return;
    var done = 0;
    function finish() { if (++done >= total) { FR.ready = true; deriveBowAnchor(); } }
    (PX.idle || []).forEach(function (f, i) {
      var im = new Image();
      im.onload = finish; im.onerror = finish;
      im.src = f.src;
      FR.idle[i] = { im: im, ax: f.ax, ay: f.ay };
    });
    (PX.shoot || []).forEach(function (f, i) {
      var im = new Image();
      im.onload = finish; im.onerror = finish;
      im.src = f.src;
      FR.shoot[i] = { im: im, ax: f.ax, ay: f.ay };
    });
    (PX.skeleton || []).forEach(function (f, i) {
      var im = new Image();
      im.onload = finish; im.onerror = finish;
      im.src = f.src;
      FR.skeleton[i] = { im: im, ax: f.ax, ay: f.ay };
    });
  }
  loadFrames();

  /* 用射击帧的平均锚点，反推"箭应当从哪里出"（写回 sim 的 CFG） */
  function deriveBowAnchor() {
    var list = FR.shoot.filter(function (f) { return f && f.im && f.im.width; });
    if (!list.length) return;
    var ax = 0, ay = 0;
    list.forEach(function (f) { ax += f.ax; ay += f.ay; });
    ax /= list.length; ay /= list.length;
    var CFG = root.Battle.CFG;
    var sc = 1.55 * (1 - CFG.archerD * 0.13);
    var dw = 128 * sc / 1.55;
    CFG.bowDX = (dw * (ax - 0.42)) / (Game.FIELD.w - 2 * 22) * WORLD_W;
    CFG.bowH = (dw * (0.97 - ay)) / (120 * sc);
  }

  var heroImg = null, heroRed = null, skelImg = null, skelRed = null;
  function tintCopy(im, color) {
    try {
      var cv = document.createElement("canvas");
      cv.width = im.width; cv.height = im.height;
      var c2 = cv.getContext("2d");
      c2.drawImage(im, 0, 0);
      c2.globalCompositeOperation = "source-atop";
      c2.fillStyle = color;
      c2.fillRect(0, 0, cv.width, cv.height);
      return cv;
    } catch (e) { return null; }
  }
  function loadSkel() {
    if (!root.__SKEL_SRC) return;
    var im = new Image();
    im.onload = function () { skelImg = im; skelRed = tintCopy(im, "rgba(255,90,70,0.8)"); };
    im.src = root.__SKEL_SRC;
  }
  loadSkel();
  function loadHero() {
    if (!root.__ARCHER_SRC) return;
    var im = new Image();
    im.onload = function () {
      heroImg = im;
      try {
        var cv = document.createElement("canvas");
        cv.width = im.width; cv.height = im.height;
        var c2 = cv.getContext("2d");
        c2.drawImage(im, 0, 0);
        c2.globalCompositeOperation = "source-atop";
        c2.fillStyle = "rgba(255,70,50,0.85)";
        c2.fillRect(0, 0, cv.width, cv.height);
        heroRed = cv;
      } catch (e) {}
    };
    im.src = root.__ARCHER_SRC;
  }
  loadHero();

  function Game(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.st = B.newState((Date.now() % 99991) + 5);
    this.aim = null;
    this.lastSfxShot = -9;
    this.lastSfxHurt = -9;
    this.shake = 0;
  }

  Game.FIELD = FIELD;
  Game.proj = proj;

  Game.prototype.save = function () {
    var s = this.st;
    try {
      root.localStorage.setItem("oretap_bow_save", JSON.stringify({
        souls: s.souls, wave: s.wave, kills: s.kills, atk: s.atk,
        talents: s.talents, bought: s.bought, at: Date.now()
      }));
    } catch (e) {}
  };

  Game.prototype.load = function () {
    var raw = null;
    try { raw = root.localStorage.getItem("oretap_bow_save"); } catch (e) {}
    if (!raw) return;
    try {
      var d = JSON.parse(raw), s = this.st;
      s.souls = d.souls || 0; s.wave = d.wave || 1; s.kills = d.kills || 0;
      s.atk = d.atk || 1; s.talents = d.talents || {}; s.bought = d.bought || {};
      s.maxHp = B.CFG.hpBase; s.hp = s.maxHp;
    } catch (e) {}
  };

  /* 点战场：那个点就是落点（不锁敌）→ 敌人走开就会打空 */
  Game.prototype.tapField = function (px, py) {
    var x = unprojX(px), d = unprojD(py);
    if (x < 0.28) x = 0.28;
    B.shootWorld(this.st, Math.min(1.0, x), d);
    this.aim = { x: x, d: d, t: 0.35 };
    return true;
  };

  Game.prototype.update = function (dt) {
    var s = this.st;
    B.step(s, dt);
    if (this.aim) { this.aim.t -= dt; if (this.aim.t <= 0) this.aim = null; }
    if (s.lastShot !== this.lastSfxShot && s.t - s.lastShot < 0.1) { sfx("shot"); this.lastSfxShot = s.lastShot; }
    if (s.lastHurt !== this.lastSfxHurt && s.t - s.lastHurt < 0.1) {
      sfx("hurt"); this.lastSfxHurt = s.lastHurt; this.shake = 0.35;
    }
    if (s.remanHits > (this.lastReman || 0)) { sfx("spring"); this.lastReman = s.remanHits; }
    if (this.shake > 0) this.shake -= dt;
  };

  Game.prototype.draw = function () {
    var g = this.ctx, s = this.st, i;
    g.clearRect(0, 0, W, H);
    var bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#0a0e12");
    bg.addColorStop(0.55, "#090c10");
    bg.addColorStop(1, "#05070a");
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);

    g.save();
    if (this.shake > 0) {
      var sh2 = this.shake * 10;
      g.translate((Math.random() - 0.5) * sh2, (Math.random() - 0.5) * sh2 * 0.6);
    }
    this.drawScene(g, s);
    g.restore();
    this.drawHud(g, s);

    // 落点提示
    if (this.aim) {
      var ap = proj(this.aim.x, this.aim.d, 0);
      g.strokeStyle = "rgba(255,220,150," + (this.aim.t * 1.4) + ")";
      g.lineWidth = 1.6;
      g.beginPath(); g.ellipse(ap.x, ap.y, 9, 4, 0, 0, 6.283); g.stroke();
    }

    // 敌人（按纵深排序：远处先画）
    var list = s.enemies.slice().sort(function (a, b) { return b.d - a.d; });
    for (i = 0; i < list.length; i++) this.drawEnemy(g, list[i], s);

    // 弓手
    this.drawArcher(g, B.CFG.archerX, B.CFG.archerD, "rgba(200,90,70,0.92)", 1);
    if (B.has(s, "archer2")) this.drawArcher(g, B.CFG.archerX - 0.05, B.CFG.archerD + 0.42, "rgba(80,130,210,0.92)", 0.92);

    // 箭 + 拖影
    for (i = 0; i < s.arrows.length; i++) this.drawArrow(g, s.arrows[i]);

    // 飘字
    for (i = 0; i < s.pops.length; i++) {
      var pop = s.pops[i];
      var pp = proj(pop.x, pop.d, pop.h || 0.5);
      g.globalAlpha = Math.min(1, pop.t);
      g.fillStyle = pop.soul ? "#ffd24a" : "#ffb08a";
      g.font = "800 " + Math.round(13 * pp.s) + "px -apple-system,Segoe UI,Roboto,sans-serif";
      g.textAlign = "center";
      g.fillText(pop.text, pp.x, pp.y);
      g.globalAlpha = 1;
    }
    // 箭毯（画在敌人之上，保证不被挡）
    for (i = 0; i < s.groundArrows.length; i++) this.drawLatticeArrow(g, s.groundArrows[i], s);
    for (i = 0; i < s.fx.length; i++) this.drawFx(g, s.fx[i]);

    if (s.hurtFlash > 0.01) {
      var hv = g.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 0.72);
      hv.addColorStop(0, "rgba(200,40,30,0)");
      hv.addColorStop(1, "rgba(200,40,30," + (0.42 * s.hurtFlash) + ")");
      g.fillStyle = hv;
      g.fillRect(0, 0, W, H);
    }

    if (s.invuln > 0) {
      g.fillStyle = "rgba(255,90,60," + (0.05 + 0.05 * Math.sin(s.t * 18)) + ")";
      g.fillRect(0, 0, W, H);
    }

    if (this.panelOpen) this.drawTalents(g, s);
    this.drawPanelButton(g, s);
  };

  Game.prototype.drawPanelButton = function (g, s) {
    var b = Game.PANEL_BTN;
    var avail = 0;
    for (var i = 0; i < B.TALENTS.length; i++) if (B.talentState(s, B.TALENTS[i]) === "ready") avail++;
    g.fillStyle = "#0b0f12";
    g.fillRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4);
    g.fillStyle = avail ? "#d9a13c" : "#1b232a";
    g.fillRect(b.x, b.y, b.w, b.h);
    g.fillStyle = avail ? "#ffd88a" : "#2a343c";
    g.fillRect(b.x, b.y, b.w, 2);
    g.textAlign = "center";
    g.fillStyle = avail ? "#241605" : "rgba(230,220,205,0.6)";
    g.font = "800 12px ui-monospace,Consolas,monospace";
    g.fillText(this.panelOpen ? "收起" : ("天赋" + (avail ? " · " + avail : "")), b.x + b.w / 2, b.y + b.h / 2);
  };

  /* ---------- 场景：横版洞窟 ---------- */
  Game.prototype.drawScene = function (g, s) {
    var FLOOR_TOP = GROUND - 150;

    /* 背墙：32x16 硬边砖块 */
    g.fillStyle = "#141a20";
    g.fillRect(0, FIELD.y, W, FLOOR_TOP - FIELD.y);
    var brickW = 32, brickH = 16;
    for (var by = 0; by * brickH < FLOOR_TOP - FIELD.y; by++) {
      for (var bx = 0; bx * brickW < W; bx++) {
        var off = (by % 2) * (brickW / 2);
        var x0 = bx * brickW + off, y0 = FIELD.y + by * brickH;
        if (y0 > FLOOR_TOP - brickH) continue;
        var n = ((bx * 7 + by * 13) % 5);
        g.fillStyle = n === 0 ? "#1b232b" : (n === 1 ? "#202a33" : (n === 2 ? "#171f26" : "#1d262e"));
        g.fillRect(x0 + 1, y0 + 1, brickW - 2, brickH - 2);
      }
    }

    /* 墙上的像素火把 */
    for (var t2 = 0; t2 < 3; t2++) {
      var tx = Math.round(110 + t2 * 260), ty = Math.round(FLOOR_TOP - 96);
      // 支架
      g.fillStyle = "#3a2a1c";
      g.fillRect(tx - 2, ty, 4, 14);
      // 火焰（像素块）
      var fl = Math.floor(s.t * 8 + t2) % 2;
      g.fillStyle = "#ff9d3c";
      g.fillRect(tx - 4, ty - 10, 8, 10);
      g.fillStyle = "#ffcf5a";
      g.fillRect(tx - 2, ty - 14 - fl * 2, 4, 8);
      g.fillStyle = "#fff2b0";
      g.fillRect(tx - 1, ty - 12 - fl * 2, 2, 4);
      // 像素光晕（三圈阶梯透明，不用渐变）
      g.fillStyle = "rgba(255,170,70,0.05)";
      g.fillRect(tx - 22, ty - 26, 44, 44);
      g.fillStyle = "rgba(255,170,70,0.06)";
      g.fillRect(tx - 14, ty - 20, 28, 32);
      g.fillStyle = "rgba(255,190,90,0.08)";
      g.fillRect(tx - 8, ty - 16, 16, 22);
    }

    /* 地面：16px 像素砖，硬边 */
    var floorY0 = FLOOR_TOP;
    g.fillStyle = "#241d16";
    g.fillRect(0, floorY0, W, H - floorY0);
    var tile = 32;
    for (var ty2 = 0; floorY0 + ty2 * 16 < H; ty2++) {
      for (var tx2 = 0; tx2 * tile < W; tx2++) {
        var px = tx2 * tile + (ty2 % 2) * (tile / 2), py = floorY0 + ty2 * 16;
        if (py > H) continue;
        var m = ((tx2 * 5 + ty2 * 11) % 6);
        g.fillStyle = m === 0 ? "#3a2f22" : (m === 1 ? "#332a1f" : (m === 2 ? "#2c241a" : "#362c21"));
        g.fillRect(px + 1, py + 1, tile - 2, 15);
      }
    }
    // 墙脚阴影（硬边两段）
    g.fillStyle = "rgba(0,0,0,0.42)";
    g.fillRect(0, floorY0, W, 6);
    g.fillStyle = "rgba(0,0,0,0.22)";
    g.fillRect(0, floorY0 + 6, W, 6);

    /* 射程标记：地面上的虚线（提示敌人走到这里才会开火） */
    var rangeX = Math.min(W - 30, proj(B.CFG.archerX + B.CFG.range, 0, 0).x);
    g.fillStyle = "rgba(255,205,130,0.28)";
    for (var dy = -1; dy <= 1; dy++) {
      var ry = GROUND - dy * 46;
      for (var ddx = 0; ddx < 5; ddx++) g.fillRect(rangeX + ddx * 6, Math.round(ry), 3, 2);
    }
  };

  Game.prototype.drawHud = function (g, s) {
    g.textAlign = "left"; g.textBaseline = "middle";
    g.fillStyle = "rgba(230,200,160,0.7)";
    g.font = "700 10.5px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("第 " + s.wave + " 波", 20, 20);

    g.font = "800 19px -apple-system,Segoe UI,Roboto,sans-serif";

    var hpW = 128;

    g.fillStyle = s.hp / s.maxHp > 0.35 ? "#5fd07a" : "#e05a4a";
    g.fillRect(150, 16, Math.round(hpW * Math.max(0, s.hp / s.maxHp)), 10);
    g.textAlign = "center";
    g.fillStyle = "rgba(255,255,255,0.55)";
    g.font = "700 9.5px -apple-system,Segoe UI,Roboto,sans-serif";

    g.textAlign = "right";

    g.fillText("伤害 " + s.atk, W - 160, 20);
    g.fillStyle = "#ffd24a";
    g.font = "800 19px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText(s.souls + " 魂", W - 22, 40);
    g.fillStyle = "rgba(200,220,245,0.45)";
    g.font = "600 9.5px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("自动瞄准射击中 · 点敌人可手动补一箭", W - 22, 58);
    g.fillStyle = "rgba(200,220,245,0.3)";
    if (s.groundArrows && s.groundArrows.length > 0) {
      g.fillStyle = "rgba(255,205,130,0.9)";
      g.fillText("插地 " + s.groundArrows.length + " 支 · 已填装", W - 18, 76);
    }
  };

  Game.prototype.drawEnemy = function (g, e, s) {
    var p = proj(e.x, e.d, 0);
    var sc = Math.max(0.62, p.s);
    var pxScale = 1.12 * (sc / 1.55);
    var dw = 64 * pxScale, dh = 64 * pxScale;
    var fade = 1 + Math.min(0, e.d) * 0.35;
    g.globalAlpha = Math.max(0.5, fade);

    g.fillStyle = "rgba(0,0,0,0.42)";
    g.beginPath(); g.ellipse(p.x, p.y + 1, dw * 0.24, dh * 0.05, 0, 0, 6.283); g.fill();

    // 走路帧（停下咬人时停在最后一帧）
    var frames = FR.skeleton;
    var frame = null;
    if (frames.length) {
      var idx = (e.x > B.CFG.archerX + 0.06)
        ? Math.floor((s.t * 8 + (e.anim || 0)) % frames.length)
        : 0;
      frame = frames[idx];
    }

    g.imageSmoothingEnabled = false;
    if (frame && frame.im && frame.im.width) {
      if (e.hit > 0.05) {
        g.globalAlpha = Math.max(0.5, fade) * 0.9;
        g.drawImage(frame.im, p.x - dw / 2, p.y - dh * 0.97, dw, dh);
        g.globalAlpha = Math.max(0.5, fade);
        g.fillStyle = "rgba(255,70,50,0.45)";
        g.beginPath(); g.ellipse(p.x, p.y - dh * 0.45, dw * 0.34, dh * 0.42, 0, 0, 6.283); g.fill();
      } else {
        g.drawImage(frame.im, p.x - dw / 2, p.y - dh * 0.97, dw, dh);
      }
    }
    g.imageSmoothingEnabled = true;

    // 像素血条
    var bw = Math.round(dw * 0.44), bh = 4;
    var bx = Math.round(p.x - bw / 2), by = Math.round(p.y - dh * 0.97 - 7);
    g.fillStyle = "#0a0c0e";
    g.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    g.fillStyle = "#3a1414";
    g.fillRect(bx, by, bw, bh);
    g.fillStyle = "#e05a4a";
    g.fillRect(bx, by, Math.round(bw * Math.max(0, e.hp / e.maxHp)), bh);
    g.globalAlpha = 1;
  };

  Game.prototype.drawArcher = function (g, x, d, cloak, k) {
    var p = proj(x, d, 0), s = this.st;
    var sc = p.s * (k || 1);
    var pxScale = 1.12 * (sc / 1.55);
    var dw = 64 * pxScale, dh = 64 * pxScale;
    var sinceShot = s.t - (s.lastShot || -9);
    var sinceHurt = s.t - (s.lastHurt || -9);

    g.save();
    g.translate(p.x, p.y);
    // 影子
    g.fillStyle = "rgba(0,0,0,0.42)";
    g.beginPath(); g.ellipse(0, 2, dw * 0.24, dh * 0.055, 0, 0, 6.283); g.fill();

    // 猎犬（脚边，会小跑）
    if (B.has(s, "hound")) {
      var hx = -dw * 0.36 + Math.sin(s.t * 9) * 2 * sc, hy = -2 * sc;
      g.fillStyle = "#6b5440";
      g.beginPath(); g.ellipse(hx, hy - 5 * sc, 9 * sc, 4.4 * sc, 0, 0, 6.283); g.fill();
      g.beginPath(); g.ellipse(hx + 8 * sc, hy - 9 * sc, 5 * sc, 3.8 * sc, -0.3, 0, 6.283); g.fill();
      g.beginPath(); g.moveTo(hx + 11 * sc, hy - 10 * sc); g.lineTo(hx + 14 * sc, hy - 14 * sc); g.lineTo(hx + 10 * sc, hy - 12 * sc); g.closePath(); g.fill();
      g.strokeStyle = "#6b5440"; g.lineWidth = 1.6 * sc;
      g.beginPath(); g.moveTo(hx - 8 * sc, hy - 6 * sc); g.lineTo(hx - 13 * sc, hy - 10 * sc + (Math.sin(s.t * 9) * 2)); g.stroke();
    }

    // 选帧：受伤 → 抖动；射击窗口 → 射击序列；否则待机循环
    var frame = null, isShoot = false;
    if (sinceShot < 0.55 && FR.shoot.length) {
      isShoot = true;
      var idx = Math.min(FR.shoot.length - 1, Math.floor((sinceShot / 0.55) * FR.shoot.length));
      frame = FR.shoot[idx];
    } else if (FR.idle.length) {
      frame = FR.idle[Math.floor(s.t * 7) % FR.idle.length];
    }

    if (frame && frame.im && frame.im.width) {
      g.imageSmoothingEnabled = false;
      var jitter = sinceHurt < 0.3 ? (Math.random() - 0.5) * 3 * sc : 0;
      g.save();
      g.translate(jitter, 0);
      if (sinceHurt < 0.3) {
        g.globalAlpha = 0.85;
        g.drawImage(frame.im, -dw * 0.42, -dh * 0.97, dw, dh);
        if (skelRed) { /* 受击红闪 */ }
        g.globalAlpha = 1;
        g.globalCompositeOperation = "source-atop";
      }
      g.drawImage(frame.im, -dw * 0.42, -dh * 0.97, dw, dh);
      g.globalCompositeOperation = "source-over";
      g.restore();
      g.imageSmoothingEnabled = true;
      // 受击红晕
      if (sinceHurt < 0.3) {
        g.fillStyle = "rgba(255,60,40," + (0.35 * (1 - sinceHurt / 0.3)) + ")";
        g.beginPath(); g.ellipse(0, -dh * 0.45, dw * 0.36, dh * 0.45, 0, 0, 6.283); g.fill();
      }
    }

    // 开火闪光（标记弓口）
    if (sinceShot < 0.14) {
      var bp = proj(x + (root.Battle.CFG.bowDX || 0.06), d, (root.Battle.CFG.bowH || 0.41));
      var fl = 1 - sinceShot / 0.14;
      g.fillStyle = "rgba(255,240,190," + (0.85 * fl) + ")";
      g.fillRect(bp.x - 3, bp.y - 3, 6, 6);
      g.fillStyle = "rgba(255,200,110," + (0.5 * fl) + ")";
      g.fillRect(bp.x - 6, bp.y - 1, 12, 2);
      g.fillRect(bp.x - 1, bp.y - 6, 2, 12);
    }

    // 猎鹰（肩上，会拍翅）
    if (B.has(s, "falcon")) {
      var fy = -dh * 0.84 + Math.sin(s.t * 4) * 2 * sc;
      var flap = Math.sin(s.t * 11) * 3 * sc;
      g.fillStyle = "#d9c9a8";
      g.beginPath(); g.ellipse(-dw * 0.05, fy, 5 * sc, 3.4 * sc, -0.2, 0, 6.283); g.fill();
      g.fillStyle = "#b8a88a";
      g.beginPath();
      g.moveTo(-dw * 0.07, fy - 1 * sc);
      g.quadraticCurveTo(2 * sc, fy - 11 * sc + flap, 9 * sc, fy - 6 * sc + flap * 0.5);
      g.quadraticCurveTo(2 * sc, fy - 3 * sc, -dw * 0.07, fy + 1 * sc);
      g.closePath(); g.fill();
      g.fillStyle = "#7a6a52";
      g.beginPath(); g.arc(dw * 0.05, fy - 2 * sc, 1.4 * sc, 0, 6.283); g.fill();
    }
    g.restore();
  };

  /* 箭：按真实速度方向旋转 + 3 点拖影，看得出是抛物线 */
  Game.prototype.drawArrow = function (g, ar) {
    var i, B2 = root.Battle.CFG;
    // 走过的拖尾（更粗）
    if (ar.trail && ar.trail.length > 1) {
      for (i = 0; i < ar.trail.length - 1; i++) {
        var t1 = ar.trail[i], t2 = ar.trail[i + 1];
        var p1 = proj(t1.x, t1.d, t1.y), p2 = proj(t2.x, t2.d, t2.y);
        g.strokeStyle = "rgba(255,236,190," + (0.04 + 0.28 * (i / ar.trail.length)) + ")";
        g.lineWidth = 0.6 + 1.3 * (i / ar.trail.length);
        g.beginPath(); g.moveTo(p1.x, p1.y); g.lineTo(p2.x, p2.y); g.stroke();
      }
    }
    var p = proj(ar.x, ar.d, ar.y);
    var pv = proj(ar.x + 0.012, ar.d + (ar.vd || 0) * 0.012, ar.y + ar.vy * 0.012);
    var ang = Math.atan2(pv.y - p.y, pv.x - p.x);
    // 地面影子，帮助看出高度
    var gs = proj(ar.x, ar.d, 0);
    g.fillStyle = "rgba(0,0,0,0.22)";
    g.beginPath(); g.ellipse(gs.x, gs.y, 3.2 * gs.s, 1.4 * gs.s, 0, 0, 6.283); g.fill();

    g.save();
    g.translate(p.x, p.y);
    g.rotate(ang);
    var L = 15 * p.s;
    g.shadowColor = "rgba(255,230,170,0.55)";
    g.shadowBlur = 4 * p.s;
    g.strokeStyle = "#f6ecd6";
    g.lineWidth = Math.max(1.6, 2.0 * p.s);
    g.beginPath(); g.moveTo(-L, 0); g.lineTo(L * 0.35, 0); g.stroke();
    g.fillStyle = "#ffffff";
    g.beginPath(); g.moveTo(L * 0.72, 0); g.lineTo(L * 0.18, -3.4 * p.s); g.lineTo(L * 0.18, 3.4 * p.s); g.closePath(); g.fill();
    g.fillStyle = "#ff7a5a";
    g.beginPath(); g.moveTo(-L, 0); g.lineTo(-L - 5 * p.s, -3.4 * p.s); g.lineTo(-L + 1, 0); g.closePath(); g.fill();
    g.shadowBlur = 0;
    g.restore();
  };

  Game.prototype.drawLatticeArrow = function (g, ga, s) {
    var gp = proj(ga.x, ga.d, 0);
    var spent = (ga.hops || 0) >= 2;
    var a = Math.min(1, ga.life / 1.5) * (spent ? 0.4 : 1);
    g.globalAlpha = a;
    if (!spent) {
      var pulse = 0.5 + 0.35 * Math.sin(s.t * 3.6 + ga.x * 14);
      var glow = g.createRadialGradient(gp.x, gp.y - 2, 1, gp.x, gp.y - 2, 20 * gp.s);
      glow.addColorStop(0, "rgba(255,220,150," + (0.5 * pulse) + ")");
      glow.addColorStop(1, "rgba(255,170,80,0)");
      g.fillStyle = glow;
      g.beginPath(); g.ellipse(gp.x, gp.y - 2, 20 * gp.s, 9 * gp.s, 0, 0, 6.283); g.fill();
      g.strokeStyle = "rgba(255,235,180," + (0.75 * pulse) + ")";
      g.lineWidth = 1.8;
      g.beginPath(); g.ellipse(gp.x, gp.y - 1, 13 * gp.s, 5.2 * gp.s, 0, 0, 6.283); g.stroke();
      g.strokeStyle = "rgba(255,220,150," + (0.3 * pulse) + ")";
      g.beginPath(); g.ellipse(gp.x, gp.y - 1, 7 * gp.s, 2.8 * gp.s, 0, 0, 6.283); g.stroke();
    }
    g.shadowColor = spent ? "transparent" : "rgba(255,230,160,0.85)";
    g.shadowBlur = spent ? 0 : 8;
    g.strokeStyle = spent ? "#6f5f4a" : "#fffaf0";
    g.lineWidth = Math.max(3, 3.6 * gp.s);
    g.beginPath();
    g.moveTo(gp.x + 1, gp.y + 1);
    g.lineTo(gp.x - 10 * gp.s, gp.y - 26 * gp.s);
    g.stroke();
    // 箭头（插在地里，露出的尾羽端）
    g.fillStyle = spent ? "rgba(150,130,100,0.65)" : "#ff6a4a";
    g.beginPath();
    g.moveTo(gp.x - 10 * gp.s, gp.y - 26 * gp.s);
    g.lineTo(gp.x - 17 * gp.s, gp.y - 31 * gp.s);
    g.lineTo(gp.x - 7 * gp.s, gp.y - 30 * gp.s);
    g.closePath(); g.fill();
    g.fillStyle = spent ? "rgba(150,130,100,0.5)" : "#fff2d8";
    g.beginPath();
    g.moveTo(gp.x - 10 * gp.s, gp.y - 26 * gp.s);
    g.lineTo(gp.x - 13 * gp.s, gp.y - 33 * gp.s);
    g.lineTo(gp.x - 6 * gp.s, gp.y - 31 * gp.s);
    g.closePath(); g.fill();
    g.shadowBlur = 0;
    g.globalAlpha = 1;
  };

  Game.prototype.drawFx = function (g, fx) {
    if (fx.kind === "boom") {
      var p = proj(fx.x, fx.d, fx.h || 0.3);
      var r = (1 - fx.t / 0.5) * 40 * p.s;
      g.strokeStyle = "rgba(255,170,80," + Math.max(0, fx.t * 1.6) + ")";
      g.lineWidth = 3;
      g.beginPath(); g.arc(p.x, p.y, r, 0, 6.283); g.stroke();
    } else if (fx.kind === "retreat") {
      g.fillStyle = "rgba(6,8,10," + Math.min(0.7, fx.t) + ")";
      g.fillRect(0, 0, W, H);
      g.textAlign = "center";
      g.fillStyle = "rgba(255,190,140," + Math.min(1, fx.t) + ")";
      g.font = "800 17px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("被压退了 · 退回营地", W / 2, 290);
    } else if (fx.kind === "spring") {
      var sp = proj(fx.x, fx.d, 0.05);
      var rr2 = (1 - fx.t / 0.35) * 22 * sp.s;
      g.strokeStyle = "rgba(255,240,200," + Math.max(0, fx.t * 2.4) + ")";
      g.lineWidth = 2;
      g.beginPath(); g.arc(sp.x, sp.y - 4, rr2, 0, 6.283); g.stroke();
    } else if (fx.kind === "talent") {
      g.textAlign = "center";
      g.fillStyle = "rgba(160,230,190," + Math.min(1, fx.t) + ")";
      g.font = "800 14px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText("解锁：" + fx.text, W / 2, 120 + (1.2 - fx.t) * 10);
    }
  };

  Game.PANEL_BTN = { x: W - 122, y: 96, w: 106, h: 28 };

  /* 树的位置（横屏 760×420）：按 tier 分层，layer 内左右分列 */
  var TREE_POS = {
    atk:      [380, 56],
    multi:    [200, 104], rapid:   [560, 104],
    pierce:   [140, 152], armor:   [300, 152], combo: [460, 152], slowfield: [660, 152],
    explode:  [90, 200],  thorns:  [250, 200], hawk:  [510, 200], snare:     [690, 200],
    oilfire:  [90, 248],  hound:   [250, 248], archer2:[510, 248], totem:    [690, 248],
    rain:     [140, 296], bastion: [300, 296], falcon:[470, 296],
    storm:    [90, 344],  immortal:[300, 344], queen: [470, 344], quake:     [690, 344]
  };
  var BR_COLOR = {
    spread:  "255,180,90",
    speed:   "120,180,255",
    trap:    "130,220,160",
    survive: "200,150,235",
    root:    "255,215,140"
  };
  Game.NODE_W = 104;
  Game.NODE_H = 38;

  Game.talentRects = function () {
    var out = [];
    for (var i = 0; i < B.TALENTS.length; i++) {
      var t = B.TALENTS[i], pos = TREE_POS[t.id] || [380, 100 + i * 50];
      out.push({ i: i, cx: pos[0], cy: pos[1], x: pos[0] - Game.NODE_W / 2, y: pos[1] - Game.NODE_H / 2, w: Game.NODE_W, h: Game.NODE_H, id: t.id });
    }
    return out;
  };

  Game.prototype.drawTalents = function (g, s) {
    var rects = Game.talentRects(), list = B.TALENTS;
    g.fillStyle = "rgba(5,8,11,0.93)";
    g.fillRect(0, 0, W, H);

    g.textAlign = "center";
    g.fillStyle = "rgba(255,214,150,0.9)";
    g.font = "800 15px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("战 斗 天 赋", W / 2, 30);
    g.fillStyle = "rgba(200,220,245,0.55)";
    g.font = "700 10.5px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillText("只能按连线顺序解锁 · 当前 " + s.souls + " 魂 · 点右上收起", W / 2, 46);
    var legend = [["spread","散射/爆破"],["speed","疾风/伙伴"],["trap","陷阱/控场"],["survive","生存"]];
    for (var lg = 0; lg < legend.length; lg++) {
      g.fillStyle = "rgba(" + BR_COLOR[legend[lg][0]] + ",0.9)";
      g.beginPath(); g.arc(60 + lg * 116, 62, 4, 0, 6.283); g.fill();
      g.fillStyle = "rgba(220,225,235,0.65)";
      g.font = "700 9px -apple-system,Segoe UI,Roboto,sans-serif";
      g.textAlign = "left";
      g.fillText(legend[lg][1], 68 + lg * 116, 62);
      g.textAlign = "center";
    }

    // 连线
    for (var li = 0; li < list.length; li++) {
      var t2 = list[li];
      for (var r2 = 0; r2 < t2.req.length; r2++) {
        var from = null, to = null;
        for (var mi = 0; mi < rects.length; mi++) {
          if (rects[mi].id === t2.req[r2]) from = rects[mi];
          if (rects[mi].id === t2.id) to = rects[mi];
        }
        if (!from || !to) continue;
        var on = !!s.talents[t2.id], parentOn = !!s.talents[from.id];
        g.strokeStyle = on ? "rgba(150,235,180,0.92)" : (parentOn ? "rgba(255,210,130,0.8)" : "rgba(255,255,255,0.22)");
        g.lineWidth = on ? 3 : 2.2;
        g.beginPath();
        g.moveTo(from.cx, from.y + from.h);
        var midY = (from.y + from.h + to.y) / 2;
        g.bezierCurveTo(from.cx, midY, to.cx, midY, to.cx, to.y - 7);
        g.stroke();
        // 箭头
        g.fillStyle = on ? "rgba(150,235,180,0.95)" : (parentOn ? "rgba(255,210,130,0.9)" : "rgba(255,255,255,0.25)");
        g.beginPath();
        g.moveTo(to.cx, to.y - 1);
        g.lineTo(to.cx - 5, to.y - 9);
        g.lineTo(to.cx + 5, to.y - 9);
        g.closePath();
        g.fill();
      }
    }
    for (var i = 0; i < rects.length; i++) {
      var r = rects[i], t = list[i];
      if (!t) continue;
      var stt = B.talentState(s, t);
      var owned = stt === "owned";
      var bc = BR_COLOR[t.br] || "255,215,140";
      g.fillRect(r.x, r.y, r.w, r.h);
      g.fillStyle = owned ? "rgba(" + bc + ",0.26)" : (stt === "ready" ? "rgba(" + bc + ",0.14)" : "rgba(255,255,255,0.03)");
      g.fill();
      g.strokeStyle = owned ? "rgba(" + bc + ",0.85)" : (stt === "ready" ? "rgba(" + bc + ",0.55)" : "rgba(255,255,255,0.1)");
      g.lineWidth = 1.2;
      rr(g, r.x, r.y, r.w, r.h, 9);
      g.stroke();
      if (stt === "sealed") {
        g.strokeStyle = "rgba(200,110,110,0.35)";
        g.lineWidth = 1.4;
        g.beginPath(); g.moveTo(r.x + 6, r.y + r.h - 6); g.lineTo(r.x + r.w - 6, r.y + 6); g.stroke();
      }

      g.textAlign = "left";
      g.fillStyle = owned ? "#f2fff5" : (stt === "locked" ? "rgba(232,220,205,0.72)" : "#fff2dc");
      g.font = "800 11.5px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText(t.nm, r.x + 8, r.y + 14);
      g.fillStyle = stt === "locked" ? "rgba(215,200,182,0.5)" : "rgba(230,218,202,0.8)";
      g.font = "600 8px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText(t.desc.slice(0, 12), r.x + 8, r.y + 27);
      if (t.desc.length > 12) g.fillText(t.desc.slice(12, 24), r.x + 8, r.y + 36);

      g.textAlign = "right";
      if (stt === "sealed") {
        g.fillStyle = "rgba(200,120,120,0.85)";
        g.font = "800 9.5px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText("已封闭", r.x + r.w - 8, r.y + 14);
      } else if (owned) {
        g.fillStyle = "rgba(140,220,170,0.9)";
        g.font = "800 9.5px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText(t.repeat ? "Lv" + (s.bought[t.id] || 1) : "已解锁", r.x + r.w - 8, r.y + 14);
      } else if (stt === "locked") {
        g.fillStyle = "rgba(220,205,185,0.35)";
        g.font = "700 9px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText("需前置", r.x + r.w - 8, r.y + 14);
      } else {
        g.fillStyle = stt === "ready" ? "#ffd24a" : "rgba(220,200,180,0.42)";
        g.font = "800 10px -apple-system,Segoe UI,Roboto,sans-serif";
        g.fillText(B.talentCost(s, t) + " 魂", r.x + r.w - 8, r.y + 14);
      }
    }
  };

  /* ---------------- 启动 ---------------- */
  var game = null, last = 0, saveAcc = 0;

  function toLocal(e) {
    var cv = root.document.getElementById("game");
    if (!cv._rect) cv._rect = cv.getBoundingClientRect();
    var r = cv._rect;
    return { x: (e.clientX - r.left) / (r.width / W), y: (e.clientY - r.top) / (r.height / H) };
  }

  function onDown(e) {
    e.preventDefault();
    var p = toLocal(e);
    var b = Game.PANEL_BTN;
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      game.panelOpen = !game.panelOpen;
      return;
    }
    if (game.panelOpen) {
      var rects = Game.talentRects(), list = B.TALENTS;
      for (var i = 0; i < rects.length; i++) {
        var r = rects[i];
        if (list[i] && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
          B.buyTalent(game.st, list[i].id);
          return;
        }
      }
      game.panelOpen = false;
      return;
    }
    if (p.y >= FIELD.y && p.y <= FIELD.y + FIELD.h) game.tapField(p.x, p.y);
  }

  function boot() {
    var canvas = root.document.getElementById("game");
    game = new Game(canvas);
    game.load();
    fit(canvas);
    root.addEventListener("resize", function () { fit(canvas); });
    canvas.addEventListener("pointerdown", onDown);
    root.addEventListener("visibilitychange", function () { if (game) game.save(); });
    root.addEventListener("beforeunload", function () { if (game) game.save(); });
    last = Date.now();
    loop();
  }

  function fit(canvas) {
    var vw = root.innerWidth || W, vh = root.innerHeight || H;
    var s = Math.min(vw / W, vh / H);
    canvas.style.width = Math.round(W * s) + "px";
    canvas.style.height = Math.round(H * s) + "px";
    canvas._rect = null;
  }

  function loop() {
    var now = Date.now();
    var dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    game.update(dt);
    game.draw();
    saveAcc += dt;
    if (saveAcc > 4) { saveAcc = 0; game.save(); }
    root.requestAnimationFrame(loop);
  }

  root.API = {
    g: function () { return game; },
    info: function () {
      var s = game.st;
      return {
        souls: s.souls, wave: s.wave, kills: s.kills, atk: s.atk, hp: s.hp,
        enemies: s.enemies.length, arrows: s.arrows.length,
        shots: s.shots, misses: s.misses,
        talents: Object.keys(s.talents), retreats: s.retreats
      };
    },
    step: function (n, dt) {
      dt = dt || 1 / 60;
      for (var i = 0; i < (n || 1); i++) game.update(dt);
      game.draw();
      return this.info();
    },
    shootNearest: function () {
      var e = B.nearest(game.st);
      if (e) { B.shootWorld(game.st, e.x, e.d); return true; }
      return false;
    },
    buy: function (id) { return B.buyTalent(game.st, id); },
    tapAt: function (x, y) { return game.tapField(x, y); }
  };

  if (root.document.readyState === "loading") root.document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(typeof window !== "undefined" ? window : globalThis);

</script>
</body>
</html>
